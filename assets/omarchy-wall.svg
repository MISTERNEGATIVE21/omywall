<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Glass Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131e"/>
      <stop offset="50%" stop-color="#090b12"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <!-- Neon Aperture Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f000ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Glass Container -->
  <rect x="20" y="20" width="472" height="472" rx="90" ry="90" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="86" ry="86" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="2" filter="url(#subtleGlow)"/>

  <!-- Outer Cyber Orbit Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#purpleGrad)" stroke-width="12" stroke-dasharray="16 12 48 12" filter="url(#glow)" opacity="0.85"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-dasharray="80 16 20 16" filter="url(#glow)" opacity="0.9"/>

  <!-- Aperture Live Screen Shutter Blades -->
  <g filter="url(#glow)">
    <!-- Blade 1 (Top Right) -->
    <path d="M 256 120 C 330 120 392 182 392 256 C 392 290 365 320 330 330 C 350 295 345 235 295 195 Z" fill="url(#cyanGrad)" opacity="0.95"/>
    <!-- Blade 2 (Bottom Right) -->
    <path d="M 392 256 C 392 330 330 392 256 392 C 222 392 192 365 182 330 C 217 350 277 345 317 295 Z" fill="url(#purpleGrad)" opacity="0.95"/>
    <!-- Blade 3 (Bottom Left) -->
    <path d="M 256 392 C 182 392 120 330 120 256 C 120 222 147 192 182 182 C 162 217 167 277 217 317 Z" fill="url(#cyanGrad)" opacity="0.95"/>
    <!-- Blade 4 (Top Left) -->
    <path d="M 120 256 C 120 182 182 120 256 120 C 290 120 320 147 330 182 C 295 162 235 167 195 217 Z" fill="url(#purpleGrad)" opacity="0.95"/>
  </g>

  <!-- Inner Display Frame Grid Lines -->
  <circle cx="256" cy="256" r="88" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" opacity="0.7" stroke-dasharray="12 8"/>

  <!-- Core Pulsing Live Wallpaper Play Node -->
  <circle cx="256" cy="256" r="54" fill="#0b0d14" stroke="url(#cyanGrad)" stroke-width="4" filter="url(#glow)"/>
  <polygon points="244,228 284,256 244,284" fill="url(#cyanGrad)" filter="url(#subtleGlow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="0.9"/>
</svg>
