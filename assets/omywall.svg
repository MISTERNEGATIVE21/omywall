<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Superellipse Gradient -->
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638" />
      <stop offset="100%" stop-color="#0c101d" />
    </linearGradient>

    <!-- Monitor / Frame Border Highlight -->
    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b4866" />
      <stop offset="100%" stop-color="#151b2a" />
    </linearGradient>

    <!-- Screen Sky Sunset Gradient -->
    <linearGradient id="screenSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a113d" />
      <stop offset="35%" stop-color="#5a1854" />
      <stop offset="70%" stop-color="#bf2a59" />
      <stop offset="100%" stop-color="#ff7b39" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d1852" />
      <stop offset="100%" stop-color="#1f0933" />
    </linearGradient>

    <linearGradient id="mountainNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181133" />
      <stop offset="100%" stop-color="#090517" />
    </linearGradient>

    <!-- Cyber / Water Horizon Wave -->
    <linearGradient id="horizonWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00ff9d" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <!-- Subtle Icon Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Screen Clip Path for Rounded Inner Corners -->
    <clipPath id="screenClip">
      <rect x="52" y="60" width="408" height="276" rx="20" ry="20" />
    </clipPath>
  </defs>

  <!-- 1. Superellipse Outer App Icon Squircle Frame (Linux Standard) -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#baseGradient)" filter="url(#dropShadow)" />
  <rect x="17" y="17" width="478" height="478" rx="109" ry="109" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- 2. Desktop Display Stand (Clean Hardware Geometry) -->
  <path d="M 232 376 L 280 376 L 292 428 L 220 428 Z" fill="#182030" stroke="#25324c" stroke-width="3" stroke-linejoin="round" />
  <rect x="176" y="426" width="160" height="14" rx="7" ry="7" fill="#1b2438" stroke="#2c3a59" stroke-width="2" />
  <rect x="236" y="429" width="40" height="4" rx="2" ry="2" fill="#00f5ff" opacity="0.8" />

  <!-- 3. Desktop Display Screen Outer Bezel -->
  <rect x="44" y="52" width="424" height="292" rx="26" ry="26" fill="#0e1320" stroke="url(#frameBorder)" stroke-width="5" />

  <!-- 4. Display Screen Content (Clipped) -->
  <g clip-path="url(#screenClip)">
    <!-- Sky -->
    <rect x="52" y="60" width="408" height="276" fill="url(#screenSky)" />

    <!-- Radiant Celestial Sun -->
    <circle cx="256" cy="190" r="54" fill="url(#sunGradient)" />

    <!-- Retro Horizontal Sun Slices -->
    <rect x="200" y="178" width="112" height="4" fill="#6a1a54" opacity="0.6" />
    <rect x="196" y="190" width="120" height="6" fill="#7d1f56" opacity="0.75" />
    <rect x="192" y="206" width="128" height="8" fill="#992358" opacity="0.85" />
    <rect x="190" y="224" width="132" height="10" fill="#b82959" />

    <!-- Far Mountain Ridge -->
    <polygon points="52,336 120,240 180,275 256,195 330,265 410,215 460,260 460,336" fill="url(#mountainFar)" />

    <!-- Near Mountain Ridge -->
    <polygon points="52,336 80,285 160,240 220,290 280,230 360,310 420,250 460,295 460,336" fill="url(#mountainNear)" />

    <!-- Glowing Vector Wave (Live Motion Accent) -->
    <path d="M 52 300 Q 154 260 256 295 T 460 280 L 460 336 L 52 336 Z" fill="rgba(0, 245, 255, 0.25)" />
    <path d="M 52 300 Q 154 260 256 295 T 460 280" fill="none" stroke="url(#horizonWave)" stroke-width="5" stroke-linecap="round" />

    <!-- Screen Glass Specular Corner Reflection -->
    <polygon points="52,60 220,60 52,228" fill="rgba(255, 255, 255, 0.07)" />
  </g>

  <!-- 5. Modern Minimalist "Full-Screen Expand" Vector Brackets -->
  <!-- Top-Left -->
  <path d="M 78 106 L 78 86 L 98 86" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <!-- Top-Right -->
  <path d="M 434 106 L 434 86 L 414 86" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <!-- Bottom-Left -->
  <path d="M 78 290 L 78 310 L 98 310" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <!-- Bottom-Right -->
  <path d="M 434 290 L 434 310 L 414 310" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Power Status LED Indicator -->
  <circle cx="256" cy="354" r="3.5" fill="#00f5ff" />
</svg>
