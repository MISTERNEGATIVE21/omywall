<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Glass Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121726"/>
      <stop offset="40%" stop-color="#0b0e18"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>

    <!-- Glossy Highlight Gradient -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Neon Aperture Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00b4ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f000ff"/>
      <stop offset="50%" stop-color="#b040ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00b875"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowHigh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Glass Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="3"/>
  <rect x="26" y="26" width="460" height="460" rx="98" ry="98" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.4" filter="url(#subtleGlow)"/>

  <!-- Swirling Neon Vortex Aperture Rings -->
  <g filter="url(#glowHigh)">
    <circle cx="256" cy="226" r="160" fill="none" stroke="url(#purpleGrad)" stroke-width="8" stroke-dasharray="140 30" opacity="0.85"/>
    <circle cx="256" cy="226" r="135" fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-dasharray="100 20 40 20" opacity="0.9"/>
    <circle cx="256" cy="226" r="110" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-dasharray="80 15" opacity="0.85"/>
    <circle cx="256" cy="226" r="85" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="50 10" opacity="0.95"/>
  </g>

  <!-- Core Pulsing Play Button Center -->
  <circle cx="256" cy="226" r="56" fill="#0b0e18" stroke="url(#cyanGrad)" stroke-width="5" filter="url(#glowHigh)"/>
  <polygon points="244,198 284,226 244,254" fill="url(#cyanGrad)" filter="url(#subtleGlow)"/>
  <circle cx="256" cy="226" r="12" fill="#ffffff" opacity="0.95"/>

  <!-- Glass Sheen Diagonal Overlay -->
  <path d="M 24 124 Q 24 24 124 24 L 388 24 Q 440 24 464 64 L 24 380 Z" fill="url(#glassShine)" opacity="0.8"/>

  <!-- Typography: OMYWALL WALLPAPER ENGINE -->
  <text x="256" y="422" fill="url(#textGrad)" font-family="'Outfit', 'Inter', 'SF Pro Display', sans-serif" font-size="34" font-weight="900" letter-spacing="3" text-anchor="middle" filter="url(#subtleGlow)">OMYWALL</text>
  <text x="256" y="446" fill="#00ff9d" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="4" text-anchor="middle" opacity="0.9">WALLPAPER ENGINE</text>
</svg>
