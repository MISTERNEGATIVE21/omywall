<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omywall Connectivity Pill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-glass: rgba(10, 15, 29, 0.75);
      --border-glass: rgba(255, 255, 255, 0.1);
      --cyan-accent: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.4);
      --emerald-accent: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: transparent;
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      min-height: 100vh;
    }

    .pill-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: var(--bg-glass);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border: 1px solid var(--border-glass);
      border-radius: 9999px;
      padding: 8px 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pill-wrapper:hover {
      border-color: rgba(0, 240, 255, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.55), 0 0 20px rgba(0, 240, 255, 0.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pill-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-icon-box {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .pill-icon {
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
      transition: fill 0.3s ease;
    }

    .pill-icon.active {
      fill: var(--cyan-accent);
      filter: drop-shadow(0 0 4px var(--cyan-glow));
    }

    .pill-text-group {
      display: flex;
      flex-direction: column;
    }

    .pill-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-sub {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: var(--border-glass);
    }

    /* Signal Bars */
    .signal-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .bar {
      width: 2.5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 1px;
    }

    .bar.active {
      background: var(--cyan-accent);
      box-shadow: 0 0 4px var(--cyan-glow);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald-accent);
      box-shadow: 0 0 6px var(--emerald-glow);
    }
  </style>
</head>
<body>
  <div class="pill-wrapper">
    <!-- WiFi Section -->
    <div class="pill-section" id="wifi-section">
      <div class="pill-icon-box">
        <svg class="pill-icon" id="wifi-icon" viewBox="0 0 24 24">
          <path d="M12 3C7.5 3 3.5 4.8 0.5 7.7L12 21.5L23.5 7.7C20.5 4.8 16.5 3 12 3ZM12 6C15.4 6 18.5 7.3 20.9 9.5L12 20.2L3.1 9.5C5.5 7.3 8.6 6 12 6Z"/>
        </svg>
      </div>
      <div class="pill-text-group">
        <span class="pill-label" id="wifi-name">Wi-Fi</span>
        <span class="pill-sub" id="wifi-sub">Connecting...</span>
      </div>
      <div class="signal-bars" id="wifi-bars">
        <div class="bar" style="height: 3px;"></div>
        <div class="bar" style="height: 6px;"></div>
        <div class="bar" style="height: 9px;"></div>
        <div class="bar" style="height: 12px;"></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Bluetooth Section -->
    <div class="pill-section" id="bt-section">
      <div class="pill-icon-box">
        <svg class="pill-icon" id="bt-icon" viewBox="0 0 24 24">
          <path d="M14.88 16.29L13 18.17V14.41M13 5.83L14.88 7.71L13 9.59M17.71 7.71L12 2H11V10.59L6.41 6L5 7.41L10.59 13L5 18.59L6.41 20L11 15.41V22H12L17.71 16.29L13.41 12M19.12 12L17.71 10.59L19.12 9.17"/>
        </svg>
      </div>
      <div class="pill-text-group">
        <span class="pill-label" id="bt-name">Bluetooth</span>
        <span class="pill-sub" id="bt-sub">Off</span>
      </div>
    </div>

    <!-- Battery Mini Section (if present) -->
    <div class="divider" id="bat-divider"></div>
    <div class="pill-section" id="bat-section">
      <div class="pill-icon-box">
        <span style="font-size: 11px;" id="bat-emoji">⚡</span>
      </div>
      <div class="pill-text-group">
        <span class="pill-label" id="bat-pct">100%</span>
        <span class="pill-sub" id="bat-sub">AC Power</span>
      </div>
    </div>
  </div>

  <script>
    function updatePill(data) {
      if (!data) return;

      // WiFi
      if (data.wifi) {
        const wifi = data.wifi;
        const icon = document.getElementById('wifi-icon');
        const name = document.getElementById('wifi-name');
        const sub = document.getElementById('wifi-sub');
        const bars = document.querySelectorAll('#wifi-bars .bar');

        if (wifi.connected) {
          icon.classList.add('active');
          name.textContent = wifi.ssid || 'Connected';
          sub.textContent = wifi.ip_address || (wifi.signal_percent + '%');
          
          const sig = wifi.signal_percent || 0;
          bars.forEach((bar, idx) => {
            const threshold = (idx + 1) * 25;
            if (sig >= threshold - 15) {
              bar.classList.add('active');
            } else {
              bar.classList.remove('active');
            }
          });
        } else {
          icon.classList.remove('active');
          name.textContent = 'Disconnected';
          sub.textContent = 'No Network';
          bars.forEach(b => b.classList.remove('active'));
        }
      }

      // Bluetooth
      if (data.bluetooth) {
        const bt = data.bluetooth;
        const icon = document.getElementById('bt-icon');
        const name = document.getElementById('bt-name');
        const sub = document.getElementById('bt-sub');

        if (bt.enabled) {
          icon.classList.add('active');
          if (bt.connected_devices && bt.connected_devices.length > 0) {
            const dev = bt.connected_devices[0];
            name.textContent = dev.name || 'Connected';
            sub.textContent = dev.battery_percent ? `${dev.battery_percent}% bat` : 'Active';
          } else {
            name.textContent = 'Bluetooth';
            sub.textContent = 'No Devices';
          }
        } else {
          icon.classList.remove('active');
          name.textContent = 'Bluetooth';
          sub.textContent = 'Off';
        }
      }

      // Battery
      if (data.battery) {
        const bat = data.battery;
        const batSection = document.getElementById('bat-section');
        const batDivider = document.getElementById('bat-divider');
        if (bat.present) {
          batSection.style.display = 'flex';
          batDivider.style.display = 'block';
          document.getElementById('bat-pct').textContent = (bat.percentage || 100) + '%';
          document.getElementById('bat-sub').textContent = bat.status || (bat.is_charging ? 'Charging' : 'Battery');
          document.getElementById('bat-emoji').textContent = bat.is_charging ? '⚡' : '🔋';
        } else {
          batSection.style.display = 'none';
          batDivider.style.display = 'none';
        }
      }
    }

    async function pollTelemetry() {
      try {
        const res = await fetch('/tmp/omywall_telemetry.json?t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          updatePill(data);
        }
      } catch (e) {
        try {
          const xhr = new XMLHttpRequest();
          xhr.open('GET', 'file:///tmp/omywall_telemetry.json?t=' + Date.now(), true);
          xhr.onload = function() {
            if (xhr.status === 200 || xhr.status === 0) {
              try {
                const data = JSON.parse(xhr.responseText);
                updatePill(data);
              } catch(err) {}
            }
          };
          xhr.send();
        } catch(err) {}
      }
    }

    pollTelemetry();
    setInterval(pollTelemetry, 1000);
  </script>
</body>
</html>
