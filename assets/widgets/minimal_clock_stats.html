<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omywall Minimal Clock & Stats Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-glass: rgba(10, 15, 29, 0.72);
      --border-glass: rgba(255, 255, 255, 0.1);
      --cyan-accent: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.35);
      --emerald-accent: #10b981;
      --amber-accent: #f59e0b;
      --purple-accent: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: transparent;
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      min-height: 100vh;
    }

    .widget-card {
      width: 380px;
      background: var(--bg-glass);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 18px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .widget-card:hover {
      border-color: rgba(0, 240, 255, 0.3);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 240, 255, 0.15);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 10px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cyan-accent);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan-accent);
      box-shadow: 0 0 8px var(--cyan-accent);
      animation: pulse 2s infinite;
    }

    .hostname {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }

    .clock-display {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .time-large {
      font-family: 'JetBrains Mono', monospace;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      text-shadow: 0 0 24px rgba(0, 240, 255, 0.25);
      line-height: 1;
    }

    .time-large span {
      color: var(--cyan-accent);
    }

    .date-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-bar-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .cpu-fill {
      background: linear-gradient(90deg, #00f0ff, #10b981);
      width: 15%;
    }

    .ram-fill {
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      width: 40%;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 10px;
      padding: 8px 12px;
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
  </style>
</head>
<body>
  <div class="widget-card">
    <div class="header-bar">
      <div class="badge-live">
        <div class="badge-dot"></div>
        <span>OMYWALL STATS</span>
      </div>
      <span class="hostname" id="hostname-text">arch-linux</span>
    </div>

    <div class="clock-display">
      <div class="time-large" id="clock-time">12<span>:</span>00<span>:</span>00</div>
      <div class="date-label" id="date-label">Friday, August 14, 2026</div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-header">
          <span>CPU LOAD</span>
          <span id="cpu-percent">0%</span>
        </div>
        <div class="stat-val" id="cpu-freq">-- GHz</div>
        <div class="stat-bar-track">
          <div class="stat-bar-fill cpu-fill" id="cpu-bar"></div>
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-header">
          <span>MEMORY</span>
          <span id="ram-percent">0%</span>
        </div>
        <div class="stat-val" id="ram-usage">-- / -- GB</div>
        <div class="stat-bar-track">
          <div class="stat-bar-fill ram-fill" id="ram-bar"></div>
        </div>
      </div>
    </div>

    <div class="footer-bar">
      <div class="footer-item" id="wifi-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
        <span id="wifi-ssid">Online</span>
      </div>

      <div class="footer-item" id="battery-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="6" width="18" height="12" rx="2" ry="2"/>
          <line x1="23" y1="13" x2="23" y2="11"/>
        </svg>
        <span id="battery-status">AC Power</span>
      </div>
    </div>
  </div>

  <script>
    function updateClockLocal() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock-time').innerHTML = `${h}<span>:</span>${m}<span>:</span>${s}`;

      const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
      document.getElementById('date-label').textContent = now.toLocaleDateString('en-US', options);
    }

    async function pollTelemetry() {
      try {
        const res = await fetch('file:///tmp/omywall_telemetry.json', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          renderTelemetry(data);
        }
      } catch (err) {
        // Local fallback
      }
    }

    function renderTelemetry(data) {
      if (data.hostname) {
        document.getElementById('hostname-text').textContent = data.hostname;
      }
      if (data.cpu) {
        const cpu = Math.round(data.cpu.usage_percent || 0);
        document.getElementById('cpu-percent').textContent = `${cpu}%`;
        document.getElementById('cpu-bar').style.width = `${Math.min(cpu, 100)}%`;
        if (data.cpu.frequency_mhz) {
          document.getElementById('cpu-freq').textContent = `${(data.cpu.frequency_mhz / 1000).toFixed(1)} GHz`;
        }
      }
      if (data.ram) {
        const ramPct = Math.round(data.ram.percent || 0);
        document.getElementById('ram-percent').textContent = `${ramPct}%`;
        document.getElementById('ram-bar').style.width = `${Math.min(ramPct, 100)}%`;
        document.getElementById('ram-usage').textContent = `${(data.ram.used_mb / 1024).toFixed(1)} / ${(data.ram.total_mb / 1024).toFixed(1)} GB`;
      }
      if (data.wifi && data.wifi.connected) {
        document.getElementById('wifi-ssid').textContent = data.wifi.ssid || 'WiFi Connected';
      }
      if (data.battery) {
        document.getElementById('battery-status').textContent = `${Math.round(data.battery.percentage)}% ${data.battery.state === 'Charging' ? '⚡' : ''}`;
      }
    }

    setInterval(updateClockLocal, 500);
    setInterval(pollTelemetry, 1000);
    updateClockLocal();
    pollTelemetry();
  </script>
</body>
</html>
