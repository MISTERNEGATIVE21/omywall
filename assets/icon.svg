<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14192d" />
      <stop offset="100%" stop-color="#070913" />
    </radialGradient>
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>
    <linearGradient id="prism1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0a1936" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="prism2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#120c24" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="prism3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b040ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonRing)" stroke-width="8" opacity="0.35" />
  <g filter="url(#glowFilter)">
    <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" fill="none" stroke="url(#neonRing)" stroke-dasharray="8 6" stroke-width="5" />
    <polygon points="256,116 376,186 256,256 136,186" fill="url(#prism1)" stroke="#00f0ff" stroke-width="2" />
    <polygon points="136,186 256,256 256,396 136,326" fill="url(#prism3)" stroke="#b040ff" stroke-width="2" />
    <polygon points="256,256 376,186 376,326 256,396" fill="url(#prism2)" stroke="#00ff9d" stroke-width="2" />
    <circle cx="256" cy="256" r="28" fill="#00f0ff" opacity="0.9" />
    <circle cx="256" cy="256" r="14" fill="#ffffff" />
  </g>
</svg>
