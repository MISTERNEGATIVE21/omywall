<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar Energy Fluid - OMYWALL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #070300; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .overlay {
            position: absolute;
            top: 24px;
            left: 28px;
            color: rgba(255, 140, 0, 0.85);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="overlay">OMYWALL 3D SOLAR ENERGY FLUID</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, cx, cy;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        const numNodes = 120;
        const nodes = [];
        for (let i = 0; i < numNodes; i++) {
            nodes.push({
                x: (Math.random() - 0.5) * width,
                y: (Math.random() - 0.5) * height,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                radius: Math.random() * 3 + 1.5,
                hue: Math.random() * 50 + 10
            });
        }

        let time = 0;
        function render() {
            time += 0.01;

            ctx.fillStyle = 'rgba(7, 3, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Core Glow
            const coreGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 380);
            coreGrad.addColorStop(0, 'rgba(255, 120, 0, 0.3)');
            coreGrad.addColorStop(0.6, 'rgba(255, 40, 0, 0.1)');
            coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = coreGrad;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < numNodes; i++) {
                const n = nodes[i];
                n.x += n.vx + Math.sin(time + n.y * 0.01) * 0.5;
                n.y += n.vy + Math.cos(time + n.x * 0.01) * 0.5;

                if (n.x < -width / 2) n.x = width / 2;
                if (n.x > width / 2) n.x = -width / 2;
                if (n.y < -height / 2) n.y = height / 2;
                if (n.y > height / 2) n.y = -height / 2;

                const screenX = cx + n.x;
                const screenY = cy + n.y;

                ctx.fillStyle = `hsl(${n.hue}, 100%, 60%)`;
                ctx.shadowColor = `hsl(${n.hue}, 100%, 50%)`;
                ctx.shadowBlur = 12;

                ctx.beginPath();
                ctx.arc(screenX, screenY, n.radius, 0, Math.PI * 2);
                ctx.fill();

                // Draw connecting web strands
                for (let j = i + 1; j < numNodes; j++) {
                    const n2 = nodes[j];
                    const dx = n.x - n2.x;
                    const dy = n.y - n2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 150) {
                        const alpha = (1 - dist / 150) * 0.4;
                        ctx.strokeStyle = `hsla(${n.hue}, 100%, 50%, ${alpha})`;
                        ctx.lineWidth = Math.max(0.5, (1 - dist / 150) * 2);
                        ctx.beginPath();
                        ctx.moveTo(screenX, screenY);
                        ctx.lineTo(cx + n2.x, cy + n2.y);
                        ctx.stroke();
                    }
                }
            }
            ctx.shadowBlur = 0;

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
