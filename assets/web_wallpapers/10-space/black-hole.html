<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Hole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Black Hole</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0, my = 0;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = (e.clientX/w - 0.5)*2; my = (e.clientY/h - 0.5)*2; });
const particles = [];
for (let i = 0; i < 800; i++) {
  particles.push({
    angle: Math.random() * Math.PI * 2,
    dist: 80 + Math.random() * 400,
    speed: 0.002 + Math.random() * 0.01,
    hue: 20 + Math.random() * 60,
    size: 0.5 + Math.random() * 2
  });
}
const bgStars = [];
for (let i = 0; i < 400; i++) bgStars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.5, t: Math.random() * Math.PI * 2 });
function loop() {
  t += 0.01;
  ctx.fillStyle = '#000005';
  ctx.fillRect(0, 0, w, h);
  for (const s of bgStars) {
    s.t += 0.04;
    ctx.fillStyle = `rgba(255,255,255,${0.15 + Math.sin(s.t) * 0.2})`;
    ctx.fillRect(s.x * w, s.y * h, s.s, s.s);
  }
  const cx = w/2 + mx * 30;
  const cy = h/2 + my * 30;
  const R = Math.min(w, h) * 0.4;
  // accretion disk
  ctx.globalCompositeOperation = 'screen';
  for (const p of particles) {
    p.angle += p.speed * (1 + 50 / p.dist);
    p.dist -= 0.15;
    if (p.dist < 50) {
      p.dist = 400 + Math.random() * 100;
      p.angle = Math.random() * Math.PI * 2;
    }
    const x = cx + Math.cos(p.angle) * p.dist;
    const y = cy + Math.sin(p.angle) * p.dist * 0.4; // flatten disk
    const heat = 1 - (p.dist - 50) / 400;
    const hue = 20 + heat * 30;
    const light = 50 + heat * 30;
    ctx.fillStyle = `hsla(${hue}, 100%, ${light}%, ${0.6 + heat * 0.4})`;
    ctx.beginPath();
    ctx.arc(x, y, p.size * (1 + heat), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  // event horizon shadow
  const eg = ctx.createRadialGradient(cx, cy, 30, cx, cy, 80);
  eg.addColorStop(0, '#000');
  eg.addColorStop(0.8, 'rgba(0,0,0,0.95)');
  eg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.arc(cx, cy, 80, 0, Math.PI * 2);
  ctx.fill();
  // photon ring
  ctx.strokeStyle = 'rgba(255, 200, 100, 0.8)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(cx, cy, 55, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // lensing ring (brighter arc on top)
  ctx.strokeStyle = 'rgba(255, 240, 200, 0.6)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, 70, Math.PI + 0.3, Math.PI * 2 - 0.3);
  ctx.stroke();
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
