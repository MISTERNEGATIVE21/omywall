<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nebula</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Nebula</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
const clouds = [];
for (let i = 0; i < 25; i++) {
  clouds.push({
    x: Math.random(), y: Math.random(),
    r: 0.1 + Math.random() * 0.25,
    hue: Math.random() < 0.5 ? 280 + Math.random() * 60 : 180 + Math.random() * 80,
    phase: Math.random() * Math.PI * 2,
    driftX: (Math.random() - 0.5) * 0.0003,
    driftY: (Math.random() - 0.5) * 0.0003
  });
}
const stars = [];
for (let i = 0; i < 500; i++) {
  stars.push({
    x: Math.random(), y: Math.random(),
    size: 0.3 + Math.random() * 1.5,
    t: Math.random() * Math.PI * 2,
    color: Math.random() < 0.7 ? 'white' : (Math.random() < 0.5 ? '#ffcc88' : '#88ccff')
  });
}
function loop() {
  t += 0.003;
  ctx.fillStyle = '#02000a';
  ctx.fillRect(0, 0, w, h);
  // clouds
  ctx.globalCompositeOperation = 'screen';
  for (const c of clouds) {
    c.x += c.driftX; c.y += c.driftY;
    c.phase += 0.005;
    if (c.x < -0.2) c.x = 1.2; if (c.x > 1.2) c.x = -0.2;
    if (c.y < -0.2) c.y = 1.2; if (c.y > 1.2) c.y = -0.2;
    const x = (c.x + (mx - 0.5) * 0.05) * w;
    const y = (c.y + (my - 0.5) * 0.05) * h;
    const r = (c.r + Math.sin(c.phase) * 0.02) * Math.min(w, h);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `hsla(${c.hue}, 90%, 60%, 0.4)`);
    g.addColorStop(0.5, `hsla(${c.hue + 20}, 80%, 50%, 0.15)`);
    g.addColorStop(1, `hsla(${c.hue}, 80%, 40%, 0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }
  ctx.globalCompositeOperation = 'source-over';
  // stars
  for (const s of stars) {
    s.t += 0.04;
    const tw = (Math.sin(s.t) + 1) / 2;
    ctx.fillStyle = s.color;
    ctx.globalAlpha = 0.3 + tw * 0.7;
    ctx.beginPath();
    ctx.arc(s.x * w, s.y * h, s.size, 0, Math.PI * 2);
    ctx.fill();
    // cross flare for bright stars
    if (s.size > 1.2 && tw > 0.7) {
      ctx.globalAlpha = (tw - 0.7) * 2;
      ctx.fillRect(s.x * w - 6, s.y * h - 0.5, 12, 1);
      ctx.fillRect(s.x * w - 0.5, s.y * h - 6, 1, 12);
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
