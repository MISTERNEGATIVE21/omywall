<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Solar System</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0, my = 0;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = (e.clientX/w - 0.5)*2; my = (e.clientY/h - 0.5)*2; });
const planets = [
  { name: 'MERCURY', r: 60, size: 3, speed: 0.04, color: '#a0a0a0' },
  { name: 'VENUS', r: 90, size: 5, speed: 0.025, color: '#ffcc66' },
  { name: 'EARTH', r: 130, size: 6, speed: 0.018, color: '#4488ff' },
  { name: 'MARS', r: 170, size: 4, speed: 0.014, color: '#ff5533' },
  { name: 'JUPITER', r: 230, size: 14, speed: 0.008, color: '#ddaa77' },
  { name: 'SATURN', r: 290, size: 12, speed: 0.005, color: '#ffdd99', ring: true },
  { name: 'URANUS', r: 340, size: 8, speed: 0.003, color: '#66ddff' },
  { name: 'NEPTUNE', r: 380, size: 8, speed: 0.002, color: '#3366ff' }
];
const bgStars = [];
for (let i = 0; i < 300; i++) bgStars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.5, t: Math.random() * Math.PI * 2 });
function loop() {
  t += 0.01;
  ctx.fillStyle = '#000010';
  ctx.fillRect(0, 0, w, h);
  for (const s of bgStars) {
    s.t += 0.04;
    ctx.fillStyle = `rgba(255,255,255,${0.2 + Math.sin(s.t) * 0.2})`;
    ctx.fillRect(s.x * w, s.y * h, s.s, s.s);
  }
  const cx = w/2 + mx * 30;
  const cy = h/2 + my * 30;
  const scale = Math.min(w, h) / 900;
  // sun
  const sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 50 * scale);
  sg.addColorStop(0, '#ffffaa');
  sg.addColorStop(0.4, '#ffaa33');
  sg.addColorStop(1, 'rgba(255, 100, 0, 0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(cx, cy, 50 * scale, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffaa';
  ctx.beginPath();
  ctx.arc(cx, cy, 18 * scale, 0, Math.PI * 2);
  ctx.fill();
  // orbits + planets
  for (const p of planets) {
    const orbitR = p.r * scale;
    // orbit
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
    ctx.stroke();
    // planet
    const a = t * p.speed;
    const px = cx + Math.cos(a) * orbitR;
    const py = cy + Math.sin(a) * orbitR;
    if (p.ring) {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(px, py, p.size * scale * 1.8, p.size * scale * 0.6, a * 0.5, 0, Math.PI * 2);
      ctx.stroke();
    }
    // glow
    const pg = ctx.createRadialGradient(px, py, 0, px, py, p.size * scale * 3);
    pg.addColorStop(0, p.color);
    pg.addColorStop(0.5, p.color + '80');
    pg.addColorStop(1, 'transparent');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(px, py, p.size * scale * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(px, py, p.size * scale, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
