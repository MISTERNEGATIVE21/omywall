<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galaxy Spiral</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Galaxy Spiral</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
const stars = [];
const ARMS = 4;
const STAR_COUNT = 3000;
for (let i = 0; i < STAR_COUNT; i++) {
  const arm = i % ARMS;
  const r = Math.pow(Math.random(), 0.5) * 1;
  const armAngle = (arm / ARMS) * Math.PI * 2;
  const spiral = r * 4;
  const angle = armAngle + spiral + (Math.random() - 0.5) * 0.4;
  stars.push({
    r, angle,
    size: 0.3 + Math.random() * 1.5,
    hue: r < 0.3 ? 50 + Math.random() * 30 : 180 + Math.random() * 100,
    brightness: 0.3 + Math.random() * 0.7,
    twinkle: Math.random() * Math.PI * 2
  });
}
// background stars
const bgStars = [];
for (let i = 0; i < 400; i++) {
  bgStars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.2, t: Math.random() * Math.PI * 2 });
}
function loop() {
  t += 0.002;
  ctx.fillStyle = '#000005';
  ctx.fillRect(0, 0, w, h);
  // bg stars
  for (const s of bgStars) {
    s.t += 0.05;
    ctx.fillStyle = `rgba(255, 255, 255, ${0.2 + Math.sin(s.t) * 0.2})`;
    ctx.fillRect(s.x * w, s.y * h, s.s, s.s);
  }
  const cx = w/2 + (mx - 0.5) * 60;
  const cy = h/2 + (my - 0.5) * 60;
  const R = Math.min(w, h) * 0.45;
  // central glow
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.4);
  cg.addColorStop(0, 'rgba(255, 220, 150, 0.6)');
  cg.addColorStop(0.3, 'rgba(255, 150, 100, 0.3)');
  cg.addColorStop(1, 'rgba(255, 100, 100, 0)');
  ctx.fillStyle = cg;
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'screen';
  for (const s of stars) {
    s.twinkle += 0.05;
    const a = s.angle + t * (1 - s.r * 0.5);
    const x = cx + Math.cos(a) * s.r * R;
    const y = cy + Math.sin(a) * s.r * R;
    const tw = (Math.sin(s.twinkle) + 1) / 2;
    const alpha = s.brightness * (0.5 + tw * 0.5);
    ctx.fillStyle = `hsla(${s.hue}, 90%, 70%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  // nebula clouds
  for (let i = 0; i < 4; i++) {
    const na = (i / 4) * Math.PI * 2 + t * 0.5;
    const nx = cx + Math.cos(na) * R * 0.5;
    const ny = cy + Math.sin(na) * R * 0.5;
    const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, R * 0.3);
    const hue = 280 + i * 20;
    ng.addColorStop(0, `hsla(${hue}, 80%, 50%, 0.15)`);
    ng.addColorStop(1, `hsla(${hue}, 80%, 30%, 0)`);
    ctx.fillStyle = ng;
    ctx.fillRect(0, 0, w, h);
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
