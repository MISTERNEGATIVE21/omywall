<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Neon Clock Web Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at center, #121829 0%, #080a10 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; align-items: center; justify-content: center;
      color: #00f0ff; text-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff;
    }
    .clock-container {
      text-align: center;
      background: rgba(18, 24, 40, 0.4);
      padding: 40px 60px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    }
    .time { font-size: 6rem; font-weight: 700; letter-spacing: 4px; }
    .date { font-size: 1.8rem; color: #ff007f; text-shadow: 0 0 15px #ff007f; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="clock-container">
    <div class="time" id="time">00:00:00</div>
    <div class="date" id="date">OMARCHY WALLPAPER ENGINE</div>
  </div>
  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('time').textContent = `${h}:${m}:${s}`;
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString(undefined, options).toUpperCase();
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
