<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mandala</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Mandala</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function loop() {
  t += 0.005;
  ctx.fillStyle = 'rgba(8, 4, 16, 0.12)';
  ctx.fillRect(0, 0, w, h);
  const cx = w/2, cy = h/2;
  const R = Math.min(w, h) * 0.4;
  const symmetry = 12;
  const layers = 8;
  ctx.save();
  ctx.translate(cx + (mx - 0.5) * 30, cy + (my - 0.5) * 30);
  ctx.globalCompositeOperation = 'screen';
  for (let l = 0; l < layers; l++) {
    const lr = R * (0.15 + l * 0.1);
    const hue = (t * 30 + l * 40) % 360;
    ctx.save();
    ctx.rotate(t * (1 + l * 0.2) * (l % 2 ? -1 : 1));
    for (let s = 0; s < symmetry; s++) {
      ctx.rotate((Math.PI * 2) / symmetry);
      ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.7)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const r1 = lr;
      const r2 = lr + 30 + Math.sin(t * 2 + l) * 15;
      ctx.moveTo(0, r1);
      ctx.quadraticCurveTo(20 + Math.sin(t + l) * 10, (r1 + r2) / 2, 0, r2);
      ctx.stroke();
      ctx.fillStyle = `hsla(${hue}, 80%, 65%, 0.6)`;
      ctx.beginPath();
      ctx.arc(0, r2, 3 + Math.sin(t * 3 + l + s) * 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
