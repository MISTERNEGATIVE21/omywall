<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flow Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Flow Field</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', () => { resize(); init(); });
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
let particles = [];
function init() {
  particles = [];
  for (let i = 0; i < 800; i++) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      hue: 200 + Math.random() * 160
    });
  }
  ctx.fillStyle = '#02000a';
  ctx.fillRect(0, 0, w, h);
}
resize(); init();
function noise(x, y, t) {
  return Math.sin(x * 0.003 + t) * Math.cos(y * 0.003 + t * 0.7)
       + Math.sin(x * 0.008 - t * 0.5) * 0.5
       + Math.cos(y * 0.006 + t * 1.2) * 0.5;
}
function loop() {
  t += 0.003;
  ctx.fillStyle = 'rgba(2, 0, 10, 0.03)';
  ctx.fillRect(0, 0, w, h);
  for (const p of particles) {
    const n = noise(p.x, p.y, t);
    const angle = n * Math.PI * 2 + (mx - 0.5) * Math.PI;
    p.x += Math.cos(angle) * 1.2;
    p.y += Math.sin(angle) * 1.2;
    if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
    if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
    const hueShift = (my - 0.5) * 100;
    ctx.fillStyle = `hsla(${p.hue + hueShift}, 80%, 60%, 0.4)`;
    ctx.fillRect(p.x, p.y, 1.5, 1.5);
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
