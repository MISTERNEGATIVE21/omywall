<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fractal Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Fractal Tree</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function branch(x, y, len, angle, depth) {
  if (depth === 0 || len < 2) return;
  const x2 = x + Math.cos(angle) * len;
  const y2 = y + Math.sin(angle) * len;
  const hue = (180 + depth * 12 + t * 20) % 360;
  ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${depth / 10})`;
  ctx.lineWidth = Math.max(0.5, depth * 0.4);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  // leaf
  if (depth < 3) {
    ctx.fillStyle = `hsla(${hue + 40}, 90%, 65%, 0.7)`;
    ctx.beginPath();
    ctx.arc(x2, y2, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  const wind = Math.sin(t * 2 + depth * 0.5) * 0.15 + (mx - 0.5) * 0.3;
  const growth = 0.7 + (my - 0.5) * 0.1;
  branch(x2, y2, len * growth, angle - 0.4 + wind, depth - 1);
  branch(x2, y2, len * growth, angle + 0.4 + wind, depth - 1);
  if (depth > 6) branch(x2, y2, len * 0.65, angle + wind * 0.5, depth - 2);
}
function loop() {
  // bg
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0a0510');
  g.addColorStop(1, '#02000a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  t += 0.01;
  branch(w/2, h * 0.95, Math.min(w, h) * 0.15, -Math.PI/2, 10);
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
