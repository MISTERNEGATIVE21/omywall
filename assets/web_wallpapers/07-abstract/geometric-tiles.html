<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geometric Tiles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Geometric Tiles</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function loop() {
  t += 0.01;
  ctx.fillStyle = '#0a0612';
  ctx.fillRect(0, 0, w, h);
  const tileSize = 60;
  const cols = Math.ceil(w / tileSize) + 1;
  const rows = Math.ceil(h / tileSize) + 1;
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      const x = i * tileSize;
      const y = j * tileSize;
      const dx = x - mx * w;
      const dy = y - my * h;
      const d = Math.sqrt(dx*dx + dy*dy);
      const wave = Math.sin(d * 0.01 - t * 3);
      const size = tileSize * 0.4 * (0.5 + wave * 0.5);
      const hue = (d * 0.5 + t * 50) % 360;
      const cx = x + tileSize / 2;
      const cy = y + tileSize / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(wave * Math.PI * 0.5 + t);
      ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${0.4 + wave * 0.3})`;
      ctx.fillRect(-size/2, -size/2, size, size);
      ctx.strokeStyle = `hsla(${hue + 60}, 90%, 70%, 0.6)`;
      ctx.lineWidth = 1;
      ctx.strokeRect(-size/2, -size/2, size, size);
      ctx.restore();
    }
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
