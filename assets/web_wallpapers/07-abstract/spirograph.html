<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spirograph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Spirograph</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
let path = [];
const MAX_PATH = 800;
function loop() {
  t += 0.02;
  // fade
  ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
  ctx.fillRect(0, 0, w, h);
  const cx = w/2, cy = h/2;
  const R = Math.min(w, h) * 0.35;
  const r = R * (0.3 + (mx - 0.5) * 0.4);
  const d = R * (0.5 + (my - 0.5) * 0.6);
  const x = cx + (R - r) * Math.cos(t) + d * Math.cos(((R - r) / r) * t);
  const y = cy + (R - r) * Math.sin(t) - d * Math.sin(((R - r) / r) * t);
  path.push({ x, y, hue: (t * 20) % 360 });
  if (path.length > MAX_PATH) path.shift();
  for (let i = 1; i < path.length; i++) {
    const p1 = path[i - 1];
    const p2 = path[i];
    const a = i / path.length;
    ctx.strokeStyle = `hsla(${p2.hue}, 100%, 60%, ${a})`;
    ctx.lineWidth = 1 + a * 2;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }
  // current dot
  if (path.length) {
    const p = path[path.length - 1];
    ctx.fillStyle = `hsl(${p.hue}, 100%, 70%)`;
    ctx.shadowColor = `hsl(${p.hue}, 100%, 70%)`;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
