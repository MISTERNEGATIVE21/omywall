<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Confetti Celebration (click!)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Confetti Celebration (click!)</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, pieces = [];
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
const colors = ['#ff006e', '#fb5607', '#ffbe0b', '#8338ec', '#3a86ff', '#06ffa5'];
function makePiece(initial) {
  return {
    x: Math.random() * w,
    y: initial ? Math.random() * h : -20,
    vx: (Math.random() - 0.5) * 3,
    vy: 1 + Math.random() * 3,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.2,
    w: 6 + Math.random() * 8,
    h: 10 + Math.random() * 10,
    color: colors[Math.floor(Math.random() * colors.length)],
    shape: Math.random() < 0.5 ? 'rect' : 'circle'
  };
}
for (let i = 0; i < 200; i++) pieces.push(makePiece(true));
window.addEventListener('click', e => {
  for (let i = 0; i < 80; i++) {
    const p = makePiece(false);
    p.x = e.clientX;
    p.y = e.clientY;
    p.vx = (Math.random() - 0.5) * 8;
    p.vy = -3 - Math.random() * 5;
    pieces.push(p);
  }
  if (pieces.length > 600) pieces.splice(0, 80);
});
function loop() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.fillRect(0, 0, w, h);
  for (const p of pieces) {
    p.vy += 0.06;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    if (p.y > h + 30) { Object.assign(p, makePiece(false)); }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.shape === 'rect') {
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.w/2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
