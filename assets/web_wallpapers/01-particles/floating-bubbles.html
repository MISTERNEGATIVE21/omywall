<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Floating Bubbles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Floating Bubbles</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, bubbles = [];
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function makeBubble() {
  return {
    x: Math.random() * w,
    y: h + Math.random() * 200,
    r: 8 + Math.random() * 40,
    vy: -(0.3 + Math.random() * 1.2),
    vx: (Math.random() - 0.5) * 0.4,
    hue: 180 + Math.random() * 120,
    alpha: 0.3 + Math.random() * 0.4,
    wobble: Math.random() * Math.PI * 2
  };
}
for (let i = 0; i < 80; i++) {
  const b = makeBubble();
  b.y = Math.random() * h;
  bubbles.push(b);
}
function loop() {
  // gradient bg
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0a1a2f');
  g.addColorStop(1, '#1a3a5f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  for (const b of bubbles) {
    b.y += b.vy;
    b.wobble += 0.03;
    b.x += b.vx + Math.sin(b.wobble) * 0.4 + (mx - 0.5) * 0.5;
    if (b.y + b.r < -20) { Object.assign(b, makeBubble()); }
    ctx.beginPath();
    const grad = ctx.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.1, b.x, b.y, b.r);
    grad.addColorStop(0, `hsla(${b.hue}, 80%, 80%, ${b.alpha})`);
    grad.addColorStop(0.7, `hsla(${b.hue}, 70%, 60%, ${b.alpha * 0.5})`);
    grad.addColorStop(1, `hsla(${b.hue}, 80%, 70%, 0)`);
    ctx.fillStyle = grad;
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    // shine
    ctx.beginPath();
    ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha * 0.8})`;
    ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.15, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
