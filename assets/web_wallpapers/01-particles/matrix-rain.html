<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matrix Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Matrix Rain</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, columns, drops;
const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF';
const fontSize = 16;
function resize() {
  w = cv.width = innerWidth; h = cv.height = innerHeight;
  columns = Math.floor(w / fontSize);
  drops = new Array(columns).fill(0).map(() => Math.random() * -100);
}
window.addEventListener('resize', resize); resize();
function loop() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
  ctx.fillRect(0, 0, w, h);
  ctx.font = fontSize + 'px monospace';
  for (let i = 0; i < drops.length; i++) {
    const text = chars[Math.floor(Math.random() * chars.length)];
    const x = i * fontSize;
    const y = drops[i] * fontSize;
    // Bright head
    ctx.fillStyle = '#aaffaa';
    ctx.fillText(text, x, y);
    // Trail
    ctx.fillStyle = '#00ff41';
    for (let t = 1; t < 12; t++) {
      ctx.globalAlpha = (12 - t) / 24;
      const tc = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(tc, x, y - t * fontSize);
    }
    ctx.globalAlpha = 1;
    if (y > h && Math.random() > 0.975) drops[i] = 0;
    drops[i] += 0.4 + Math.random() * 0.3;
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
