<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snowfall Night</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Snowfall Night</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, flakes = [];
let wind = 0, targetWind = 0;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { targetWind = (e.clientX / w - 0.5) * 2; });
function makeFlake() {
  return {
    x: Math.random() * w,
    y: Math.random() * h - h,
    r: 0.5 + Math.random() * 3.5,
    vy: 0.3 + Math.random() * 1.5,
    drift: Math.random() * Math.PI * 2,
    driftSpeed: 0.005 + Math.random() * 0.02
  };
}
for (let i = 0; i < 300; i++) flakes.push(makeFlake());
function loop() {
  // bg gradient (winter night)
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0d1b2a');
  g.addColorStop(0.5, '#1b263b');
  g.addColorStop(1, '#243a52');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  wind += (targetWind - wind) * 0.02;
  for (const f of flakes) {
    f.drift += f.driftSpeed;
    f.x += Math.sin(f.drift) * 0.5 + wind * 0.8;
    f.y += f.vy;
    if (f.y > h + 5) { f.y = -5; f.x = Math.random() * w; }
    if (f.x < -5) f.x = w + 5;
    if (f.x > w + 5) f.x = -5;
    ctx.beginPath();
    ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + f.r * 0.15})`;
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
