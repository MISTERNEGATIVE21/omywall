<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fireflies Forest</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Fireflies Forest</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, flies = [];
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function makeFly() {
  return {
    x: Math.random() * w,
    y: Math.random() * h,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5,
    r: 1.5 + Math.random() * 2,
    phase: Math.random() * Math.PI * 2,
    speed: 0.02 + Math.random() * 0.03,
    hue: 50 + Math.random() * 40
  };
}
for (let i = 0; i < 120; i++) flies.push(makeFly());
function loop() {
  // dark forest gradient
  const g = ctx.createRadialGradient(w/2, h, 0, w/2, h, h);
  g.addColorStop(0, '#0a1f15');
  g.addColorStop(1, '#02080a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  for (const f of flies) {
    // drift toward mouse slowly
    const dx = mx * w - f.x;
    const dy = my * h - f.y;
    f.vx += dx * 0.00003;
    f.vy += dy * 0.00003;
    f.vx *= 0.99; f.vy *= 0.99;
    f.x += f.vx; f.y += f.vy;
    if (f.x < 0) f.x = w; if (f.x > w) f.x = 0;
    if (f.y < 0) f.y = h; if (f.y > h) f.y = 0;
    f.phase += f.speed;
    const glow = (Math.sin(f.phase) + 1) / 2;
    const r = f.r * (0.6 + glow * 0.8);
    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r * 8);
    grad.addColorStop(0, `hsla(${f.hue}, 100%, 70%, ${glow * 0.9})`);
    grad.addColorStop(0.3, `hsla(${f.hue}, 100%, 60%, ${glow * 0.3})`);
    grad.addColorStop(1, `hsla(${f.hue}, 100%, 50%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y, r * 8, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
