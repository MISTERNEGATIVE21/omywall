<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Constellation Network</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Constellation Network</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, nodes = [];
let mx = -1000, my = -1000;
function resize() {
  w = cv.width = innerWidth; h = cv.height = innerHeight;
  const count = Math.min(160, Math.floor(w * h / 12000));
  nodes = [];
  for (let i = 0; i < count; i++) {
    nodes.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: 1 + Math.random() * 1.5
    });
  }
}
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
window.addEventListener('mouseleave', () => { mx = -1000; my = -1000; });
function loop() {
  ctx.fillStyle = '#050816';
  ctx.fillRect(0, 0, w, h);
  for (const n of nodes) {
    n.x += n.vx; n.y += n.vy;
    if (n.x < 0 || n.x > w) n.vx *= -1;
    if (n.y < 0 || n.y > h) n.vy *= -1;
    // mouse repel
    const dx = n.x - mx, dy = n.y - my;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < 120) {
      n.x += dx / d * 1.5;
      n.y += dy / d * 1.5;
    }
  }
  // connections
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i+1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < 130) {
        const a = (1 - d/130) * 0.5;
        ctx.strokeStyle = `rgba(120, 200, 255, ${a})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      }
    }
  }
  // nodes
  for (const n of nodes) {
    ctx.beginPath();
    ctx.fillStyle = '#7fc8ff';
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fill();
  }
  // mouse node
  if (mx > 0) {
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.arc(mx, my, 3, 0, Math.PI * 2);
    ctx.fill();
    const grad = ctx.createRadialGradient(mx, my, 0, mx, my, 60);
    grad.addColorStop(0, 'rgba(120, 200, 255, 0.4)');
    grad.addColorStop(1, 'rgba(120, 200, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(mx, my, 60, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
