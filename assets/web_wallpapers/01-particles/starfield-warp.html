<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starfield Warp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Starfield Warp</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, stars = [];
const N = 600;
let mx = 0, my = 0;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
function initStars() {
  stars = [];
  for (let i = 0; i < N; i++) {
    stars.push({
      x: (Math.random()-0.5) * w,
      y: (Math.random()-0.5) * h,
      z: Math.random() * w,
      pz: 0
    });
  }
}
window.addEventListener('resize', () => { resize(); initStars(); });
window.addEventListener('mousemove', e => { mx = (e.clientX/w - 0.5) * 2; my = (e.clientY/h - 0.5) * 2; });
resize(); initStars();
function loop() {
  ctx.fillStyle = 'rgba(8, 8, 24, 0.35)';
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.translate(w/2 + mx*40, h/2 + my*40);
  for (const s of stars) {
    s.pz = s.z;
    s.z -= 6;
    if (s.z < 1) {
      s.z = w;
      s.x = (Math.random()-0.5) * w;
      s.y = (Math.random()-0.5) * h;
      s.pz = s.z;
    }
    const sx = s.x / s.z * w * 0.5;
    const sy = s.y / s.z * w * 0.5;
    const px = s.x / s.pz * w * 0.5;
    const py = s.y / s.pz * w * 0.5;
    const r = Math.max(0.3, (1 - s.z / w) * 2.5);
    const a = 1 - s.z / w;
    ctx.strokeStyle = `rgba(${180 + a*60}, ${200 + a*40}, 255, ${a})`;
    ctx.lineWidth = r;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(sx, sy);
    ctx.stroke();
  }
  ctx.restore();
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
