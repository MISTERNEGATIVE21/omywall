<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Vortex</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Color Vortex</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, parts = [];
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function makePart() {
  const angle = Math.random() * Math.PI * 2;
  const dist = 50 + Math.random() * Math.min(w, h) * 0.4;
  return {
    angle, dist,
    speed: 0.005 + Math.random() * 0.015,
    hue: Math.random() * 360,
    r: 1 + Math.random() * 2.5,
    life: Math.random()
  };
}
for (let i = 0; i < 600; i++) parts.push(makePart());
function loop() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.fillRect(0, 0, w, h);
  const cx = w/2 + (mx - 0.5) * 200;
  const cy = h/2 + (my - 0.5) * 200;
  for (const p of parts) {
    p.angle += p.speed;
    p.dist -= 0.3;
    p.life += 0.005;
    if (p.dist < 30) {
      p.dist = Math.min(w, h) * 0.45;
      p.angle = Math.random() * Math.PI * 2;
      p.hue = (p.hue + 20) % 360;
    }
    const x = cx + Math.cos(p.angle) * p.dist;
    const y = cy + Math.sin(p.angle) * p.dist;
    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, 0.9)`;
    ctx.arc(x, y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
