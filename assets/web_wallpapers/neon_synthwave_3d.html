<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Synthwave Horizon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0b021a; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { powerPreference: 'high-performance' });

        let width, height, cx, cy;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height * 0.45;
        }
        window.addEventListener('resize', resize);
        resize();

        const stars = [];
        for (let i = 0; i < 180; i++) {
            stars.push({
                x: Math.random() * 2000 - 1000,
                y: Math.random() * 400 - 350,
                size: Math.random() * 1.8 + 0.5,
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        let speedZ = 0;
        let time = 0;

        function render() {
            time += 0.015;
            speedZ = (speedZ + 2.5) % 40;

            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#05010d');
            bgGrad.addColorStop(0.45, '#260438');
            bgGrad.addColorStop(0.45, '#12001c');
            bgGrad.addColorStop(1, '#05000a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                ctx.globalAlpha = s.alpha * (0.8 + Math.sin(time * 3 + i) * 0.2);
                ctx.beginPath();
                ctx.arc(cx + s.x, cy + s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            const sunRadius = 140;
            const sunY = cy - 20;
            const sunGrad = ctx.createLinearGradient(0, sunY - sunRadius, 0, sunY + sunRadius);
            sunGrad.addColorStop(0, '#ffe600');
            sunGrad.addColorStop(0.5, '#ff007f');
            sunGrad.addColorStop(1, '#7900ff');

            ctx.save();
            ctx.shadowColor = '#ff007f';
            ctx.shadowBlur = 40;
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(cx, sunY, sunRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#260438';
            for (let i = 0; i < 7; i++) {
                const lh = 3 + i * 2.5;
                const ly = sunY + 20 + i * 14;
                ctx.fillRect(cx - sunRadius - 10, ly, sunRadius * 2 + 20, lh);
            }

            const horizonY = cy + 10;
            const gridLines = 32;
            const fov = 350;

            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1.5;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 12;

            for (let i = -gridLines / 2; i <= gridLines / 2; i++) {
                const x1 = cx + i * 18;
                const x2 = cx + i * 180;
                ctx.beginPath();
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
                ctx.stroke();
            }

            for (let z = 10; z < 700; z += 35) {
                const currentZ = z - speedZ;
                if (currentZ <= 0) continue;

                const scale = fov / (fov + currentZ);
                const y = horizonY + (height - horizonY) * (1 - scale * 0.85);

                const alpha = Math.min(1, currentZ / 500);
                ctx.strokeStyle = `rgba(255, 0, 200, ${alpha * 0.9})`;
                ctx.shadowColor = 'rgba(255, 0, 200, 0.8)';
                ctx.shadowBlur = 8;

                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
