<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOS Boot Sequence</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">DOS Boot Sequence</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
const bootLines = [
  'Award Modular BIOS v6.00PG, An Energy Star Ally',
  'Copyright (C) 1984-2001, Award Software, Inc.',
  '',
  'ASUS P3B-F ACPI BIOS Revision 1.00',
  '',
  'Main Processor : Pentium III 850MHz',
  'Memory Test : 524288K OK',
  '',
  'Detecting IDE Primary Master ... WDC WD200BB-32CCB0',
  'Detecting IDE Primary Slave  ... None',
  'Detecting IDE Secondary Master ... CD-ROM ASUS 50X',
  'Detecting IDE Secondary Slave  ... None',
  '',
  'Press DEL to enter SETUP, ESC to skip memory test',
  '11/15/2001-i440BX-2A69KA1AC-00',
  '',
  'Microsoft(R) MS-DOS(R) Version 6.22',
  '(C)Copyright Microsoft Corp 1981-1994.',
  '',
  'C:\>dir',
  ' Volume in drive C is MS-DOS_6',
  ' Directory of C:\',
  '',
  'COMMAND  COM    54,645  05/31/1994  6:22a',
  'AUTOEXEC BAT       512  11/15/2001  9:30a',
  'CONFIG   SYS       256  11/15/2001  9:30a',
  'DOS          <DIR>       11/15/2001  9:30a',
  'GAMES        <DIR>       11/15/2001  9:31a',
  '',
  'C:\>_',
];
let visibleLines = 0;
let charTimer = 0;
let cursorVisible = true;
let cursorTimer = 0;
function loop() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  charTimer++;
  if (charTimer > 4 && visibleLines < bootLines.length) {
    visibleLines++;
    charTimer = 0;
  }
  cursorTimer++;
  if (cursorTimer > 30) { cursorVisible = !cursorVisible; cursorTimer = 0; }
  ctx.font = '18px "Courier New", monospace';
  ctx.fillStyle = '#c0c0c0';
  const startY = 40;
  const lineH = 24;
  for (let i = 0; i < visibleLines; i++) {
    const line = bootLines[i];
    const y = startY + i * lineH;
    if (line.includes('Award') || line.includes('ASUS')) ctx.fillStyle = '#ffffff';
    else if (line.includes('OK') || line.includes('<DIR>')) ctx.fillStyle = '#00ff00';
    else if (line.includes('None') || line.includes('CD-ROM')) ctx.fillStyle = '#ffff00';
    else ctx.fillStyle = '#c0c0c0';
    ctx.fillText(line, 40, y);
  }
  // blinking cursor on last line
  if (visibleLines >= bootLines.length && cursorVisible) {
    const lastLine = bootLines[bootLines.length - 1];
    const w_ = ctx.measureText(lastLine).width;
    ctx.fillRect(40 + w_ + 2, startY + (bootLines.length - 1) * lineH - 14, 10, 18);
  }
  // CRT effect
  ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
  for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1);
  // vignette
  const g = ctx.createRadialGradient(w/2, h/2, h*0.3, w/2, h/2, h*0.9);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  // screen curvature warp - subtle
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
