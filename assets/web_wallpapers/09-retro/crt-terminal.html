<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CRT Terminal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">CRT Terminal</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
const lines = [];
const phrases = [
  '> initializing system...',
  '> loading kernel modules',
  '> connecting to mainframe',
  '> auth: ACCESS GRANTED',
  '> decrypting payload...',
  '> 0x4F2A bypass complete',
  '> root@localhost:~# ',
  '> scanning network 192.168.0.0/16',
  '> 256 hosts discovered',
  '> uploading packet stream',
  '> [OK] transmission complete',
  '> system status: NOMINAL',
  '> awaiting input_',
];
function spawnLine() {
  lines.push({
    text: phrases[Math.floor(Math.random() * phrases.length)],
    y: h + 20,
    speed: 0.5 + Math.random() * 1.5,
    glitch: 0
  });
}
for (let i = 0; i < 20; i++) {
  lines.push({
    text: phrases[Math.floor(Math.random() * phrases.length)],
    y: h - i * 24,
    speed: 0.5 + Math.random() * 1.5,
    glitch: 0
  });
}
function loop() {
  t += 0.01;
  // bg
  ctx.fillStyle = '#000308';
  ctx.fillRect(0, 0, w, h);
  // text
  ctx.font = '16px "Courier New", monospace';
  for (let i = lines.length - 1; i >= 0; i--) {
    const l = lines[i];
    l.y -= l.speed;
    if (l.y < -20) { lines.splice(i, 1); continue; }
    if (Math.random() < 0.005) l.glitch = 5;
    if (l.glitch > 0) {
      l.glitch--;
      ctx.fillStyle = `rgb(${Math.random()*255|0}, ${Math.random()*255|0}, ${Math.random()*255|0})`;
      ctx.fillText(l.text, Math.random() * 10, l.y + (Math.random() - 0.5) * 4);
    } else {
      const green = 200 + Math.sin(t * 5 + i) * 30;
      ctx.fillStyle = `rgba(0, ${green}, 80, 0.9)`;
      ctx.fillText(l.text, 20, l.y);
    }
  }
  if (Math.random() < 0.3) spawnLine();
  // CRT scanlines
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  for (let y = 0; y < h; y += 3) {
    ctx.fillRect(0, y, w, 1);
  }
  // CRT vignette + curvature
  const grad = ctx.createRadialGradient(w/2, h/2, h*0.3, w/2, h/2, h*0.8);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  // moving scan band
  const bandY = (t * 100) % (h + 200) - 100;
  const bg = ctx.createLinearGradient(0, bandY - 50, 0, bandY + 50);
  bg.addColorStop(0, 'rgba(0, 255, 100, 0)');
  bg.addColorStop(0.5, 'rgba(0, 255, 100, 0.08)');
  bg.addColorStop(1, 'rgba(0, 255, 100, 0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, bandY - 50, w, 100);
  // flicker
  if (Math.random() < 0.05) {
    ctx.fillStyle = `rgba(0, 255, 100, ${Math.random() * 0.05})`;
    ctx.fillRect(0, 0, w, h);
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
