<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vaporwave Sunset</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Vaporwave Sunset</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function loop() {
  t += 0.008;
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.6);
  sky.addColorStop(0, '#1a0033');
  sky.addColorStop(0.4, '#660066');
  sky.addColorStop(0.7, '#ff006e');
  sky.addColorStop(1, '#ffbe0b');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h * 0.6);
  // sun
  const sunY = h * (0.45 + (my - 0.5) * 0.1);
  const sunR = Math.min(w, h) * 0.18;
  const sg = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
  sg.addColorStop(0, '#ffe066');
  sg.addColorStop(0.5, '#ff8c42');
  sg.addColorStop(1, '#ff006e');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(w/2, sunY, sunR, 0, Math.PI * 2);
  ctx.fill();
  // sun stripes
  ctx.fillStyle = '#1a0033';
  for (let i = 0; i < 7; i++) {
    const y = sunY + (i - 3) * sunR * 0.18;
    if (Math.abs(y - sunY) < sunR) {
      const hw = Math.sqrt(sunR*sunR - (y - sunY)*(y - sunY));
      ctx.fillRect(w/2 - hw, y, hw * 2, 3 + i);
    }
  }
  // ocean (purple/pink)
  const ocean = ctx.createLinearGradient(0, h * 0.6, 0, h);
  ocean.addColorStop(0, '#1a0033');
  ocean.addColorStop(0.5, '#660066');
  ocean.addColorStop(1, '#000');
  ctx.fillStyle = ocean;
  ctx.fillRect(0, h * 0.6, w, h * 0.4);
  // grid floor
  const horizon = h * 0.6;
  ctx.strokeStyle = '#ff00ff';
  ctx.shadowColor = '#ff00ff';
  ctx.shadowBlur = 8;
  ctx.lineWidth = 1.5;
  // horizontal lines
  for (let i = 0; i < 20; i++) {
    const z = (i + (t * 0.7) % 1);
    const y = horizon + (h - horizon) * (z * z) / 400;
    if (y > horizon && y < h) {
      const a = Math.max(0, 1 - (y - horizon) / (h - horizon) - 0.1);
      ctx.strokeStyle = `rgba(255, 0, 255, ${a})`;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
  }
  // vertical perspective lines
  for (let i = -20; i <= 20; i++) {
    ctx.strokeStyle = `rgba(255, 0, 255, 0.6)`;
    ctx.beginPath();
    ctx.moveTo(w/2 + (mx - 0.5) * 60, horizon);
    ctx.lineTo(w/2 + i * (w / 8), h);
    ctx.stroke();
  }
  // palm trees silhouette
  ctx.fillStyle = '#000';
  ctx.shadowBlur = 0;
  for (const side of [-1, 1]) {
    const px = w/2 + side * w * 0.35;
    const py = h * 0.6;
    ctx.fillRect(px - 3, py - 80, 6, 80);
    for (let b = 0; b < 5; b++) {
      const ba = (b / 5) * Math.PI - Math.PI/2;
      ctx.save();
      ctx.translate(px, py - 80);
      ctx.rotate(ba + side * 0.3);
      ctx.beginPath();
      ctx.ellipse(40 * side, 0, 40, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  // scanlines
  ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
  for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1);
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
