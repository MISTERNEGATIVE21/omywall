<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cyberpunk Neon Skyline</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #05030a; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateBuildings();
        });

        let buildings = [];

        function generateBuildings() {
            buildings = [];
            const count = Math.ceil(width / 45) + 5;
            for (let i = 0; i < count; i++) {
                const bWidth = 35 + Math.random() * 40;
                const bHeight = 150 + Math.random() * (height * 0.55);
                buildings.push({
                    x: i * 40 - 20,
                    width: bWidth,
                    height: bHeight,
                    color: Math.random() > 0.5 ? '#00f0ff' : '#ff0077',
                    windows: Math.floor(Math.random() * 20) + 5,
                    beacon: Math.random() > 0.3
                });
            }
        }
        generateBuildings();

        // Flying Cyber Cars
        const flyers = [];
        for (let i = 0; i < 25; i++) {
            flyers.push({
                x: Math.random() * width,
                y: height * 0.2 + Math.random() * (height * 0.5),
                speed: (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 4),
                color: Math.random() > 0.5 ? '#00ffff' : '#ff0055',
                length: 20 + Math.random() * 35
            });
        }

        // Cyber Rain
        const raindrops = [];
        for (let i = 0; i < 200; i++) {
            raindrops.push({
                x: Math.random() * width,
                y: Math.random() * height,
                length: 15 + Math.random() * 25,
                speed: 12 + Math.random() * 10
            });
        }

        let time = 0;

        function animate() {
            time += 0.03;

            // Background Night Sky Gradient
            const sky = ctx.createLinearGradient(0, 0, 0, height);
            sky.addColorStop(0, '#05020c');
            sky.addColorStop(0.6, '#18082a');
            sky.addColorStop(1, '#080112');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, height);

            // Neon Moon / Synth Sun
            const sunY = height * 0.35;
            const sunGlow = ctx.createRadialGradient(width / 2, sunY, 10, width / 2, sunY, 160);
            sunGlow.addColorStop(0, 'rgba(255, 0, 128, 0.9)');
            sunGlow.addColorStop(0.5, 'rgba(120, 0, 255, 0.4)');
            sunGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(width / 2, sunY, 160, 0, Math.PI * 2);
            ctx.fill();

            // Buildings Silhouette with Windows
            buildings.forEach(b => {
                const y = height - b.height;
                ctx.fillStyle = '#0a0614';
                ctx.fillRect(b.x, y, b.width, b.height);

                // Building Neon Edge
                ctx.strokeStyle = b.color;
                ctx.lineWidth = 1.5;
                ctx.strokeRect(b.x, y, b.width, b.height);

                // Windows
                ctx.fillStyle = 'rgba(0, 240, 255, 0.7)';
                for (let w = 0; w < b.windows; w++) {
                    const wx = b.x + 6 + (w % 3) * 10;
                    const wy = y + 15 + Math.floor(w / 3) * 18;
                    if (wy < height - 10) {
                        ctx.fillRect(wx, wy, 5, 8);
                    }
                }

                // Beacon Light
                if (b.beacon && Math.sin(time * 3 + b.x) > 0) {
                    ctx.fillStyle = '#ff0044';
                    ctx.beginPath();
                    ctx.arc(b.x + b.width / 2, y - 4, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Flying Neon Vehicles with Tail Lights
            flyers.forEach(f => {
                f.x += f.speed;
                if (f.x > width + 50) f.x = -50;
                if (f.x < -50) f.x = width + 50;

                ctx.strokeStyle = f.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(f.x, f.y);
                ctx.lineTo(f.x - (f.speed * f.length * 0.3), f.y);
                ctx.stroke();
            });

            // Cyber Rain
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
            ctx.lineWidth = 1.2;
            raindrops.forEach(r => {
                r.y += r.speed;
                if (r.y > height) {
                    r.y = -20;
                    r.x = Math.random() * width;
                }
                ctx.beginPath();
                ctx.moveTo(r.x, r.y);
                ctx.lineTo(r.x - 2, r.y + r.length);
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
