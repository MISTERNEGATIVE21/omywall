<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cosmic Nebula Vortex - OMYWALL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #02030a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .overlay {
            position: absolute;
            top: 24px;
            left: 28px;
            color: rgba(160, 100, 255, 0.85);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(160, 100, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="overlay">OMYWALL 3D COSMIC NEBULA VORTEX</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, cx, cy;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        const particleCount = 450;
        const particles = [];

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 650 + 20;
            particles.push({
                angle: angle,
                dist: dist,
                speed: (1 / (dist + 50)) * 25 + Math.random() * 0.005,
                radius: Math.random() * 2.2 + 0.6,
                hue: Math.random() > 0.4 ? 270 + Math.random() * 40 : 190 + Math.random() * 40,
                alpha: Math.random() * 0.8 + 0.2,
                z: (Math.random() - 0.5) * 400
            });
        }

        let time = 0;

        function render() {
            time += 0.01;

            ctx.fillStyle = 'rgba(2, 3, 10, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Ambient Center Glow
            const glowGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 450);
            glowGrad.addColorStop(0, 'rgba(160, 60, 255, 0.25)');
            glowGrad.addColorStop(0.5, 'rgba(0, 180, 255, 0.1)');
            glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGrad;
            ctx.fillRect(0, 0, width, height);

            // Sort particles by Z depth
            particles.sort((a, b) => b.z - a.z);

            for (let i = 0; i < particleCount; i++) {
                const p = particles[i];
                p.angle += p.speed;

                const fov = 400;
                const pZ = p.z + Math.sin(time + p.dist * 0.01) * 30;
                const scale = fov / (fov + pZ + 300);

                const x = cx + Math.cos(p.angle) * p.dist * scale;
                const y = cy + Math.sin(p.angle) * p.dist * scale * 0.6;
                const size = p.radius * scale * 2.2;

                ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.alpha * scale})`;
                ctx.shadowColor = `hsla(${p.hue}, 100%, 60%, 0.8)`;
                ctx.shadowBlur = 10 * scale;

                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();

                // Draw connecting orbital energy lines for inner particles
                if (i % 6 === 0 && p.dist < 300) {
                    const nextP = particles[(i + 1) % particleCount];
                    const nextX = cx + Math.cos(nextP.angle) * nextP.dist * scale;
                    const nextY = cy + Math.sin(nextP.angle) * nextP.dist * scale * 0.6;

                    ctx.strokeStyle = `hsla(${p.hue}, 100%, 60%, 0.15)`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(nextX, nextY);
                    ctx.stroke();
                }
            }
            ctx.shadowBlur = 0;

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
