<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cyber Hyperspace Tunnel - OMYWALL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #05070e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .overlay {
            position: absolute;
            top: 24px;
            left: 28px;
            color: rgba(0, 240, 255, 0.85);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="overlay">OMYWALL 3D HYPERSPACE TUNNEL</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, cx, cy;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        const numRings = 40;
        const ringSegments = 16;
        const speed = 4.5;
        let offsetZ = 0;

        const numParticles = 250;
        const particles = [];
        for (let i = 0; i < numParticles; i++) {
            particles.push({
                x: (Math.random() - 0.5) * 1200,
                y: (Math.random() - 0.5) * 1200,
                z: Math.random() * 2000,
                size: Math.random() * 2 + 1,
                color: Math.random() > 0.5 ? '#00f0ff' : '#b040ff'
            });
        }

        function project(x, y, z) {
            const fov = 400;
            const scale = fov / (fov + z);
            return {
                x: cx + x * scale,
                y: cy + y * scale,
                scale: scale
            };
        }

        let time = 0;
        function render() {
            time += 0.015;
            offsetZ = (offsetZ + speed) % 50;

            ctx.fillStyle = 'rgba(5, 7, 14, 0.25)';
            ctx.fillRect(0, 0, width, height);

            // Draw 3D Tunnel Rings
            for (let i = 0; i < numRings; i++) {
                const z = i * 50 - offsetZ + 50;
                if (z <= 0) continue;

                const radius = 280;
                const points = [];

                for (let j = 0; j < ringSegments; j++) {
                    const angle = (j / ringSegments) * Math.PI * 2 + time * 0.1;
                    const rotX = Math.cos(angle) * radius;
                    const rotY = Math.sin(angle) * radius;

                    // Add subtle distortion wave
                    const waveX = rotX + Math.sin(time + z * 0.01) * 20;
                    const waveY = rotY + Math.cos(time + z * 0.01) * 20;

                    points.push(project(waveX, waveY, z));
                }

                // Render ring wireframe
                const alpha = Math.max(0, 1 - z / 1800);
                const hue = (i * 8 + time * 50) % 360;
                ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${alpha * 0.8})`;
                ctx.lineWidth = Math.max(1, 3 * points[0].scale);

                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let j = 1; j < ringSegments; j++) {
                    ctx.lineTo(points[j].x, points[j].y);
                }
                ctx.closePath();
                ctx.stroke();

                // Connect to previous ring for 3D grid lines
                if (i > 0) {
                    const prevZ = (i - 1) * 50 - offsetZ + 50;
                    if (prevZ > 0) {
                        for (let j = 0; j < ringSegments; j += 2) {
                            const angle = (j / ringSegments) * Math.PI * 2 + time * 0.1;
                            const p1 = project(Math.cos(angle) * radius, Math.sin(angle) * radius, z);
                            const p2 = project(Math.cos(angle) * radius, Math.sin(angle) * radius, prevZ);

                            ctx.strokeStyle = `hsla(${hue + 40}, 100%, 50%, ${alpha * 0.4})`;
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }
            }

            // Draw Warp Particles
            for (let i = 0; i < numParticles; i++) {
                const p = particles[i];
                p.z -= speed * 2;
                if (p.z <= 0) {
                    p.z = 2000;
                    p.x = (Math.random() - 0.5) * 1200;
                    p.y = (Math.random() - 0.5) * 1200;
                }

                const proj = project(p.x, p.y, p.z);
                const alpha = Math.max(0, 1 - p.z / 2000);
                const sz = p.size * proj.scale * 3;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, sz, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
