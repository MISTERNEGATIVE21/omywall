<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25th Hour - Dynamic Day & Night Landscape</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #03050c; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Procedural landscape mountain layers
  const mountains = [
    { colorDay: '#7088a8', colorNight: '#0d1527', speed: 0.1, freq: 0.003, amp: 140, base: 0.52 },
    { colorDay: '#4a6282', colorNight: '#080e1c', speed: 0.2, freq: 0.005, amp: 100, base: 0.62 },
    { colorDay: '#2b3f5c', colorNight: '#040710', speed: 0.4, freq: 0.008, amp: 70, base: 0.74 },
  ];

  function animate() {
    const now = new Date();
    const secOfDay = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() * 0.001;
    // Normalized day fraction [0.0 = midnight, 0.25 = sunrise, 0.5 = noon, 0.75 = sunset]
    const dayProgress = secOfDay / 86400;

    // Atmospheric sun angle [0 = midnight, PI = noon, 2PI = midnight]
    const sunAngle = dayProgress * Math.PI * 2 - Math.PI * 0.5;
    const isDay = Math.sin(sunAngle) > 0;
    const dayFactor = Math.max(0, Math.sin(sunAngle));

    // Sky gradient computation (Deep Night -> Golden Dawn -> Azure Day -> Crimson Sunset)
    const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
    if (dayFactor > 0.4) {
      // Day Sky
      skyGrad.addColorStop(0, '#10447a');
      skyGrad.addColorStop(0.7, '#4290d8');
      skyGrad.addColorStop(1, '#a1d4f8');
    } else if (dayFactor > 0.05) {
      // Golden Hour / Sunset
      skyGrad.addColorStop(0, '#190e38');
      skyGrad.addColorStop(0.5, '#7a2850');
      skyGrad.addColorStop(0.85, '#e86238');
      skyGrad.addColorStop(1, '#ffc44d');
    } else {
      // Deep Starry Night
      skyGrad.addColorStop(0, '#020308');
      skyGrad.addColorStop(0.65, '#070c1a');
      skyGrad.addColorStop(1, '#0e182e');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, height);

    // Celestial Bodies (Sun and Moon)
    const orbitRadius = width * 0.42;
    const celestialCenterX = width * 0.5;
    const celestialCenterY = height * 0.7;

    const sunX = celestialCenterX + Math.cos(sunAngle) * orbitRadius;
    const sunY = celestialCenterY - Math.sin(sunAngle) * orbitRadius;

    const moonX = celestialCenterX + Math.cos(sunAngle + Math.PI) * orbitRadius;
    const moonY = celestialCenterY - Math.sin(sunAngle + Math.PI) * orbitRadius;

    // Draw Sun
    if (sunY < height + 100) {
      ctx.save();
      const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 120);
      sunGlow.addColorStop(0, 'rgba(255, 245, 200, 1.0)');
      sunGlow.addColorStop(0.3, 'rgba(255, 180, 50, 0.45)');
      sunGlow.addColorStop(1, 'rgba(255, 100, 0, 0.0)');
      ctx.fillStyle = sunGlow;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 120, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fffce0';
      ctx.beginPath();
      ctx.arc(sunX, sunY, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Draw Moon
    if (moonY < height + 100) {
      ctx.save();
      const moonGlow = ctx.createRadialGradient(moonX, moonY, 10, moonX, moonY, 70);
      moonGlow.addColorStop(0, 'rgba(220, 240, 255, 0.8)');
      moonGlow.addColorStop(1, 'rgba(100, 180, 255, 0.0)');
      ctx.fillStyle = moonGlow;
      ctx.beginPath();
      ctx.arc(moonX, moonY, 70, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f0f6ff';
      ctx.beginPath();
      ctx.arc(moonX, moonY, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Draw Dynamic Landscape Mountains
    for (let i = 0; i < mountains.length; i++) {
      const m = mountains[i];
      ctx.fillStyle = dayFactor > 0.2 ? m.colorDay : m.colorNight;

      ctx.beginPath();
      ctx.moveTo(0, height);
      for (let x = 0; x <= width; x += 12) {
        const y = height * m.base - Math.sin(x * m.freq + i) * m.amp - Math.cos(x * m.freq * 2.2) * (m.amp * 0.4);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(width, height);
      ctx.closePath();
      ctx.fill();
    }

    // Real-Time Clock & Sky Phase HUD
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 36px monospace';
    const timeDisplay = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    ctx.fillText(timeDisplay, 40, height - 70);

    ctx.font = '14px monospace';
    ctx.fillStyle = dayFactor > 0.4 ? '#ffffff' : '#00f0ff';
    const phaseName = dayFactor > 0.5 ? 'SOLAR DAY' : (dayFactor > 0.1 ? 'GOLDEN TWILIGHT' : 'ASTRONOMICAL NIGHT');
    ctx.fillText(`PHASE: ${phaseName} | PROGRESS: ${(dayProgress * 100).toFixed(1)}%`, 40, height - 42);

    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
</html>
