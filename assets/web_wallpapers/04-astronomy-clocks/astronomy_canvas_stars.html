<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astronomical Star Chart & Celestial Sky</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020308; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Generate catalog of celestial stars with Right Ascension (RA) and Declination (Dec)
  const STAR_COUNT = 900;
  const stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    const ra = Math.random() * Math.PI * 2;
    const dec = (Math.random() - 0.5) * Math.PI;
    const mag = Math.random() * 4.5 + 0.5; // Apparent magnitude
    const color = Math.random() > 0.85 ? '#b8d6ff' : (Math.random() > 0.7 ? '#ffe6b3' : '#ffffff');
    stars.push({ ra, dec, mag, color, twinkle: Math.random() * Math.PI * 2 });
  }

  // Famous Constellations (Orion, Ursa Major, Cassiopeia)
  const constellations = [
    { name: "Orion", links: [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6]] },
    { name: "Ursa Major", links: [[10, 11], [11, 12], [12, 13], [13, 14], [14, 15], [15, 10]] },
    { name: "Cassiopeia", links: [[20, 21], [21, 22], [22, 23], [23, 24]] },
  ];

  let rotation = 0;
  function animate() {
    rotation += 0.0003; // Sidereal celestial rotation

    ctx.fillStyle = '#020308';
    ctx.fillRect(0, 0, width, height);

    // 1. Milky Way Galactic Band Glow
    const mwGrad = ctx.createRadialGradient(width * 0.5, height * 0.5, 50, width * 0.5, height * 0.5, width * 0.7);
    mwGrad.addColorStop(0, 'rgba(30, 45, 90, 0.25)');
    mwGrad.addColorStop(0.5, 'rgba(15, 20, 50, 0.12)');
    mwGrad.addColorStop(1, 'rgba(2, 3, 8, 0.0)');
    ctx.fillStyle = mwGrad;
    ctx.fillRect(0, 0, width, height);

    // 2. Celestial Coordinate Grid (Right Ascension & Declination Circles)
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let r = 100; r < width * 0.8; r += 140) {
      ctx.beginPath();
      ctx.arc(width * 0.5, height * 0.5, r, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 3. Project & Draw Celestial Stars
    const projectedStars = [];
    const cx = width * 0.5;
    const cy = height * 0.5;
    const radiusScale = Math.min(width, height) * 0.45;

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.twinkle += 0.04;

      const angle = s.ra + rotation;
      // Polar stereographic celestial projection
      const r = (Math.PI * 0.5 - s.dec) / Math.PI * radiusScale;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;

      const size = Math.max(0.6, (5.5 - s.mag) * 0.7);
      const alpha = 0.5 + 0.5 * Math.sin(s.twinkle);

      projectedStars.push({ x, y, size, alpha, color: s.color });

      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = alpha;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = s.mag < 1.5 ? 6 : 0;
      ctx.fill();
      ctx.globalAlpha = 1.0;
      ctx.shadowBlur = 0;
    }

    // 4. Constellation Lines
    ctx.strokeStyle = 'rgba(100, 200, 255, 0.35)';
    ctx.lineWidth = 1.0;
    for (const c of constellations) {
      for (const [idx1, idx2] of c.links) {
        if (projectedStars[idx1] && projectedStars[idx2]) {
          ctx.beginPath();
          ctx.moveTo(projectedStars[idx1].x, projectedStars[idx1].y);
          ctx.lineTo(projectedStars[idx2].x, projectedStars[idx2].y);
          ctx.stroke();
        }
      }
    }

    // 5. Real-Time Celestial Ephemeris HUD
    const now = new Date();
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`🌌 CELESTIAL SKY CHART | UTC: ${now.toUTCString()}`, 30, height - 50);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '12px monospace';
    ctx.fillText(`RA: ${(rotation * (180 / Math.PI) % 360).toFixed(2)}° | SIDEREAL ROTATION: 0.0041°/s`, 30, height - 30);

    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
</html>
