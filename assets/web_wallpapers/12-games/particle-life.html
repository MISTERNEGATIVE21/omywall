<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle Life Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  .hud {
    position: fixed; top: 16px; left: 20px; color: rgba(255,255,255,0.85);
    font: bold 14px 'Courier New', monospace; pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  .controls {
    position: fixed; top: 16px; right: 20px; color: rgba(255,255,255,0.6);
    font: 11px 'Segoe UI', sans-serif; pointer-events: none;
    text-align: right; line-height: 1.6;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud"></div>
<div class="controls" id="controls"></div>
<div class="label">Particle Life Simulator</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
const TYPES = 5;
const colors = ['#ff006e', '#fb5607', '#ffbe0b', '#06ffa5', '#3a86ff'];
// interaction matrix - random attraction/repulsion
let matrix;
function randomizeMatrix() {
  matrix = [];
  for (let i = 0; i < TYPES; i++) {
    matrix.push([]);
    for (let j = 0; j < TYPES; j++) {
      matrix[i].push((Math.random() - 0.5) * 2);
    }
  }
}
randomizeMatrix();
setInterval(randomizeMatrix, 15000);
const particles = [];
const N = 400;
for (let i = 0; i < N; i++) {
  particles.push({
    x: Math.random() * w,
    y: Math.random() * h,
    vx: 0, vy: 0,
    type: Math.floor(Math.random() * TYPES)
  });
}
function loop() {
  t += 0.01;
  ctx.fillStyle = 'rgba(5, 5, 15, 0.2)';
  ctx.fillRect(0, 0, w, h);
  const cx = mx * w, cy = my * h;
  // forces
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    let fx = 0, fy = 0;
    for (let j = 0; j < particles.length; j++) {
      if (i === j) continue;
      const q = particles[j];
      const dx = q.x - p.x;
      const dy = q.y - p.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < 1 || d2 > 80*80) continue;
      const d = Math.sqrt(d2);
      const force = matrix[p.type][q.type] / d;
      // repel at very close range
      if (d < 20) {
        fx -= dx / d * 0.5;
        fy -= dy / d * 0.5;
      } else {
        fx += dx / d * force;
        fy += dy / d * force;
      }
    }
    // mouse attraction
    const dx = cx - p.x;
    const dy = cy - p.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < 200 && d > 1) {
      fx += dx / d * 0.1;
      fy += dy / d * 0.1;
    }
    p.vx = p.vx * 0.9 + fx * 0.1;
    p.vy = p.vy * 0.9 + fy * 0.1;
    // limit speed
    const sp = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
    if (sp > 4) { p.vx = p.vx / sp * 4; p.vy = p.vy / sp * 4; }
    p.x += p.vx;
    p.y += p.vy;
    // wrap
    if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
    if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
  }
  // draw connections (same type only)
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    for (let j = i + 1; j < particles.length; j++) {
      const q = particles[j];
      if (p.type !== q.type) continue;
      const dx = q.x - p.x;
      const dy = q.y - p.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < 40*40) {
        const a = (1 - Math.sqrt(d2) / 40) * 0.2;
        ctx.strokeStyle = colors[p.type] + Math.floor(a * 255).toString(16).padStart(2, '0');
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(q.x, q.y);
        ctx.stroke();
      }
    }
  }
  // draw particles
  for (const p of particles) {
    const c = colors[p.type];
    const r = 4;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2);
    grad.addColorStop(0, c);
    grad.addColorStop(1, c + '00');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
