<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  .hud {
    position: fixed; top: 16px; left: 20px; color: rgba(255,255,255,0.85);
    font: bold 14px 'Courier New', monospace; pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  .controls {
    position: fixed; top: 16px; right: 20px; color: rgba(255,255,255,0.6);
    font: 11px 'Segoe UI', sans-serif; pointer-events: none;
    text-align: right; line-height: 1.6;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud"></div>
<div class="controls" id="controls"></div>
<div class="label">Snake Game</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let cellSize, gridW, gridH;
let snake, dir, nextDir, food, score, gameOver, particles, hueOffset;
const hud = document.getElementById('hud');
const ctrl = document.getElementById('controls');
ctrl.innerHTML = 'ARROWS / WASD: move<br>SPACE: restart<br>R: rainbow mode';
function resize() {
  w = cv.width = innerWidth; h = cv.height = innerHeight;
  cellSize = Math.max(15, Math.floor(Math.min(w, h) / 30));
  gridW = Math.floor(w / cellSize);
  gridH = Math.floor(h / cellSize);
}
window.addEventListener('resize', resize); resize();
function reset() {
  snake = [{ x: Math.floor(gridW/2), y: Math.floor(gridH/2) }];
  for (let i = 1; i < 4; i++) snake.push({ x: snake[0].x - i, y: snake[0].y });
  dir = { x: 1, y: 0 };
  nextDir = dir;
  score = 0;
  gameOver = false;
  particles = [];
  hueOffset = 0;
  placeFood();
}
function placeFood() {
  food = { x: Math.floor(Math.random() * gridW), y: Math.floor(Math.random() * gridH), phase: 0 };
  while (snake.some(s => s.x === food.x && s.y === food.y)) {
    food = { x: Math.floor(Math.random() * gridW), y: Math.floor(Math.random() * gridH), phase: 0 };
  }
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') { if (dir.y !== 1) nextDir = { x: 0, y: -1 }; }
  else if (k === 'arrowdown' || k === 's') { if (dir.y !== -1) nextDir = { x: 0, y: 1 }; }
  else if (k === 'arrowleft' || k === 'a') { if (dir.x !== 1) nextDir = { x: -1, y: 0 }; }
  else if (k === 'arrowright' || k === 'd') { if (dir.x !== -1) nextDir = { x: 1, y: 0 }; }
  else if (k === ' ') reset();
  else if (k === 'r') hueOffset = hueOffset === 0 ? 1 : 0;
});
reset();
let moveTimer = 0;
const MOVE_INTERVAL = 7;
function update() {
  if (gameOver) return;
  moveTimer++;
  if (moveTimer < MOVE_INTERVAL) return;
  moveTimer = 0;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= gridW || head.y < 0 || head.y >= gridH || snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true;
    for (const s of snake) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: s.x * cellSize + cellSize/2, y: s.y * cellSize + cellSize/2,
          vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
          life: 1, hue: Math.random() * 360, r: 2 + Math.random() * 3
        });
      }
    }
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    for (let i = 0; i < 20; i++) {
      particles.push({
        x: food.x * cellSize + cellSize/2, y: food.y * cellSize + cellSize/2,
        vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
        life: 1, hue: 0 + Math.random() * 60, r: 2 + Math.random() * 3
      });
    }
    placeFood();
  } else {
    snake.pop();
  }
}
function loop() {
  t += 0.05;
  update();
  // bg gradient
  const bg = ctx.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, '#0a0a1a');
  bg.addColorStop(1, '#1a0a2a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  // grid
  ctx.strokeStyle = 'rgba(100, 100, 200, 0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= gridW; x++) {
    ctx.beginPath();
    ctx.moveTo(x * cellSize, 0); ctx.lineTo(x * cellSize, h);
    ctx.stroke();
  }
  for (let y = 0; y <= gridH; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * cellSize); ctx.lineTo(w, y * cellSize);
    ctx.stroke();
  }
  // food
  food.phase += 0.1;
  const fr = cellSize * 0.4 * (1 + Math.sin(food.phase) * 0.2);
  const fx = food.x * cellSize + cellSize/2;
  const fy = food.y * cellSize + cellSize/2;
  const fgrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr * 3);
  fgrad.addColorStop(0, 'rgba(255, 80, 100, 1)');
  fgrad.addColorStop(0.5, 'rgba(255, 50, 80, 0.4)');
  fgrad.addColorStop(1, 'rgba(255, 0, 50, 0)');
  ctx.fillStyle = fgrad;
  ctx.fillRect(fx - fr * 3, fy - fr * 3, fr * 6, fr * 6);
  ctx.fillStyle = '#ff5060';
  ctx.beginPath();
  ctx.arc(fx, fy, fr, 0, Math.PI * 2);
  ctx.fill();
  // snake
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    const sx = s.x * cellSize + 1;
    const sy = s.y * cellSize + 1;
    const sz = cellSize - 2;
    const hue = (i * 8 + (hueOffset ? t * 30 : 0)) % 360;
    if (i === 0) {
      // head glow
      const grad = ctx.createRadialGradient(sx + sz/2, sy + sz/2, 0, sx + sz/2, sy + sz/2, sz);
      grad.addColorStop(0, `hsla(${hue}, 100%, 70%, 0.8)`);
      grad.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(sx - sz, sy - sz, sz * 3, sz * 3);
    }
    ctx.fillStyle = `hsl(${hue}, 80%, ${i === 0 ? 65 : 55}%)`;
    ctx.fillRect(sx, sy, sz, sz);
    // eyes on head
    if (i === 0) {
      ctx.fillStyle = '#fff';
      const eyeOff = sz * 0.25;
      let e1x, e1y, e2x, e2y;
      if (dir.x === 1) { e1x = sx + sz - eyeOff; e1y = sy + eyeOff; e2x = sx + sz - eyeOff; e2y = sy + sz - eyeOff; }
      else if (dir.x === -1) { e1x = sx + eyeOff; e1y = sy + eyeOff; e2x = sx + eyeOff; e2y = sy + sz - eyeOff; }
      else if (dir.y === 1) { e1x = sx + eyeOff; e1y = sy + sz - eyeOff; e2x = sx + sz - eyeOff; e2y = sy + sz - eyeOff; }
      else { e1x = sx + eyeOff; e1y = sy + eyeOff; e2x = sx + sz - eyeOff; e2y = sy + eyeOff; }
      ctx.beginPath();
      ctx.arc(e1x, e1y, sz * 0.12, 0, Math.PI * 2);
      ctx.arc(e2x, e2y, sz * 0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(e1x, e1y, sz * 0.06, 0, Math.PI * 2);
      ctx.arc(e2x, e2y, sz * 0.06, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${p.life})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  // game over
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#ff5060';
    ctx.font = 'bold 48px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', w/2, h/2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '20px "Segoe UI", sans-serif';
    ctx.fillText('Press SPACE to restart', w/2, h/2 + 30);
    ctx.textAlign = 'left';
  }
  hud.innerHTML = `SCORE: ${score}<br>LENGTH: ${snake.length}`;
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
