<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Target Clicker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  .hud {
    position: fixed; top: 16px; left: 20px; color: rgba(255,255,255,0.85);
    font: bold 14px 'Courier New', monospace; pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  .controls {
    position: fixed; top: 16px; right: 20px; color: rgba(255,255,255,0.6);
    font: 11px 'Segoe UI', sans-serif; pointer-events: none;
    text-align: right; line-height: 1.6;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud"></div>
<div class="controls" id="controls"></div>
<div class="label">Target Clicker</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0, my = 0;
let targets = [], particles = [], score = 0, combo = 0, comboTimer = 0;
const hud = document.getElementById('hud');
const ctrl = document.getElementById('controls');
ctrl.innerHTML = 'CLICK targets to score<br>Build combos for bonus!';
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
window.addEventListener('click', e => {
  let hit = false;
  for (let i = targets.length - 1; i >= 0; i--) {
    const tg = targets[i];
    const dx = e.clientX - tg.x;
    const dy = e.clientY - tg.y;
    if (Math.sqrt(dx*dx + dy*dy) < tg.r) {
      hit = true;
      combo++;
      comboTimer = 60;
      const points = Math.floor(10 * (1 + combo * 0.1));
      score += points;
      // particles
      for (let j = 0; j < 20; j++) {
        particles.push({
          x: tg.x, y: tg.y,
          vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
          life: 1, hue: tg.hue, r: 3 + Math.random() * 4
        });
      }
      // score popup
      particles.push({
        x: tg.x, y: tg.y, vx: 0, vy: -2, life: 1.5,
        hue: 60, r: 0, text: '+' + points + (combo > 1 ? ' x' + combo : '')
      });
      targets.splice(i, 1);
      break;
    }
  }
  if (!hit) combo = 0;
});
function spawnTarget() {
  targets.push({
    x: 80 + Math.random() * (w - 160),
    y: 80 + Math.random() * (h - 160),
    r: 25 + Math.random() * 20,
    hue: Math.random() * 360,
    life: 1,
    decay: 0.005 + Math.random() * 0.01,
    phase: Math.random() * Math.PI * 2,
    vx: (Math.random() - 0.5) * 1.5,
    vy: (Math.random() - 0.5) * 1.5
  });
}
setInterval(spawnTarget, 700);
function loop() {
  t += 0.05;
  // bg
  const bg = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w, h));
  bg.addColorStop(0, '#1a0a2a');
  bg.addColorStop(1, '#050210');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  // grid pattern
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y < h; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  // combo timer
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer === 0) combo = 0;
  }
  // targets
  for (let i = targets.length - 1; i >= 0; i--) {
    const tg = targets[i];
    tg.life -= tg.decay;
    tg.phase += 0.1;
    tg.x += tg.vx; tg.y += tg.vy;
    if (tg.x < tg.r || tg.x > w - tg.r) tg.vx *= -1;
    if (tg.y < tg.r || tg.y > h - tg.r) tg.vy *= -1;
    if (tg.life <= 0) { targets.splice(i, 1); combo = 0; continue; }
    const r = tg.r * (1 + Math.sin(tg.phase) * 0.1);
    // glow
    const grad = ctx.createRadialGradient(tg.x, tg.y, 0, tg.x, tg.y, r * 2);
    grad.addColorStop(0, `hsla(${tg.hue}, 100%, 70%, ${tg.life * 0.8})`);
    grad.addColorStop(0.5, `hsla(${tg.hue}, 100%, 60%, ${tg.life * 0.3})`);
    grad.addColorStop(1, `hsla(${tg.hue}, 100%, 50%, 0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(tg.x - r * 2, tg.y - r * 2, r * 4, r * 4);
    // ring
    ctx.strokeStyle = `hsla(${tg.hue}, 100%, 70%, ${tg.life})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(tg.x, tg.y, r, 0, Math.PI * 2 * tg.life);
    ctx.stroke();
    // dot
    ctx.fillStyle = `hsla(${tg.hue}, 100%, 60%, ${tg.life})`;
    ctx.beginPath();
    ctx.arc(tg.x, tg.y, r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    if (p.r > 0) {
      p.vy += 0.3;
      p.life -= 0.025;
    } else {
      p.life -= 0.02;
    }
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.text) {
      ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.life})`;
      ctx.font = 'bold 24px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
      ctx.textAlign = 'left';
    } else {
      ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${p.life})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // cursor
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(mx, my, 15, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mx - 20, my); ctx.lineTo(mx - 10, my);
  ctx.moveTo(mx + 10, my); ctx.lineTo(mx + 20, my);
  ctx.moveTo(mx, my - 20); ctx.lineTo(mx, my - 10);
  ctx.moveTo(mx, my + 10); ctx.lineTo(mx, my + 20);
  ctx.stroke();
  // combo display
  if (combo > 1) {
    ctx.fillStyle = `rgba(255, 200, 0, ${comboTimer / 60})`;
    ctx.font = 'bold 80px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('x' + combo, w/2, h/2);
    ctx.textAlign = 'left';
  }
  hud.innerHTML = `SCORE: ${score}<br>COMBO: x${combo}`;
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
