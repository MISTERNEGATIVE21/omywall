<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conway's Game of Life</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  .hud {
    position: fixed; top: 16px; left: 20px; color: rgba(255,255,255,0.85);
    font: bold 14px 'Courier New', monospace; pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  .controls {
    position: fixed; top: 16px; right: 20px; color: rgba(255,255,255,0.6);
    font: 11px 'Segoe UI', sans-serif; pointer-events: none;
    text-align: right; line-height: 1.6;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud"></div>
<div class="controls" id="controls"></div>
<div class="label">Conway's Game of Life</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let cellSize, gridW, gridH;
let grid, hueGrid;
let stepTimer = 0;
let mx = 0, my = 0;
let drawing = false;
const hud = document.getElementById('hud');
const ctrl = document.getElementById('controls');
ctrl.innerHTML = "Conway's Game of Life<br>CLICK + DRAG: draw cells<br>SPACE: pause/resume<br>R: randomize<br>C: clear";
let paused = false;
function resize() {
  w = cv.width = innerWidth; h = cv.height = innerHeight;
  cellSize = Math.max(8, Math.floor(Math.min(w, h) / 60));
  gridW = Math.floor(w / cellSize);
  gridH = Math.floor(h / cellSize);
  init();
}
window.addEventListener('resize', resize);
window.addEventListener('mousedown', e => { drawing = true; paint(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { drawing = false; });
window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; if (drawing) paint(e.clientX, e.clientY); });
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ') paused = !paused;
  else if (k === 'r') randomize();
  else if (k === 'c') clearGrid();
  else if (k === 'g') seedGlider();
});
function init() {
  grid = []; hueGrid = [];
  for (let y = 0; y < gridH; y++) {
    grid.push(new Array(gridW).fill(0));
    hueGrid.push(new Array(gridW).fill(0));
  }
  randomize();
}
function randomize() {
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      grid[y][x] = Math.random() < 0.3 ? 1 : 0;
      hueGrid[y][x] = Math.random() * 360;
    }
  }
}
function clearGrid() {
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      grid[y][x] = 0;
    }
  }
}
function seedGlider() {
  // place gliders at random positions
  for (let g = 0; g < 5; g++) {
    const sx = Math.floor(Math.random() * (gridW - 5));
    const sy = Math.floor(Math.random() * (gridH - 5));
    const glider = [[0,1,0],[0,0,1],[1,1,1]];
    const hue = Math.random() * 360;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        if (glider[r][c]) {
          grid[sy + r][sx + c] = 1;
          hueGrid[sy + r][sx + c] = hue;
        }
      }
    }
  }
}
function paint(x, y) {
  const gx = Math.floor(x / cellSize);
  const gy = Math.floor(y / cellSize);
  if (gx >= 0 && gx < gridW && gy >= 0 && gy < gridH) {
    grid[gy][gx] = 1;
    hueGrid[gy][gx] = (Date.now() * 0.1) % 360;
  }
}
function step() {
  const newGrid = []; const newHue = [];
  for (let y = 0; y < gridH; y++) {
    newGrid.push(new Array(gridW).fill(0));
    newHue.push(new Array(gridW).fill(0));
  }
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      let n = 0;
      let hueSum = 0, hueCount = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = (x + dx + gridW) % gridW;
          const ny = (y + dy + gridH) % gridH;
          if (grid[ny][nx]) {
            n++;
            hueSum += hueGrid[ny][nx];
            hueCount++;
          }
        }
      }
      if (grid[y][x]) {
        newGrid[y][x] = (n === 2 || n === 3) ? 1 : 0;
      } else {
        newGrid[y][x] = (n === 3) ? 1 : 0;
      }
      if (newGrid[y][x]) {
        newHue[y][x] = hueCount > 0 ? (hueSum / hueCount + 1) % 360 : hueGrid[y][x];
      }
    }
  }
  grid = newGrid; hueGrid = newHue;
}
resize();
function loop() {
  t += 0.02;
  // bg
  const bg = ctx.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, '#020408');
  bg.addColorStop(1, '#080820');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  if (!paused) {
    stepTimer++;
    if (stepTimer > 8) {
      step();
      stepTimer = 0;
    }
  }
  // cells
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      if (grid[y][x]) {
        const hue = hueGrid[y][x];
        ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
        ctx.shadowColor = `hsl(${hue}, 80%, 60%)`;
        ctx.shadowBlur = 4;
        ctx.fillRect(x * cellSize + 1, y * cellSize + 1, cellSize - 2, cellSize - 2);
      }
    }
  }
  ctx.shadowBlur = 0;
  // cursor highlight
  const gx = Math.floor(mx / cellSize);
  const gy = Math.floor(my / cellSize);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(gx * cellSize, gy * cellSize, cellSize, cellSize);
  let count = 0;
  for (let y = 0; y < gridH; y++) for (let x = 0; x < gridW; x++) if (grid[y][x]) count++;
  hud.innerHTML = `CELLS: ${count}<br>${paused ? 'PAUSED' : 'EVOLVING'}<br>GEN: ${Math.floor(t * 5)}`;
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
