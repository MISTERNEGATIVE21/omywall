<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMY WALL Particle Dispersion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030407;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  let particles = [];
  // Extra small, delicate, razor-sharp mouse pointer
  const mouse = { x: -2000, y: -2000, radius: 32 };
  let shockwaves = [];

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initParticles();
  }
  window.addEventListener('resize', resize);

  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mouseleave', () => {
    mouse.x = -2000;
    mouse.y = -2000;
  });
  window.addEventListener('touchmove', e => {
    if (e.touches && e.touches[0]) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });
  window.addEventListener('touchend', () => {
    mouse.x = -2000;
    mouse.y = -2000;
  });

  window.addEventListener('mousedown', e => {
    shockwaves.push({
      x: e.clientX,
      y: e.clientY,
      radius: 3,
      maxRadius: 180,
      strength: 26,
      alpha: 1.0
    });
  });
  window.addEventListener('touchstart', e => {
    if (e.touches && e.touches[0]) {
      shockwaves.push({
        x: e.touches[0].clientX,
        y: e.touches[0].clientY,
        radius: 3,
        maxRadius: 180,
        strength: 26,
        alpha: 1.0
      });
    }
  }, { passive: true });

  class ImageParticle {
    constructor(originX, originY, color) {
      this.originX = originX;
      this.originY = originY;
      this.x = originX + (Math.random() - 0.5) * 400;
      this.y = originY + (Math.random() - 0.5) * 400;
      this.vx = (Math.random() - 0.5) * 2;
      this.vy = (Math.random() - 0.5) * 2;
      this.color = color;
      this.size = 2.4;
      this.ease = 0.08 + Math.random() * 0.02;
      this.friction = 0.86;
    }
    update() {
      // Spring attraction to origin coordinate
      const dxOrigin = this.originX - this.x;
      const dyOrigin = this.originY - this.y;
      this.vx += dxOrigin * this.ease;
      this.vy += dyOrigin * this.ease;

      // Small, precise pointer repulsion
      const dxMouse = this.x - mouse.x;
      const dyMouse = this.y - mouse.y;
      const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
      if (distMouse < mouse.radius && distMouse > 0.1) {
        const force = (mouse.radius - distMouse) / mouse.radius;
        const angle = Math.atan2(dyMouse, dxMouse);
        const push = force * force * 16.0;
        this.vx += Math.cos(angle) * push;
        this.vy += Math.sin(angle) * push;
      }

      // Click shockwaves
      for (const sw of shockwaves) {
        const dxSw = this.x - sw.x;
        const dySw = this.y - sw.y;
        const distSw = Math.sqrt(dxSw * dxSw + dySw * dySw);
        if (Math.abs(distSw - sw.radius) < 22 && distSw > 0.1) {
          const angle = Math.atan2(dySw, dxSw);
          const push = (1.0 - Math.abs(distSw - sw.radius) / 22) * sw.strength * sw.alpha;
          this.vx += Math.cos(angle) * push;
          this.vy += Math.sin(angle) * push;
        }
      }

      this.vx *= this.friction;
      this.vy *= this.friction;

      this.x += this.vx;
      this.y += this.vy;
    }
    draw() {
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.size, this.size);
    }
  }

  function initParticles() {
    particles = [];

    const boxW = Math.min(width * 0.88, 850);
    const boxH = Math.min(height * 0.78, 650);
    const offCanvas = document.createElement('canvas');
    offCanvas.width = Math.floor(boxW);
    offCanvas.height = Math.floor(boxH);
    const offCtx = offCanvas.getContext('2d');

    offCtx.clearRect(0, 0, boxW, boxH);

    // Large Bold Simple Typography: OMY on top line, WALL on next line
    const fontSize = Math.floor(Math.min(boxW * 0.42, boxH * 0.44));
    offCtx.font = `900 ${fontSize}px sans-serif`;
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';

    const cx = boxW * 0.5;
    const y1 = boxH * 0.28;
    const y2 = boxH * 0.72;

    // Line 1: OMY in bright cyan
    offCtx.fillStyle = '#00f0ff';
    offCtx.fillText('OMY', cx, y1);

    // Line 2: WALL in vibrant neon pink
    offCtx.fillStyle = '#ff007f';
    offCtx.fillText('WALL', cx, y2);

    // Sample pixels to generate particles
    const imgData = offCtx.getImageData(0, 0, Math.floor(boxW), Math.floor(boxH)).data;
    const startX = (width - boxW) * 0.5;
    const startY = (height - boxH) * 0.5;
    const step = 4; // High density sampling

    for (let y = 0; y < boxH; y += step) {
      for (let x = 0; x < boxW; x += step) {
        const idx = Math.floor(y * Math.floor(boxW) + x) * 4;
        const alpha = imgData[idx + 3];
        if (alpha > 70) {
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];
          const col = `rgb(${r}, ${g}, ${b})`;
          particles.push(new ImageParticle(startX + x, startY + y, col));
        }
      }
    }
  }

  resize();

  function animate() {
    ctx.fillStyle = 'rgba(3, 4, 7, 0.22)';
    ctx.fillRect(0, 0, width, height);

    // Update shockwaves
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.radius += 5.5;
      sw.alpha = 1.0 - (sw.radius / sw.maxRadius);
      if (sw.radius >= sw.maxRadius) {
        shockwaves.splice(i, 1);
      }
    }

    // Update and draw particles
    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
    }

    // Small subtle pointer aura
    if (mouse.x > 0 && mouse.y > 0) {
      const pGrad = ctx.createRadialGradient(mouse.x, mouse.y, 1, mouse.x, mouse.y, mouse.radius);
      pGrad.addColorStop(0, 'rgba(0, 240, 255, 0.3)');
      pGrad.addColorStop(1, 'rgba(0, 240, 255, 0)');
      ctx.fillStyle = pGrad;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }

  animate();
})();
</script>
</body>
</html>
