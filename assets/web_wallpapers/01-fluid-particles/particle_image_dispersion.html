<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMYWALL Cyber Geometric Particle Dispersion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #040508;
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  let particles = [];
  const mouse = { x: -2000, y: -2000, radius: 52 };
  let shockwaves = [];

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initParticles();
  }
  window.addEventListener('resize', resize);

  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mouseleave', () => {
    mouse.x = -2000;
    mouse.y = -2000;
  });
  window.addEventListener('touchmove', e => {
    if (e.touches && e.touches[0]) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });
  window.addEventListener('touchend', () => {
    mouse.x = -2000;
    mouse.y = -2000;
  });

  window.addEventListener('mousedown', e => {
    shockwaves.push({
      x: e.clientX,
      y: e.clientY,
      radius: 4,
      maxRadius: 200,
      strength: 30,
      alpha: 1.0
    });
  });
  window.addEventListener('touchstart', e => {
    if (e.touches && e.touches[0]) {
      shockwaves.push({
        x: e.touches[0].clientX,
        y: e.touches[0].clientY,
        radius: 4,
        maxRadius: 200,
        strength: 30,
        alpha: 1.0
      });
    }
  }, { passive: true });

  class ImageParticle {
    constructor(originX, originY, color, size) {
      this.originX = originX;
      this.originY = originY;
      this.x = originX + (Math.random() - 0.5) * 500;
      this.y = originY + (Math.random() - 0.5) * 500;
      this.vx = (Math.random() - 0.5) * 2;
      this.vy = (Math.random() - 0.5) * 2;
      this.color = color;
      this.size = size || 2.2;
      this.ease = 0.08 + Math.random() * 0.02;
      this.friction = 0.87;
    }
    update() {
      // Spring attraction to origin coordinate
      const dxOrigin = this.originX - this.x;
      const dyOrigin = this.originY - this.y;
      this.vx += dxOrigin * this.ease;
      this.vy += dyOrigin * this.ease;

      // Tight, delicate mouse pointer repulsion
      const dxMouse = this.x - mouse.x;
      const dyMouse = this.y - mouse.y;
      const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
      if (distMouse < mouse.radius && distMouse > 0.1) {
        const force = (mouse.radius - distMouse) / mouse.radius;
        const angle = Math.atan2(dyMouse, dxMouse);
        const push = force * force * 18.0;
        this.vx += Math.cos(angle) * push;
        this.vy += Math.sin(angle) * push;
      }

      // Click shockwaves
      for (const sw of shockwaves) {
        const dxSw = this.x - sw.x;
        const dySw = this.y - sw.y;
        const distSw = Math.sqrt(dxSw * dxSw + dySw * dySw);
        if (Math.abs(distSw - sw.radius) < 25 && distSw > 0.1) {
          const angle = Math.atan2(dySw, dxSw);
          const push = (1.0 - Math.abs(distSw - sw.radius) / 25) * sw.strength * sw.alpha;
          this.vx += Math.cos(angle) * push;
          this.vy += Math.sin(angle) * push;
        }
      }

      this.vx *= this.friction;
      this.vy *= this.friction;

      this.x += this.vx;
      this.y += this.vy;
    }
    draw() {
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.size, this.size);
    }
  }

  function initParticles() {
    particles = [];
    // Render large classic geometric emblem onto high-res offscreen canvas
    const size = Math.min(width, height) * 0.82;
    const offCanvas = document.createElement('canvas');
    offCanvas.width = Math.floor(size);
    offCanvas.height = Math.floor(size);
    const offCtx = offCanvas.getContext('2d');

    offCtx.clearRect(0, 0, size, size);
    offCtx.save();
    offCtx.translate(size * 0.5, size * 0.5);

    // 1. Glowing Concentric Neon Rings
    // Outer Cyan Ring
    offCtx.strokeStyle = '#00f0ff';
    offCtx.lineWidth = Math.max(14, size * 0.024);
    offCtx.beginPath();
    offCtx.arc(0, 0, size * 0.38, 0, Math.PI * 2);
    offCtx.stroke();

    // Inner Emerald Ring Accent
    offCtx.strokeStyle = '#00ff9d';
    offCtx.lineWidth = Math.max(6, size * 0.010);
    offCtx.beginPath();
    offCtx.arc(0, 0, size * 0.43, 0, Math.PI * 2);
    offCtx.stroke();

    // 2. Glowing Cyber Diamond (Magenta/Pink)
    offCtx.strokeStyle = '#ff007f';
    offCtx.lineWidth = Math.max(12, size * 0.020);
    offCtx.beginPath();
    offCtx.moveTo(0, -size * 0.42);
    offCtx.lineTo(size * 0.42, 0);
    offCtx.lineTo(0, size * 0.42);
    offCtx.lineTo(-size * 0.42, 0);
    offCtx.closePath();
    offCtx.stroke();

    // Secondary Inner Diamond Accent
    offCtx.strokeStyle = '#9900ff';
    offCtx.lineWidth = Math.max(5, size * 0.008);
    offCtx.beginPath();
    offCtx.moveTo(0, -size * 0.28);
    offCtx.lineTo(size * 0.28, 0);
    offCtx.lineTo(0, size * 0.28);
    offCtx.lineTo(-size * 0.28, 0);
    offCtx.closePath();
    offCtx.stroke();

    // 3. Omarchy / Arch Apex Geometric Chevron
    offCtx.strokeStyle = '#00e5ff';
    offCtx.lineWidth = Math.max(7, size * 0.012);
    offCtx.beginPath();
    offCtx.moveTo(-size * 0.22, -size * 0.08);
    offCtx.lineTo(0, -size * 0.24);
    offCtx.lineTo(size * 0.22, -size * 0.08);
    offCtx.stroke();

    // 4. Bold Centered "OMYWALL" Typography
    const fontSize = Math.floor(size * 0.135);
    offCtx.fillStyle = '#ffffff';
    offCtx.font = `900 ${fontSize}px 'Inter', sans-serif`;
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';
    offCtx.fillText('OMYWALL', 0, size * 0.02);

    // Subtitle "OMARCHY" in neon cyan
    const subFontSize = Math.floor(size * 0.045);
    offCtx.font = `800 ${subFontSize}px 'Inter', sans-serif`;
    offCtx.fillStyle = '#00f0ff';
    offCtx.fillText('OMARCHY ENGINE', 0, size * 0.15);

    offCtx.restore();

    // Sample pixels at regular stride to generate high density particles
    const imgData = offCtx.getImageData(0, 0, Math.floor(size), Math.floor(size)).data;
    const startX = (width - size) * 0.5;
    const startY = (height - size) * 0.5;
    const step = 4; // High density sampling

    for (let y = 0; y < size; y += step) {
      for (let x = 0; x < size; x += step) {
        const idx = Math.floor(y * Math.floor(size) + x) * 4;
        const alpha = imgData[idx + 3];
        if (alpha > 75) {
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];
          const col = `rgb(${r}, ${g}, ${b})`;
          particles.push(new ImageParticle(startX + x, startY + y, col, 2.2));
        }
      }
    }
  }

  resize();

  function animate() {
    ctx.fillStyle = 'rgba(4, 5, 8, 0.22)';
    ctx.fillRect(0, 0, width, height);

    // Update shockwaves
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.radius += 6.0;
      sw.alpha = 1.0 - (sw.radius / sw.maxRadius);
      if (sw.radius >= sw.maxRadius) {
        shockwaves.splice(i, 1);
      }
    }

    // Update and draw particles
    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
    }

    // Subtle pointer aura
    if (mouse.x > 0 && mouse.y > 0) {
      const pGrad = ctx.createRadialGradient(mouse.x, mouse.y, 2, mouse.x, mouse.y, mouse.radius);
      pGrad.addColorStop(0, 'rgba(0, 240, 255, 0.25)');
      pGrad.addColorStop(1, 'rgba(0, 240, 255, 0)');
      ctx.fillStyle = pGrad;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }

  animate();
})();
</script>
</body>
</html>
