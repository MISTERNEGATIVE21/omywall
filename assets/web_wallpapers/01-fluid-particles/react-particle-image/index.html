<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMYWALL & Omarchy Particle Dispersion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
    body { background: #030509; color: #fff; width: 100vw; height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [], shockwaves = [];
    const mouse = { x: -9999, y: -9999, radius: 52 };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      init();
    }

    class Particle {
      constructor(originX, originY, color, size) {
        this.originX = originX;
        this.originY = originY;
        this.x = originX + (Math.random() - 0.5) * 600;
        this.y = originY + (Math.random() - 0.5) * 600;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.size = size || 2.3;
        this.color = color;
        this.ease = 0.08 + Math.random() * 0.03;
        this.friction = 0.86;
      }
      update() {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist < mouse.radius && dist > 0.1) {
          const force = (mouse.radius - dist) / mouse.radius;
          const angle = Math.atan2(dy, dx);
          const push = force * force * 18;
          this.vx -= Math.cos(angle) * push;
          this.vy -= Math.sin(angle) * push;
        }

        for (const sw of shockwaves) {
          const dxSw = this.x - sw.x;
          const dySw = this.y - sw.y;
          const distSw = Math.hypot(dxSw, dySw);
          if (Math.abs(distSw - sw.radius) < 25 && distSw > 0.1) {
            const angle = Math.atan2(dySw, dxSw);
            const push = (1.0 - Math.abs(distSw - sw.radius) / 25) * sw.strength * sw.alpha;
            this.vx += Math.cos(angle) * push;
            this.vy += Math.sin(angle) * push;
          }
        }

        this.vx += (this.originX - this.x) * this.ease;
        this.vy += (this.originY - this.y) * this.ease;
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.x += this.vx;
        this.y += this.vy;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    function init() {
      particles = [];
      const emblemW = Math.min(width * 0.82, 1000);
      const emblemH = emblemW * 0.68;
      const off = document.createElement('canvas');
      off.width = Math.floor(emblemW);
      off.height = Math.floor(emblemH);
      const octx = off.getContext('2d');

      const cx = emblemW * 0.5;
      const cy = emblemH * 0.44;
      const frameW = emblemW * 0.72;
      const frameH = emblemH * 0.58;
      const frameX = cx - frameW * 0.5;
      const frameY = cy - frameH * 0.52;

      // Outer Frame
      octx.strokeStyle = '#00e5ff';
      octx.lineWidth = 6;
      octx.beginPath();
      octx.roundRect(frameX, frameY, frameW, frameH, 18);
      octx.stroke();

      // Cyber Sun
      const sunGrad = octx.createRadialGradient(cx, frameY + frameH * 0.38, 5, cx, frameY + frameH * 0.38, frameH * 0.32);
      sunGrad.addColorStop(0, '#ffff55');
      sunGrad.addColorStop(0.4, '#ff3388');
      sunGrad.addColorStop(1, 'rgba(255, 0, 100, 0)');
      octx.fillStyle = sunGrad;
      octx.beginPath();
      octx.arc(cx, frameY + frameH * 0.38, frameH * 0.32, 0, Math.PI * 2);
      octx.fill();

      // Peaks
      octx.fillStyle = '#6a11cb';
      octx.beginPath();
      octx.moveTo(frameX + frameW * 0.05, frameY + frameH * 0.9);
      octx.lineTo(cx - frameW * 0.16, frameY + frameH * 0.28);
      octx.lineTo(cx + frameW * 0.12, frameY + frameH * 0.9);
      octx.closePath();
      octx.fill();

      octx.fillStyle = '#2575fc';
      octx.beginPath();
      octx.moveTo(cx - frameW * 0.08, frameY + frameH * 0.9);
      octx.lineTo(cx + frameW * 0.18, frameY + frameH * 0.22);
      octx.lineTo(frameX + frameW * 0.95, frameY + frameH * 0.9);
      octx.closePath();
      octx.fill();

      octx.fillStyle = '#120b29';
      octx.beginPath();
      octx.moveTo(frameX, frameY + frameH * 0.9);
      octx.lineTo(cx - frameW * 0.25, frameY + frameH * 0.62);
      octx.lineTo(cx, frameY + frameH * 0.48);
      octx.lineTo(cx + frameW * 0.28, frameY + frameH * 0.65);
      octx.lineTo(frameX + frameW, frameY + frameH * 0.9);
      octx.closePath();
      octx.fill();

      // Horizon Wave
      const waveGrad = octx.createLinearGradient(frameX, 0, frameX + frameW, 0);
      waveGrad.addColorStop(0, '#00f5ff');
      waveGrad.addColorStop(0.5, '#00ff9d');
      waveGrad.addColorStop(1, '#00aaff');
      octx.strokeStyle = waveGrad;
      octx.lineWidth = 5;
      octx.beginPath();
      octx.moveTo(frameX + 10, frameY + frameH * 0.88);
      octx.lineTo(frameX + frameW - 10, frameY + frameH * 0.88);
      octx.stroke();

      // Typography
      const fontSize = Math.floor(emblemW * 0.095);
      octx.font = `900 ${fontSize}px 'Inter', sans-serif`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillStyle = '#ffffff';
      octx.fillText('OMYWALL', cx, cy + frameH * 0.62);

      const subSize = Math.floor(emblemW * 0.038);
      octx.font = `800 ${subSize}px 'Inter', sans-serif`;
      octx.fillStyle = '#00f0ff';
      octx.fillText('OMARCHY DESKTOP ENGINE', cx, cy + frameH * 0.78);

      const imgData = octx.getImageData(0, 0, Math.floor(emblemW), Math.floor(emblemH)).data;
      const startX = (width - emblemW) * 0.5;
      const startY = (height - emblemH) * 0.5;
      const step = 4;
      for (let y = 0; y < emblemH; y += step) {
        for (let x = 0; x < emblemW; x += step) {
          const idx = Math.floor(y * Math.floor(emblemW) + x) * 4;
          if (imgData[idx + 3] > 70) {
            const color = `rgb(${imgData[idx]}, ${imgData[idx+1]}, ${imgData[idx+2]})`;
            particles.push(new Particle(startX + x, startY + y, color, 2.3));
          }
        }
      }
    }

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    }, { passive: true });
    window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('touchend', () => { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('mousedown', (e) => {
      shockwaves.push({ x: e.clientX, y: e.clientY, radius: 5, maxRadius: 180, strength: 28, alpha: 1.0 });
    });
    window.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches[0]) {
        shockwaves.push({ x: e.touches[0].clientX, y: e.touches[0].clientY, radius: 5, maxRadius: 180, strength: 28, alpha: 1.0 });
      }
    }, { passive: true });

    window.addEventListener('resize', resize);
    resize();

    function render() {
      ctx.fillStyle = 'rgba(3, 5, 9, 0.22)';
      ctx.fillRect(0, 0, width, height);

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 5.5;
        sw.alpha = 1.0 - (sw.radius / sw.maxRadius);
        if (sw.radius >= sw.maxRadius) shockwaves.splice(i, 1);
      }

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }

      if (mouse.x > 0 && mouse.y > 0) {
        const pGrad = ctx.createRadialGradient(mouse.x, mouse.y, 2, mouse.x, mouse.y, mouse.radius);
        pGrad.addColorStop(0, 'rgba(0, 240, 255, 0.25)');
        pGrad.addColorStop(1, 'rgba(0, 240, 255, 0)');
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
