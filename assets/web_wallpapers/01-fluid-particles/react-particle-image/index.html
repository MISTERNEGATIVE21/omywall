<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMY WALL Particle Dispersion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
    body { background: #030407; color: #fff; width: 100vw; height: 100vh; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [], shockwaves = [];
    const mouse = { x: -9999, y: -9999, radius: 32 };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      init();
    }

    class Particle {
      constructor(originX, originY, color) {
        this.originX = originX;
        this.originY = originY;
        this.x = originX + (Math.random() - 0.5) * 400;
        this.y = originY + (Math.random() - 0.5) * 400;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.size = 2.4;
        this.color = color;
        this.ease = 0.08 + Math.random() * 0.02;
        this.friction = 0.86;
      }
      update() {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist < mouse.radius && dist > 0.1) {
          const force = (mouse.radius - dist) / mouse.radius;
          const angle = Math.atan2(dy, dx);
          const push = force * force * 16;
          this.vx -= Math.cos(angle) * push;
          this.vy -= Math.sin(angle) * push;
        }

        for (const sw of shockwaves) {
          const dxSw = this.x - sw.x;
          const dySw = this.y - sw.y;
          const distSw = Math.hypot(dxSw, dySw);
          if (Math.abs(distSw - sw.radius) < 22 && distSw > 0.1) {
            const angle = Math.atan2(dySw, dxSw);
            const push = (1.0 - Math.abs(distSw - sw.radius) / 22) * sw.strength * sw.alpha;
            this.vx += Math.cos(angle) * push;
            this.vy += Math.sin(angle) * push;
          }
        }

        this.vx += (this.originX - this.x) * this.ease;
        this.vy += (this.originY - this.y) * this.ease;
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.x += this.vx;
        this.y += this.vy;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    function init() {
      particles = [];
      const boxW = Math.min(width * 0.88, 850);
      const boxH = Math.min(height * 0.78, 650);
      const off = document.createElement('canvas');
      off.width = Math.floor(boxW);
      off.height = Math.floor(boxH);
      const octx = off.getContext('2d');

      octx.clearRect(0, 0, boxW, boxH);
      const fontSize = Math.floor(Math.min(boxW * 0.42, boxH * 0.44));
      octx.font = `900 ${fontSize}px sans-serif`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';

      const cx = boxW * 0.5;
      const y1 = boxH * 0.28;
      const y2 = boxH * 0.72;

      octx.fillStyle = '#00f0ff';
      octx.fillText('OMY', cx, y1);

      octx.fillStyle = '#ff007f';
      octx.fillText('WALL', cx, y2);

      const imgData = octx.getImageData(0, 0, Math.floor(boxW), Math.floor(boxH)).data;
      const startX = (width - boxW) * 0.5;
      const startY = (height - boxH) * 0.5;
      const step = 4;
      for (let y = 0; y < boxH; y += step) {
        for (let x = 0; x < boxW; x += step) {
          const idx = Math.floor(y * Math.floor(boxW) + x) * 4;
          if (imgData[idx + 3] > 70) {
            const color = `rgb(${imgData[idx]}, ${imgData[idx+1]}, ${imgData[idx+2]})`;
            particles.push(new Particle(startX + x, startY + y, color));
          }
        }
      }
    }

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    }, { passive: true });
    window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('touchend', () => { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('mousedown', (e) => {
      shockwaves.push({ x: e.clientX, y: e.clientY, radius: 3, maxRadius: 180, strength: 26, alpha: 1.0 });
    });
    window.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches[0]) {
        shockwaves.push({ x: e.touches[0].clientX, y: e.touches[0].clientY, radius: 3, maxRadius: 180, strength: 26, alpha: 1.0 });
      }
    }, { passive: true });

    window.addEventListener('resize', resize);
    resize();

    function render() {
      ctx.fillStyle = 'rgba(3, 4, 7, 0.22)';
      ctx.fillRect(0, 0, width, height);

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 5.5;
        sw.alpha = 1.0 - (sw.radius / sw.maxRadius);
        if (sw.radius >= sw.maxRadius) shockwaves.splice(i, 1);
      }

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }

      if (mouse.x > 0 && mouse.y > 0) {
        const pGrad = ctx.createRadialGradient(mouse.x, mouse.y, 1, mouse.x, mouse.y, mouse.radius);
        pGrad.addColorStop(0, 'rgba(0, 240, 255, 0.3)');
        pGrad.addColorStop(1, 'rgba(0, 240, 255, 0)');
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
