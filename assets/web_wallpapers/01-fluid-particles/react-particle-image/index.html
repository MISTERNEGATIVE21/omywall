<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMYWALL Cyber Geometric Particle Dispersion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
    body { background: #040508; color: #fff; width: 100vw; height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [], shockwaves = [];
    const mouse = { x: -9999, y: -9999, radius: 52 };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      init();
    }

    class Particle {
      constructor(originX, originY, color, size) {
        this.originX = originX;
        this.originY = originY;
        this.x = originX + (Math.random() - 0.5) * 500;
        this.y = originY + (Math.random() - 0.5) * 500;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.size = size || 2.2;
        this.color = color;
        this.ease = 0.08 + Math.random() * 0.02;
        this.friction = 0.87;
      }
      update() {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist < mouse.radius && dist > 0.1) {
          const force = (mouse.radius - dist) / mouse.radius;
          const angle = Math.atan2(dy, dx);
          const push = force * force * 18;
          this.vx -= Math.cos(angle) * push;
          this.vy -= Math.sin(angle) * push;
        }

        for (const sw of shockwaves) {
          const dxSw = this.x - sw.x;
          const dySw = this.y - sw.y;
          const distSw = Math.hypot(dxSw, dySw);
          if (Math.abs(distSw - sw.radius) < 25 && distSw > 0.1) {
            const angle = Math.atan2(dySw, dxSw);
            const push = (1.0 - Math.abs(distSw - sw.radius) / 25) * sw.strength * sw.alpha;
            this.vx += Math.cos(angle) * push;
            this.vy += Math.sin(angle) * push;
          }
        }

        this.vx += (this.originX - this.x) * this.ease;
        this.vy += (this.originY - this.y) * this.ease;
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.x += this.vx;
        this.y += this.vy;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    function init() {
      particles = [];
      const size = Math.min(width, height) * 0.82;
      const off = document.createElement('canvas');
      off.width = Math.floor(size);
      off.height = Math.floor(size);
      const octx = off.getContext('2d');

      octx.clearRect(0, 0, size, size);
      octx.save();
      octx.translate(size * 0.5, size * 0.5);

      // Rings
      octx.strokeStyle = '#00f0ff';
      octx.lineWidth = Math.max(14, size * 0.024);
      octx.beginPath();
      octx.arc(0, 0, size * 0.38, 0, Math.PI * 2);
      octx.stroke();

      octx.strokeStyle = '#00ff9d';
      octx.lineWidth = Math.max(6, size * 0.010);
      octx.beginPath();
      octx.arc(0, 0, size * 0.43, 0, Math.PI * 2);
      octx.stroke();

      // Diamonds
      octx.strokeStyle = '#ff007f';
      octx.lineWidth = Math.max(12, size * 0.020);
      octx.beginPath();
      octx.moveTo(0, -size * 0.42);
      octx.lineTo(size * 0.42, 0);
      octx.lineTo(0, size * 0.42);
      octx.lineTo(-size * 0.42, 0);
      octx.closePath();
      octx.stroke();

      octx.strokeStyle = '#9900ff';
      octx.lineWidth = Math.max(5, size * 0.008);
      octx.beginPath();
      octx.moveTo(0, -size * 0.28);
      octx.lineTo(size * 0.28, 0);
      octx.lineTo(0, size * 0.28);
      octx.lineTo(-size * 0.28, 0);
      octx.closePath();
      octx.stroke();

      // Arch Chevron
      octx.strokeStyle = '#00e5ff';
      octx.lineWidth = Math.max(7, size * 0.012);
      octx.beginPath();
      octx.moveTo(-size * 0.22, -size * 0.08);
      octx.lineTo(0, -size * 0.24);
      octx.lineTo(size * 0.22, -size * 0.08);
      octx.stroke();

      // Typography
      const fontSize = Math.floor(size * 0.135);
      octx.fillStyle = '#ffffff';
      octx.font = `900 ${fontSize}px 'Inter', sans-serif`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillText('OMYWALL', 0, size * 0.02);

      const subFontSize = Math.floor(size * 0.045);
      octx.font = `800 ${subFontSize}px 'Inter', sans-serif`;
      octx.fillStyle = '#00f0ff';
      octx.fillText('OMARCHY ENGINE', 0, size * 0.15);

      octx.restore();

      const imgData = octx.getImageData(0, 0, Math.floor(size), Math.floor(size)).data;
      const startX = (width - size) * 0.5;
      const startY = (height - size) * 0.5;
      const step = 4;
      for (let y = 0; y < size; y += step) {
        for (let x = 0; x < size; x += step) {
          const idx = Math.floor(y * Math.floor(size) + x) * 4;
          if (imgData[idx + 3] > 75) {
            const color = `rgb(${imgData[idx]}, ${imgData[idx+1]}, ${imgData[idx+2]})`;
            particles.push(new Particle(startX + x, startY + y, color, 2.2));
          }
        }
      }
    }

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    }, { passive: true });
    window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('touchend', () => { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('mousedown', (e) => {
      shockwaves.push({ x: e.clientX, y: e.clientY, radius: 4, maxRadius: 200, strength: 30, alpha: 1.0 });
    });
    window.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches[0]) {
        shockwaves.push({ x: e.touches[0].clientX, y: e.touches[0].clientY, radius: 4, maxRadius: 200, strength: 30, alpha: 1.0 });
      }
    }, { passive: true });

    window.addEventListener('resize', resize);
    resize();

    function render() {
      ctx.fillStyle = 'rgba(4, 5, 8, 0.22)';
      ctx.fillRect(0, 0, width, height);

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 6.0;
        sw.alpha = 1.0 - (sw.radius / sw.maxRadius);
        if (sw.radius >= sw.maxRadius) shockwaves.splice(i, 1);
      }

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }

      if (mouse.x > 0 && mouse.y > 0) {
        const pGrad = ctx.createRadialGradient(mouse.x, mouse.y, 2, mouse.x, mouse.y, mouse.radius);
        pGrad.addColorStop(0, 'rgba(0, 240, 255, 0.25)');
        pGrad.addColorStop(1, 'rgba(0, 240, 255, 0)');
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
