<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Particle Image Dispersion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
    body { background: #030712; color: #fff; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];
    const mouse = { x: -9999, y: -9999, radius: 120 };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      init();
    }

    class Particle {
      constructor(originX, originY, color) {
        this.originX = originX;
        this.originY = originY;
        this.x = originX + (Math.random() - 0.5) * 400;
        this.y = originY + (Math.random() - 0.5) * 400;
        this.vx = 0;
        this.vy = 0;
        this.size = 2.0;
        this.color = color;
        this.ease = 0.08;
        this.friction = 0.88;
      }
      update() {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist < mouse.radius) {
          const force = (mouse.radius - dist) / mouse.radius;
          const angle = Math.atan2(dy, dx);
          this.vx -= Math.cos(angle) * force * 15;
          this.vy -= Math.sin(angle) * force * 15;
        }
        this.vx += (this.originX - this.x) * this.ease;
        this.vy += (this.originY - this.y) * this.ease;
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.x += this.vx;
        this.y += this.vy;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    function init() {
      particles = [];
      const off = document.createElement('canvas');
      off.width = 400;
      off.height = 400;
      const octx = off.getContext('2d');
      octx.fillStyle = '#00f0ff';
      octx.font = 'bold 110px sans-serif';
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillText('OMY', 200, 160);
      octx.fillStyle = '#ff007f';
      octx.fillText('WALL', 200, 260);

      const imgData = octx.getImageData(0, 0, 400, 400).data;
      const startX = (width - 400) / 2;
      const startY = (height - 400) / 2;
      const step = 4;
      for (let y = 0; y < 400; y += step) {
        for (let x = 0; x < 400; x += step) {
          const idx = (y * 400 + x) * 4;
          if (imgData[idx + 3] > 128) {
            const color = `rgb(${imgData[idx]}, ${imgData[idx+1]}, ${imgData[idx+2]})`;
            particles.push(new Particle(startX + x, startY + y, color));
          }
        }
      }
    }

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('touchmove', (e) => {
      if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    });
    window.addEventListener('resize', resize);
    resize();

    function render(t) {
      ctx.fillStyle = 'rgba(3, 7, 18, 0.25)';
      ctx.fillRect(0, 0, width, height);
      if (mouse.x === -9999) {
        mouse.x = width / 2 + Math.cos(t * 0.002) * 160;
        mouse.y = height / 2 + Math.sin(t * 0.003) * 120;
      }
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
