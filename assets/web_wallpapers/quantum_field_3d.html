<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Quantum Field Energy Grid</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #020208; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const rows = 35;
        const cols = 60;
        let time = 0;

        function animate() {
            time += 0.025;

            ctx.fillStyle = 'rgba(2, 2, 8, 0.3)';
            ctx.fillRect(0, 0, width, height);

            const cellW = width / (cols - 1);
            const cellH = height / (rows - 1);

            for (let r = 0; r < rows; r++) {
                ctx.beginPath();
                for (let c = 0; c < cols; c++) {
                    const x = c * cellW;
                    const baseY = r * cellH;

                    // 3D Quantum Wave Distortion
                    const wave1 = Math.sin(c * 0.15 + time * 1.5) * 20;
                    const wave2 = Math.cos(r * 0.2 + time * 2.0) * 25;
                    const wave3 = Math.sin((c + r) * 0.1 + time) * 15;

                    const y = baseY + wave1 + wave2 + wave3;

                    if (c === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }

                const hue = (r * 6 + time * 20) % 360;
                ctx.strokeStyle = `hsla(${hue}, 100%, 60%, 0.65)`;
                ctx.lineWidth = 1.6;
                ctx.stroke();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
