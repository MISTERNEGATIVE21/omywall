<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interdimensional Rick & Morty Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020a04; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020a04, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12);

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Swirling Portal Particle System
        const particleCount = 1800;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const angles = new Float32Array(particleCount);
        const radii = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * 6.5 + 0.5;

            angles[i] = angle;
            radii[i] = r;

            positions[i * 3] = Math.cos(angle) * r;
            positions[i * 3 + 1] = Math.sin(angle) * r;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 2.0;

            const isCenter = r < 2.0;
            colors[i * 3] = isCenter ? 0.8 : 0.0;     // Red
            colors[i * 3 + 1] = isCenter ? 1.0 : 0.95; // Green
            colors[i * 3 + 2] = isCenter ? 0.2 : 0.2;  // Blue
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.2,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending
        });

        const portalSystem = new THREE.Points(geometry, material);
        scene.add(portalSystem);

        // Core Glowing Energy Ring
        const ringGeo = new THREE.TorusGeometry(3.2, 0.4, 32, 100);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x00ff44,
            wireframe: true,
            transparent: true,
            opacity: 0.4
        });
        const portalRing = new THREE.Mesh(ringGeo, ringMat);
        scene.add(portalRing);

        // Mouse Tracking & Physics
        const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

        function onPointerMove(e) {
            const x = (e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2);
            const y = (e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2);

            mouse.targetX = (x / window.innerWidth - 0.5) * 8;
            mouse.targetY = -(y / window.innerHeight - 0.5) * 6;
        }

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('pointermove', onPointerMove);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            mouse.x += (mouse.targetX - mouse.x) * 0.08;
            mouse.y += (mouse.targetY - mouse.y) * 0.08;

            portalSystem.position.x = mouse.x;
            portalSystem.position.y = mouse.y;

            portalRing.position.x = mouse.x;
            portalRing.position.y = mouse.y;
            portalRing.rotation.z = time * 0.5;

            const pos = geometry.attributes.position.array;

            for (let i = 0; i < particleCount; i++) {
                angles[i] += (1.0 / (radii[i] + 0.5)) * 0.05;

                const r = radii[i] + Math.sin(time * 3.0 + i) * 0.15;
                pos[i * 3] = Math.cos(angles[i]) * r;
                pos[i * 3 + 1] = Math.sin(angles[i]) * r;
                pos[i * 3 + 2] = Math.sin(angles[i] * 4.0 + time) * 0.8;
            }

            geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
