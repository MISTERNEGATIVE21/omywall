<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio City Skyline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  .start {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font: 18px 'Segoe UI', sans-serif; cursor: pointer; z-index: 10;
    text-align: center; flex-direction: column; gap: 16px;
  }
  .start button {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 14px 32px; font-size: 18px; cursor: pointer;
    border-radius: 6px; transition: all 0.3s;
  }
  .start button:hover { background: rgba(255,255,255,0.2); }
  .start.hidden { display: none; }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Audio City Skyline</div>
<div class="start" id="start">
  <div>Click to enable audio-reactive wallpaper</div>
  <button id="startBtn">START</button>
</div>
<script>

let audioCtx, analyser, dataArray, started = false;
let mx = 0.5, my = 0.5;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });

function startAudio() {
  if (started) return;
  started = true;
  document.getElementById('start').classList.add('hidden');
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);

  // Master gain
  const master = audioCtx.createGain();
  master.gain.value = 0.15;
  master.connect(analyser);
  analyser.connect(audioCtx.destination);

  // Drum-ish kick on interval
  const bpm = 100;
  const beatMs = 60000 / bpm;
  let beat = 0;
  function kick(time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(140, time);
    osc.frequency.exponentialRampToValueAtTime(40, time + 0.15);
    gain.gain.setValueAtTime(1, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
    osc.connect(gain);
    gain.connect(master);
    osc.start(time);
    osc.stop(time + 0.3);
  }
  function hat(time) {
    const noise = audioCtx.createBufferSource();
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    noise.buffer = buf;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 6000;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.3, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    noise.connect(hp); hp.connect(gain); gain.connect(master);
    noise.start(time); noise.stop(time + 0.05);
  }
  function bass(time, freq) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.6, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
    osc.connect(filter); filter.connect(gain); gain.connect(master);
    osc.start(time); osc.stop(time + 0.35);
  }
  function lead(time, freq) {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = freq;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.2, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
    osc.connect(gain); gain.connect(master);
    osc.start(time); osc.stop(time + 0.4);
  }
  const bassNotes = [55, 73.42, 65.41, 82.41]; // A1, D2, C2, E2
  const leadNotes = [440, 587.33, 523.25, 659.25]; // A4, D5, C5, E5
  function scheduleBeat() {
    const time = audioCtx.currentTime;
    kick(time);
    if (beat % 2 === 1) hat(time + beatMs / 2 * 0.001 - 0.001);
    if (beat % 4 === 0) bass(time, bassNotes[(beat / 4) % bassNotes.length]);
    if (beat % 8 === 4) lead(time, leadNotes[(beat / 8) % leadNotes.length]);
    beat++;
  }
  setInterval(scheduleBeat, beatMs);
  loop();
}
document.getElementById('startBtn').addEventListener('click', startAudio);
document.addEventListener('keydown', e => { if (e.key === 'Enter') startAudio(); });

function loop() {
  if (!started) { requestAnimationFrame(loop); return; }
  analyser.getByteFrequencyData(dataArray);
  // night sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0a0220');
  g.addColorStop(0.7, '#1a0a3a');
  g.addColorStop(1, '#000005');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  // stars
  for (let i = 0; i < 60; i++) {
    const sx = (i * 137.5) % w;
    const sy = (i * 73.3) % (h * 0.5);
    ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(Date.now()*0.001 + i)*0.3})`;
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }
  // city silhouette with audio-reactive windows
  const buildings = 30;
  const bw = w / buildings;
  for (let i = 0; i < buildings; i++) {
    const bh = h * (0.2 + (Math.sin(i * 1.7) * 0.5 + 0.5) * 0.4);
    const bx = i * bw;
    const by = h - bh;
    ctx.fillStyle = '#050010';
    ctx.fillRect(bx, by, bw - 2, bh);
    // windows reactive to frequency
    const freqIdx = Math.floor((i / buildings) * dataArray.length);
    const v = dataArray[freqIdx] / 255;
    const cols = 3;
    const rows = Math.floor(bh / 18);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const seed = (i * 7 + r * 11 + c * 13) % 100;
        const lit = (seed / 100) < (0.3 + v * 0.6);
        if (lit) {
          const hue = 30 + v * 30;
          ctx.fillStyle = `hsla(${hue}, 90%, 65%, ${0.6 + v * 0.4})`;
          ctx.fillRect(bx + 4 + c * (bw - 8) / cols, by + 6 + r * 18, (bw - 12) / cols, 8);
        }
      }
    }
    // antenna light on tallest
    if (bh > h * 0.5) {
      ctx.fillStyle = `rgba(255, 0, 0, ${0.5 + Math.sin(Date.now()*0.005)*0.5})`;
      ctx.beginPath();
      ctx.arc(bx + bw/2, by - 4, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // audio waveform at top of city
  ctx.strokeStyle = 'rgba(0, 255, 200, 0.7)';
  ctx.shadowColor = '#00ffc8';
  ctx.shadowBlur = 10;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < dataArray.length; i++) {
    const x = (i / dataArray.length) * w;
    const v = dataArray[i] / 255;
    const y = h * 0.55 - v * 60;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
