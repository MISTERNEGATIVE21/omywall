<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Waveform</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  .start {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font: 18px 'Segoe UI', sans-serif; cursor: pointer; z-index: 10;
    text-align: center; flex-direction: column; gap: 16px;
  }
  .start button {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 14px 32px; font-size: 18px; cursor: pointer;
    border-radius: 6px; transition: all 0.3s;
  }
  .start button:hover { background: rgba(255,255,255,0.2); }
  .start.hidden { display: none; }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Audio Waveform</div>
<div class="start" id="start">
  <div>Click to enable audio-reactive wallpaper</div>
  <button id="startBtn">START</button>
</div>
<script>

let audioCtx, analyser, dataArray, started = false;
let mx = 0.5, my = 0.5;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });

function startAudio() {
  if (started) return;
  started = true;
  document.getElementById('start').classList.add('hidden');
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);

  // Master gain
  const master = audioCtx.createGain();
  master.gain.value = 0.15;
  master.connect(analyser);
  analyser.connect(audioCtx.destination);

  // Drum-ish kick on interval
  const bpm = 100;
  const beatMs = 60000 / bpm;
  let beat = 0;
  function kick(time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(140, time);
    osc.frequency.exponentialRampToValueAtTime(40, time + 0.15);
    gain.gain.setValueAtTime(1, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
    osc.connect(gain);
    gain.connect(master);
    osc.start(time);
    osc.stop(time + 0.3);
  }
  function hat(time) {
    const noise = audioCtx.createBufferSource();
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    noise.buffer = buf;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 6000;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.3, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    noise.connect(hp); hp.connect(gain); gain.connect(master);
    noise.start(time); noise.stop(time + 0.05);
  }
  function bass(time, freq) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.6, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
    osc.connect(filter); filter.connect(gain); gain.connect(master);
    osc.start(time); osc.stop(time + 0.35);
  }
  function lead(time, freq) {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = freq;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.2, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
    osc.connect(gain); gain.connect(master);
    osc.start(time); osc.stop(time + 0.4);
  }
  const bassNotes = [55, 73.42, 65.41, 82.41]; // A1, D2, C2, E2
  const leadNotes = [440, 587.33, 523.25, 659.25]; // A4, D5, C5, E5
  function scheduleBeat() {
    const time = audioCtx.currentTime;
    kick(time);
    if (beat % 2 === 1) hat(time + beatMs / 2 * 0.001 - 0.001);
    if (beat % 4 === 0) bass(time, bassNotes[(beat / 4) % bassNotes.length]);
    if (beat % 8 === 4) lead(time, leadNotes[(beat / 8) % leadNotes.length]);
    beat++;
  }
  setInterval(scheduleBeat, beatMs);
  loop();
}
document.getElementById('startBtn').addEventListener('click', startAudio);
document.addEventListener('keydown', e => { if (e.key === 'Enter') startAudio(); });

function loop() {
  if (!started) { requestAnimationFrame(loop); return; }
  analyser.getByteTimeDomainData(dataArray);
  // bg
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0a0218');
  g.addColorStop(1, '#180a2a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  // grid
  ctx.strokeStyle = 'rgba(255, 0, 200, 0.08)';
  ctx.lineWidth = 1;
  for (let y = 0; y < h; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  for (let x = 0; x < w; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  // waveform - multiple layers
  const layers = 5;
  for (let l = 0; l < layers; l++) {
    ctx.strokeStyle = `hsla(${280 + l * 15}, 100%, 60%, ${0.3 + l * 0.15})`;
    ctx.lineWidth = 2 + l;
    ctx.shadowColor = `hsl(${280 + l * 15}, 100%, 60%)`;
    ctx.shadowBlur = 10 + l * 5;
    ctx.beginPath();
    const offset = l * 4;
    for (let i = 0; i < dataArray.length; i++) {
      const x = (i / dataArray.length) * w;
      const v = (dataArray[i] - 128) / 128;
      const y = h/2 + v * (h * 0.3 - l * 10) + Math.sin(i * 0.05 + Date.now() * 0.001 + l) * offset;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
