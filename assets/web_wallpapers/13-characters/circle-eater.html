<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Circle Eater Maze</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Circle Eater Maze</div>
<script>

function pixel(ctx, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * size, y * size, size, size);
}
function pixelArt(ctx, ox, oy, size, art, palette) {
  for (let y = 0; y < art.length; y++) {
    for (let x = 0; x < art[y].length; x++) {
      const c = art[y][x];
      if (c !== ' ' && c !== '.' && palette[c]) {
        ctx.fillStyle = palette[c];
        ctx.fillRect(ox + x * size, oy + y * size, size, size);
      }
    }
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
// maze - 1=wall, 0=dot, 2=empty, 3=power pellet
const maze = [
  '1111111111111111111',
  '1000000001000000001',
  '1011110101010111101',
  '1300000000000000031',
  '1011010111110101101',
  '1000010000010000001',
  '1110111101011110111',
  '2220100000000010222',
  '1110101111011101011',
  '2000001000001000002',
  '1110101111011101011',
  '2220100000000010222',
  '1110111101011110111',
  '1000010000010000001',
  '1011010111110101101',
  '1300000000000000031',
  '1011110101010111101',
  '1000000001000000001',
  '1111111111111111111',
];
const cellColors = { '1': '#0a0a8a', '0': '#ffd700', '2': '#000', '3': '#ffd700' };
let dots = [];
function initDots() {
  dots = [];
  for (let y = 0; y < maze.length; y++) {
    for (let x = 0; x < maze[y].length; x++) {
      if (maze[y][x] === '0' || maze[y][x] === '3') {
        dots.push({ x, y, type: maze[y][x], eaten: false });
      }
    }
  }
}
initDots();
// eater (player)
let eater = { gx: 9, gy: 9, dir: { x: 1, y: 0 }, mouth: 0, moveTimer: 0 };
// ghosts
const ghostColors = ['#ff0066', '#ff8800', '#00ddff', '#ff66ee'];
const ghosts = [];
for (let i = 0; i < 4; i++) {
  ghosts.push({
    gx: 8 + i, gy: 9, dir: { x: 0, y: -1 },
    color: ghostColors[i], moveTimer: i * 5,
    scared: 0
  });
}
function moveEater() {
  // chase mouse direction
  const cellW = w / maze[0].length;
  const cellH = h / maze.length;
  const cx = eater.gx * cellW + cellW/2;
  const cy = eater.gy * cellH + cellH/2;
  const targetX = mx * w;
  const targetY = my * h;
  const dx = targetX - cx;
  const dy = targetY - cy;
  let newDir = eater.dir;
  if (Math.abs(dx) > Math.abs(dy)) {
    newDir = { x: Math.sign(dx), y: 0 };
  } else {
    newDir = { x: 0, y: Math.sign(dy) };
  }
  const nx = eater.gx + newDir.x;
  const ny = eater.gy + newDir.y;
  if (nx >= 0 && nx < maze[0].length && ny >= 0 && ny < maze.length && maze[ny][nx] !== '1') {
    eater.gx = nx; eater.gy = ny;
    eater.dir = newDir;
  } else {
    // try current dir
    const nx2 = eater.gx + eater.dir.x;
    const ny2 = eater.gy + eater.dir.y;
    if (nx2 >= 0 && nx2 < maze[0].length && ny2 >= 0 && ny2 < maze.length && maze[ny2][nx2] !== '1') {
      eater.gx = nx2; eater.gy = ny2;
    }
  }
  // wrap
  if (eater.gx < 0) eater.gx = maze[0].length - 1;
  if (eater.gx >= maze[0].length) eater.gx = 0;
  // eat dot
  for (const d of dots) {
    if (!d.eaten && d.x === eater.gx && d.y === eater.gy) {
      d.eaten = true;
      if (d.type === '3') {
        for (const g of ghosts) g.scared = 200;
      }
    }
  }
}
function moveGhost(g) {
  // simple AI - move randomly but bias toward eater
  const options = [];
  for (const d of [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]) {
    const nx = g.gx + d.x;
    const ny = g.gy + d.y;
    if (nx >= 0 && nx < maze[0].length && ny >= 0 && ny < maze.length && maze[ny][nx] !== '1') {
      options.push(d);
    }
  }
  if (options.length === 0) return;
  // 60% chance to chase, 40% random
  let chosen;
  if (Math.random() < 0.6 && g.scared === 0) {
    let best = options[0];
    let bestDist = Infinity;
    for (const d of options) {
      const nx = g.gx + d.x;
      const ny = g.gy + d.y;
      const dist = Math.abs(nx - eater.gx) + Math.abs(ny - eater.gy);
      if (dist < bestDist) { bestDist = dist; best = d; }
    }
    chosen = best;
  } else if (g.scared > 0) {
    // run away
    let best = options[0];
    let bestDist = -Infinity;
    for (const d of options) {
      const nx = g.gx + d.x;
      const ny = g.gy + d.y;
      const dist = Math.abs(nx - eater.gx) + Math.abs(ny - eater.gy);
      if (dist > bestDist) { bestDist = dist; best = d; }
    }
    chosen = best;
  } else {
    chosen = options[Math.floor(Math.random() * options.length)];
  }
  g.dir = chosen;
  g.gx += chosen.x;
  g.gy += chosen.y;
  if (g.gx < 0) g.gx = maze[0].length - 1;
  if (g.gx >= maze[0].length) g.gx = 0;
  // caught?
  if (g.gx === eater.gx && g.gy === eater.gy) {
    if (g.scared > 0) {
      g.gx = 9; g.gy = 9;  // reset
      g.scared = 0;
    } else {
      // reset eater
      eater.gx = 9; eater.gy = 9;
    }
  }
}
function loop() {
  t += 0.05;
  // bg
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  const cellW = w / maze[0].length;
  const cellH = h / maze.length;
  const cellSize = Math.min(cellW, cellH);
  const offsetX = (w - cellSize * maze[0].length) / 2;
  const offsetY = (h - cellSize * maze.length) / 2;
  // walls
  ctx.strokeStyle = '#0a0aff';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#0a0aff';
  ctx.shadowBlur = 8;
  for (let y = 0; y < maze.length; y++) {
    for (let x = 0; x < maze[y].length; x++) {
      if (maze[y][x] === '1') {
        ctx.fillStyle = '#000010';
        ctx.fillRect(offsetX + x * cellSize, offsetY + y * cellSize, cellSize, cellSize);
        ctx.strokeRect(offsetX + x * cellSize + 1, offsetY + y * cellSize + 1, cellSize - 2, cellSize - 2);
      }
    }
  }
  ctx.shadowBlur = 0;
  // dots
  for (const d of dots) {
    if (d.eaten) continue;
    const dx = offsetX + d.x * cellSize + cellSize/2;
    const dy = offsetY + d.y * cellSize + cellSize/2;
    if (d.type === '3') {
      const r = cellSize * 0.3 * (1 + Math.sin(t * 4) * 0.2);
      ctx.fillStyle = '#ffd700';
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(dx, dy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(dx, dy, cellSize * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // eater
  eater.moveTimer++;
  if (eater.moveTimer > 12) {
    moveEater();
    eater.moveTimer = 0;
  }
  eater.mouth += 0.2;
  const ex = offsetX + eater.gx * cellSize + cellSize/2;
  const ey = offsetY + eater.gy * cellSize + cellSize/2;
  const mouthAngle = Math.abs(Math.sin(eater.mouth)) * 0.4;
  const baseAngle = Math.atan2(eater.dir.y, eater.dir.x);
  ctx.fillStyle = '#ffff00';
  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.arc(ex, ey, cellSize * 0.45, baseAngle + mouthAngle, baseAngle - mouthAngle + Math.PI * 2);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  // eye
  ctx.fillStyle = '#000';
  const eyeX = ex + Math.cos(baseAngle - Math.PI/2) * cellSize * 0.2;
  const eyeY = ey + Math.sin(baseAngle - Math.PI/2) * cellSize * 0.2;
  ctx.beginPath();
  ctx.arc(eyeX, eyeY, cellSize * 0.06, 0, Math.PI * 2);
  ctx.fill();
  // ghosts
  for (const g of ghosts) {
    g.moveTimer++;
    if (g.moveTimer > 14) {
      moveGhost(g);
      g.moveTimer = 0;
    }
    if (g.scared > 0) g.scared--;
    const gx_ = offsetX + g.gx * cellSize + cellSize/2;
    const gy_ = offsetY + g.gy * cellSize + cellSize/2;
    const gr = cellSize * 0.4;
    const color = g.scared > 0 ? (g.scared < 50 && Math.floor(t * 8) % 2 ? '#fff' : '#3a3aff') : g.color;
    ctx.fillStyle = color;
    // body
    ctx.beginPath();
    ctx.arc(gx_, gy_ - gr * 0.2, gr, Math.PI, 0);
    ctx.lineTo(gx_ + gr, gy_ + gr * 0.7);
    // wavy bottom
    const waves = 4;
    for (let i = 0; i < waves; i++) {
      const x1 = gx_ + gr - (i + 0.5) * (gr * 2 / waves);
      const x2 = gx_ + gr - (i + 1) * (gr * 2 / waves);
      ctx.lineTo(x1, gy_ + gr * 0.5);
      ctx.lineTo(x2, gy_ + gr * 0.7);
    }
    ctx.closePath();
    ctx.fill();
    // eyes
    if (g.scared > 0) {
      // scared face
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(gx_ - gr * 0.3, gy_ - gr * 0.2, gr * 0.15, 0, Math.PI * 2);
      ctx.arc(gx_ + gr * 0.3, gy_ - gr * 0.2, gr * 0.15, 0, Math.PI * 2);
      ctx.fill();
      // mouth (zigzag)
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(gx_ - gr * 0.5, gy_ + gr * 0.2);
      for (let i = 0; i < 5; i++) {
        ctx.lineTo(gx_ - gr * 0.5 + i * gr * 0.25, gy_ + gr * 0.2 + (i % 2 ? gr * 0.15 : 0));
      }
      ctx.stroke();
    } else {
      // eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(gx_ - gr * 0.3, gy_ - gr * 0.2, gr * 0.2, gr * 0.25, 0, 0, Math.PI * 2);
      ctx.ellipse(gx_ + gr * 0.3, gy_ - gr * 0.2, gr * 0.2, gr * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
      // pupils (look at eater)
      const dx_ = eater.gx - g.gx;
      const dy_ = eater.gy - g.gy;
      const dl = Math.sqrt(dx_*dx_ + dy_*dy_) || 1;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(gx_ - gr * 0.3 + dx_/dl * gr * 0.08, gy_ - gr * 0.2 + dy_/dl * gr * 0.08, gr * 0.1, 0, Math.PI * 2);
      ctx.arc(gx_ + gr * 0.3 + dx_/dl * gr * 0.08, gy_ - gr * 0.2 + dy_/dl * gr * 0.08, gr * 0.1, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // score
  let eaten = dots.filter(d => d.eaten).length;
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('SCORE: ' + (eaten * 10), 20, 20);
  ctx.fillText('DOTS: ' + (dots.length - eaten) + '/' + dots.length, 20, 42);
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
