<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yellow Sponge Underwater</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Yellow Sponge Underwater</div>
<script>

function pixel(ctx, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * size, y * size, size, size);
}
function pixelArt(ctx, ox, oy, size, art, palette) {
  for (let y = 0; y < art.length; y++) {
    for (let x = 0; x < art[y].length; x++) {
      const c = art[y][x];
      if (c !== ' ' && c !== '.' && palette[c]) {
        ctx.fillStyle = palette[c];
        ctx.fillRect(ox + x * size, oy + y * size, size, size);
      }
    }
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
let bubbles = [], jellyfish = [];
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
// sponge character pixel art (16x18)
const spongeArt = [
  '....YYYYYYYY....',
  '..YYYYYYYYYYYY..',
  '.YYYYYYYYYYYYYY.',
  '.YYKYYYYYYKYYYY.',
  '.YYWYYYYYYWYYYY.',
  '.YYYYYYYYYYYYYY.',
  '.YYYKYYYYKYYYYY.',
  '.YYYYYBBYYYYYYY.',
  '.YYYYBBBYYYYYYY.',
  '.YYYYYBBYYYYYYY.',
  '.YYYYYYYYYYYYYY.',
  '.YYYWWWWWWWWYYY.',
  '.YYWWWWWWWWWWYY.',
  '.YYWWCCCCCCWWYY.',
  '.YYWWCCCCCCWWYY.',
  '.YYWWWWWWWWWWYY.',
  '..TTTT....TTTT..',
  '..SSSS....SSSS..',
];
const pal = {
  Y: '#ffe03a',  // yellow sponge
  K: '#3a8aff',  // blue eyes
  W: '#fff',     // eye whites
  B: '#ff5500',  // mouth
  C: '#ffffff',  // shirt collar
  T: '#ffffff',  // pants white
  S: '#5a3a1a',  // shoes
};
for (let i = 0; i < 80; i++) {
  bubbles.push({
    x: Math.random() * w,
    y: Math.random() * h,
    r: 2 + Math.random() * 8,
    vy: -(0.3 + Math.random() * 1.5),
    wobble: Math.random() * Math.PI * 2
  });
}
for (let i = 0; i < 6; i++) {
  jellyfish.push({
    x: Math.random() * w,
    y: Math.random() * h * 0.5,
    vx: (Math.random() - 0.5) * 0.5,
    vy: 0,
    phase: Math.random() * Math.PI * 2,
    hue: 280 + Math.random() * 80,
    size: 30 + Math.random() * 30
  });
}
function loop() {
  t += 0.05;
  // underwater bg
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#4a90c8');
  bg.addColorStop(0.5, '#2a6a98');
  bg.addColorStop(1, '#1a4870');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  // light rays
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 5; i++) {
    const sx = w * (0.1 + i * 0.2) + Math.sin(t * 0.3 + i) * 20;
    ctx.beginPath();
    ctx.moveTo(sx - 20, 0);
    ctx.lineTo(sx + 20, 0);
    ctx.lineTo(sx + 60, h);
    ctx.lineTo(sx + 20, h);
    ctx.closePath();
    const lg = ctx.createLinearGradient(0, 0, 0, h);
    lg.addColorStop(0, 'rgba(200, 230, 255, 0.15)');
    lg.addColorStop(1, 'rgba(200, 230, 255, 0)');
    ctx.fillStyle = lg;
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  // sandy floor
  ctx.fillStyle = '#e8c878';
  ctx.fillRect(0, h - 60, w, 60);
  ctx.fillStyle = '#d0a858';
  for (let i = 0; i < 40; i++) {
    const dx = (i * 30 + Math.sin(i) * 10) % w;
    ctx.fillRect(dx, h - 60 + (i % 3) * 5, 4, 4);
  }
  // pineapple house (background right)
  const phX = w * 0.75;
  const phY = h - 60;
  const phW = 120;
  const phH = 180;
  // pineapple body
  ctx.fillStyle = '#ffaa30';
  ctx.beginPath();
  ctx.ellipse(phX, phY - phH/2, phW/2, phH/2, 0, 0, Math.PI * 2);
  ctx.fill();
  // texture
  ctx.fillStyle = '#cc7010';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 6; c++) {
      const tx = phX - phW/2 + 15 + c * 18;
      const ty = phY - phH + 20 + r * 20;
      if (Math.sqrt((tx - phX)**2 + (ty - (phY - phH/2))**2) < phW/2 - 10) {
        ctx.beginPath();
        ctx.arc(tx, ty, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  // windows
  ctx.fillStyle = '#88ccff';
  ctx.beginPath();
  ctx.arc(phX - 25, phY - phH * 0.6, 12, 0, Math.PI * 2);
  ctx.arc(phX + 25, phY - phH * 0.6, 12, 0, Math.PI * 2);
  ctx.fill();
  // door
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(phX - 15, phY - 50, 30, 50);
  ctx.fillStyle = '#3a2a1a';
  ctx.beginPath();
  ctx.arc(phX, phY - 50, 15, Math.PI, 0);
  ctx.fill();
  // leaves on top
  ctx.fillStyle = '#2a8a2a';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(phX + i * 15, phY - phH);
    ctx.lineTo(phX + i * 15 - 10, phY - phH - 40);
    ctx.lineTo(phX + i * 15 + 10, phY - phH - 40);
    ctx.closePath();
    ctx.fill();
  }
  // jellyfish
  for (const j of jellyfish) {
    j.x += j.vx + (mx - 0.5) * 0.3;
    j.phase += 0.05;
    j.y += Math.sin(j.phase) * 0.5;
    if (j.x < -50) j.x = w + 50;
    if (j.x > w + 50) j.x = -50;
    // bell
    const grad = ctx.createRadialGradient(j.x, j.y, 0, j.x, j.y, j.size);
    grad.addColorStop(0, `hsla(${j.hue}, 80%, 70%, 0.7)`);
    grad.addColorStop(1, `hsla(${j.hue}, 80%, 50%, 0.1)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(j.x, j.y, j.size, Math.PI, 0);
    ctx.fill();
    // tentacles
    ctx.strokeStyle = `hsla(${j.hue}, 80%, 70%, 0.6)`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const tx = j.x - j.size + (i / 7) * j.size * 2;
      ctx.beginPath();
      ctx.moveTo(tx, j.y);
      for (let s = 1; s <= 5; s++) {
        ctx.lineTo(tx + Math.sin(t * 2 + i + s) * 5, j.y + s * 8);
      }
      ctx.stroke();
    }
  }
  // bubbles
  for (const b of bubbles) {
    b.wobble += 0.05;
    b.x += Math.sin(b.wobble) * 0.5;
    b.y += b.vy;
    if (b.y < -20) { b.y = h + 20; b.x = Math.random() * w; }
    ctx.strokeStyle = 'rgba(200, 230, 255, 0.6)';
    ctx.fillStyle = 'rgba(200, 230, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }
  // sponge character
  const ps = Math.floor(Math.min(w, h) / 30);
  const cx = w * 0.25 + (mx - 0.5) * 80;
  const cy = h - 60 - ps * 18 + Math.sin(t * 3) * 8;
  pixelArt(ctx, cx, cy, ps, spongeArt, pal);
  // sponge holes (details)
  ctx.fillStyle = '#d4a800';
  for (let i = 0; i < 8; i++) {
    const hx = cx + ps * (2 + (i % 4) * 3);
    const hy = cy + ps * (3 + Math.floor(i / 4) * 4);
    ctx.beginPath();
    ctx.arc(hx, hy, ps * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
