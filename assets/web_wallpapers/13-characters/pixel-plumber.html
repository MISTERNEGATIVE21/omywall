<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Plumber Adventure</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Pixel Plumber Adventure</div>
<script>

function pixel(ctx, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * size, y * size, size, size);
}
function pixelArt(ctx, ox, oy, size, art, palette) {
  for (let y = 0; y < art.length; y++) {
    for (let x = 0; x < art[y].length; x++) {
      const c = art[y][x];
      if (c !== ' ' && c !== '.' && palette[c]) {
        ctx.fillStyle = palette[c];
        ctx.fillRect(ox + x * size, oy + y * size, size, size);
      }
    }
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0, scrollX = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
// plumber pixel art (16x16)
const plumberArt = [
  '....RRRRRR......',
  '...RRRRRRRR.....',
  '..SSSKKSKK......',
  '..SSSKSSKS......',
  '..SSKKKKSKS.....',
  '..SSSKKSKKS.....',
  '...SSKKKKS......',
  '....BBRBB.......',
  '...RRBRRBRR.....',
  '..RRRBRRBRRR....',
  '..RRRRRRRRRR....',
  '..RR.RRRR.RR....',
  '....BB..BB......',
  '...BBB..BBB.....',
  '..YYY....YYY....',
  '..YYY....YYY....',
];
const plumberPal = {
  R: '#e52521',  // red hat/shirt
  S: '#ffcc99',  // skin
  K: '#3a1c00',  // hair/mustache brown
  B: '#3a7bd5',  // blue overalls
  Y: '#5a3a1a',  // brown shoes
};
const plumberJumpArt = [
  '....RRRRRR......',
  '...RRRRRRRR.....',
  '..SSSKKSKK......',
  '..SSSKSSKS......',
  '..SSKKKKSKS.....',
  '..SSSKKSKKS.....',
  '...SSKKKKS......',
  '....BBRBB....YYY',
  '...RRBRRBRR.YYY.',
  '..RRRBRRBRRRY...',
  '..RRRRRRRRRR....',
  '..RR.RRRR.RR....',
  '....BB..BB......',
  '...BBB..BBB.....',
  '...YY....YY.....',
  '...YY....YY.....',
];
// clouds, hills, blocks
const clouds = [];
for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * 2000, y: 50 + Math.random() * 100, scale: 1 + Math.random() });
const hills = [];
for (let i = 0; i < 8; i++) hills.push({ x: i * 400, h: 80 + Math.random() * 60 });
const blocks = [];
for (let i = 0; i < 30; i++) {
  if (Math.random() < 0.3) {
    blocks.push({ x: 200 + i * 200 + Math.random() * 100, y: h - 200 - Math.random() * 100, type: Math.random() < 0.7 ? 'brick' : 'question' });
  }
}
// coins
const coins = [];
for (let i = 0; i < 20; i++) coins.push({ x: 300 + i * 300, y: h - 250, phase: Math.random() * Math.PI * 2 });
let plumberX = 0, plumberY = 0, plumberVY = 0, jumping = false, jumpTimer = 0;
function loop() {
  t += 0.05;
  scrollX += 2 + (mx - 0.5) * 2;
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#5c94fc');
  sky.addColorStop(1, '#9bc4ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  // clouds
  ctx.fillStyle = '#fff';
  for (const c of clouds) {
    const cx = ((c.x - scrollX * 0.3) % (w + 200) + w + 200) % (w + 200) - 100;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(cx + i * 25 * c.scale, c.y, 18 * c.scale, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // hills
  ctx.fillStyle = '#00a800';
  for (const hill of hills) {
    const hx = ((hill.x - scrollX * 0.5) % (w + 800) + w + 800) % (w + 800) - 400;
    ctx.beginPath();
    ctx.arc(hx, h - 80, hill.h, Math.PI, 0);
    ctx.fill();
  }
  // ground
  ctx.fillStyle = '#d09030';
  ctx.fillRect(0, h - 80, w, 80);
  ctx.fillStyle = '#e8a040';
  ctx.fillRect(0, h - 80, w, 16);
  // ground pattern
  ctx.fillStyle = '#a07020';
  for (let x = -((scrollX) % 64); x < w; x += 64) {
    ctx.fillRect(x, h - 64, 32, 16);
    ctx.fillRect(x + 16, h - 48, 32, 16);
    ctx.fillRect(x, h - 32, 32, 16);
  }
  // blocks
  for (const b of blocks) {
    const bx = ((b.x - scrollX) % (w * 3) + w * 3) % (w * 3) - 100;
    if (bx > -50 && bx < w + 50) {
      if (b.type === 'brick') {
        ctx.fillStyle = '#c87020';
        ctx.fillRect(bx, b.y, 40, 40);
        ctx.fillStyle = '#a05010';
        ctx.fillRect(bx, b.y, 40, 4);
        ctx.fillRect(bx, b.y + 20, 40, 4);
        ctx.fillRect(bx + 18, b.y, 4, 20);
        ctx.fillRect(bx + 8, b.y + 20, 4, 20);
      } else {
        ctx.fillStyle = '#fbc02d';
        ctx.fillRect(bx, b.y, 40, 40);
        ctx.strokeStyle = '#a07000';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx + 2, b.y + 2, 36, 36);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', bx + 20, b.y + 22);
      }
    }
  }
  // coins
  for (const c of coins) {
    c.phase += 0.1;
    const cx = ((c.x - scrollX) % (w * 4) + w * 4) % (w * 4) - 100;
    if (cx > -30 && cx < w + 30) {
      const stretch = Math.abs(Math.sin(c.phase));
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.ellipse(cx, c.y, 12 * stretch + 2, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.ellipse(cx, c.y, 6 * stretch + 1, 10, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // plumber - bouncing along
  jumpTimer++;
  const jumpCycle = 60;
  const jumpPhase = (jumpTimer % jumpCycle) / jumpCycle;
  plumberY = Math.sin(jumpPhase * Math.PI) * -60;
  const px = w * 0.3;
  const py = h - 80 - 64 + plumberY;
  const ps = Math.floor(Math.min(w, h) / 40);
  const art = plumberY < -10 ? plumberJumpArt : plumberArt;
  pixelArt(ctx, px, py, ps, art, plumberPal);
  // score
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('COINS x ' + Math.floor(scrollX / 100), 20, 20);
  ctx.fillText('WORLD 1-1', 20, 50);
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
