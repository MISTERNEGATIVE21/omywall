<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Astronaut in Space</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Astronaut in Space</div>
<script>

function pixel(ctx, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * size, y * size, size, size);
}
function pixelArt(ctx, ox, oy, size, art, palette) {
  for (let y = 0; y < art.length; y++) {
    for (let x = 0; x < art[y].length; x++) {
      const c = art[y][x];
      if (c !== ' ' && c !== '.' && palette[c]) {
        ctx.fillStyle = palette[c];
        ctx.fillRect(ox + x * size, oy + y * size, size, size);
      }
    }
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
let stars = [], planets = [], debris = [];
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; initStars(); }
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function initStars() {
  stars = [];
  for (let i = 0; i < 400; i++) {
    stars.push({
      x: Math.random() * w, y: Math.random() * h,
      s: Math.random() * 1.5,
      t: Math.random() * Math.PI * 2,
      vx: (Math.random() - 0.5) * 0.05,
      vy: (Math.random() - 0.5) * 0.05
    });
  }
}
resize();
// astronaut pixel art (16x24)
const astronautArt = [
  '......WWWW......',
  '.....WWWWWW.....',
  '....WWAAAAWW....',
  '....WAAAAAAW....',
  '....WAAAAAAW....',
  '...WWAAAAAAWW...',
  '..WWWAAAAAAWWW..',
  '..WWAAAAAAAAWW..',
  '..WWAAAAAAAAWW..',
  '..WWAAAAAAAAWW..',
  '..WWWAAAAAAWWW..',
  '...WWAAAAAAWW...',
  '....WAAAAAAW....',
  '....WAAAAAAW....',
  '....WAAAAAAW....',
  '....WWAAAAWW....',
  '....WWWAAWWW....',
  '....WWWWWWWW....',
  '....WWWWWWWW....',
  '...WWW.WW.WWW...',
  '..WWW..WW..WWW..',
  '..WW...WW...WW..',
  '..W....WW....W..',
  '.......WW.......',
];
const pal = {
  W: '#ffffff',  // white suit
  A: '#a8a8b8',  // gray shadow
};
planets = [
  { x: w * 0.2, y: h * 0.3, r: 80, color: '#ff6b35', ring: false, name: 'MARS' },
  { x: w * 0.85, y: h * 0.7, r: 120, color: '#4a90e2', ring: true, name: 'NEPTUNE' },
  { x: w * 0.6, y: h * 0.15, r: 50, color: '#ffd700', ring: false, name: 'SUN' }
];
for (let i = 0; i < 15; i++) {
  debris.push({
    x: Math.random() * w,
    y: Math.random() * h,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.02,
    size: 2 + Math.random() * 4
  });
}
function loop() {
  t += 0.02;
  // space bg
  const bg = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w, h));
  bg.addColorStop(0, '#0a0a2a');
  bg.addColorStop(0.5, '#050518');
  bg.addColorStop(1, '#000005');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  // stars
  for (const s of stars) {
    s.t += 0.04;
    s.x += s.vx; s.y += s.vy;
    if (s.x < 0) s.x = w; if (s.x > w) s.x = 0;
    if (s.y < 0) s.y = h; if (s.y > h) s.y = 0;
    const tw = (Math.sin(s.t) + 1) / 2;
    ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + tw * 0.5})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  // planets
  for (const p of planets) {
    // glow
    const pg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 1.5);
    pg.addColorStop(0, p.color + 'aa');
    pg.addColorStop(0.5, p.color + '40');
    pg.addColorStop(1, p.color + '00');
    ctx.fillStyle = pg;
    ctx.fillRect(p.x - p.r * 1.5, p.y - p.r * 1.5, p.r * 3, p.r * 3);
    // body
    const bg2 = ctx.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, 0, p.x, p.y, p.r);
    bg2.addColorStop(0, p.color);
    bg2.addColorStop(1, '#000');
    ctx.fillStyle = bg2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    // ring
    if (p.ring) {
      ctx.strokeStyle = p.color + 'aa';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r * 1.6, p.r * 0.4, 0.3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = p.color + '60';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r * 1.8, p.r * 0.5, 0.3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  // debris
  for (const d of debris) {
    d.x += d.vx; d.y += d.vy;
    d.rot += d.vr;
    if (d.x < 0) d.x = w; if (d.x > w) d.x = 0;
    if (d.y < 0) d.y = h; if (d.y > h) d.y = 0;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.fillStyle = '#888';
    ctx.fillRect(-d.size/2, -d.size/2, d.size, d.size);
    ctx.restore();
  }
  // astronaut - floating
  const ps = Math.floor(Math.min(w, h) / 35);
  const floatX = w/2 + Math.sin(t * 0.5) * 50 + (mx - 0.5) * 100;
  const floatY = h/2 + Math.cos(t * 0.3) * 30 + (my - 0.5) * 80;
  const rot = Math.sin(t * 0.3) * 0.2 + (mx - 0.5) * 0.5;
  ctx.save();
  ctx.translate(floatX, floatY);
  ctx.rotate(rot);
  pixelArt(ctx, -ps * 8, -ps * 12, ps, astronautArt, pal);
  // visor reflection
  ctx.fillStyle = 'rgba(100, 200, 255, 0.5)';
  ctx.beginPath();
  ctx.arc(ps * 2, -ps * 7, ps * 1.5, 0, Math.PI * 2);
  ctx.fill();
  // earth reflection in visor
  ctx.fillStyle = 'rgba(50, 150, 255, 0.7)';
  ctx.beginPath();
  ctx.arc(ps * 4, -ps * 8, ps * 1, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // tether
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(floatX, floatY);
  const tetherEndX = w * 0.1;
  const tetherEndY = h * 0.9;
  for (let i = 1; i <= 10; i++) {
    const tt = i / 10;
    const tx = floatX + (tetherEndX - floatX) * tt + Math.sin(t + i) * 5;
    const ty = floatY + (tetherEndY - floatY) * tt + Math.cos(t + i) * 5;
    ctx.lineTo(tx, ty);
  }
  ctx.stroke();
  // small jetpack flame
  if (Math.sin(t * 2) > 0) {
    ctx.fillStyle = 'rgba(255, 150, 0, 0.7)';
    ctx.beginPath();
    ctx.ellipse(floatX - Math.sin(rot) * ps * 12, floatY + Math.cos(rot) * ps * 12, ps * 1, ps * 2, rot, 0, Math.PI * 2);
    ctx.fill();
  }
  // HUD
  ctx.fillStyle = '#00ff00';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('OXYGEN: 98%', 20, 20);
  ctx.fillText('SPEED: 0.5 m/s', 20, 40);
  ctx.fillText('ALT: ' + Math.floor(t * 100) + ' km', 20, 60);
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
