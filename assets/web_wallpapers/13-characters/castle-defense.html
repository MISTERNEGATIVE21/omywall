<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Castle Defense (click!)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Castle Defense (click!)</div>
<script>

function pixel(ctx, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * size, y * size, size, size);
}
function pixelArt(ctx, ox, oy, size, art, palette) {
  for (let y = 0; y < art.length; y++) {
    for (let x = 0; x < art[y].length; x++) {
      const c = art[y][x];
      if (c !== ' ' && c !== '.' && palette[c]) {
        ctx.fillStyle = palette[c];
        ctx.fillRect(ox + x * size, oy + y * size, size, size);
      }
    }
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0, scrollX = 0;
let mx = 0.5, my = 0.5;
let fireballs = [], coins = [];
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
window.addEventListener('click', e => {
  fireballs.push({
    x: w * 0.2, y: h * 0.7,
    vx: (e.clientX - w * 0.2) * 0.02,
    vy: -8,
    life: 1
  });
});
// hero pixel art (16x16)
const heroArt = [
  '....GGGGGG......',
  '...GGGGGGGG.....',
  '..SSSKSSKSS.....',
  '..SSSKSSKSS.....',
  '..SSKKKKKSS.....',
  '...SSKKKSS......',
  '....GGGGGG......',
  '...RGGGGGGR.....',
  '..RRGGGGGGRR....',
  '..RRRGGGGRRR....',
  '..RRRRRRRRRR....',
  '..RR.RRRR.RR....',
  '....BB..BB......',
  '...BBB..BBB.....',
  '..YYY....YYY....',
  '..YYY....YYY....',
];
const pal = {
  G: '#22aa22',  // green hat/shirt (luigi-style)
  S: '#ffcc99',  // skin
  K: '#3a1c00',  // hair/mustache
  R: '#2244aa',  // blue overalls
  B: '#2244aa',
  Y: '#5a3a1a',  // shoes
};
const heroArt2 = heroArt.map((r, i) => {
  if (i === 14) return '..YYY....YYY....';
  if (i === 15) return '.YYY......YYY...';
  return r;
});
// castle background
function drawCastle(x, y, scale) {
  ctx.fillStyle = '#888';
  // main body
  ctx.fillRect(x, y - 150 * scale, 200 * scale, 150 * scale);
  // towers
  ctx.fillRect(x - 20 * scale, y - 200 * scale, 50 * scale, 200 * scale);
  ctx.fillRect(x + 170 * scale, y - 200 * scale, 50 * scale, 200 * scale);
  // battlements
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(x + i * 35 * scale, y - 165 * scale, 15 * scale, 15 * scale);
  }
  // door
  ctx.fillStyle = '#3a1c00';
  ctx.beginPath();
  ctx.moveTo(x + 80 * scale, y);
  ctx.lineTo(x + 80 * scale, y - 60 * scale);
  ctx.arc(x + 100 * scale, y - 60 * scale, 20 * scale, Math.PI, 0);
  ctx.lineTo(x + 120 * scale, y);
  ctx.fill();
  // windows
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 30 * scale, y - 100 * scale, 15 * scale, 25 * scale);
  ctx.fillRect(x + 155 * scale, y - 100 * scale, 15 * scale, 25 * scale);
  // flag
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(x + 95 * scale, y - 240 * scale, 10 * scale, 40 * scale);
  ctx.beginPath();
  ctx.moveTo(x + 105 * scale, y - 240 * scale);
  ctx.lineTo(x + 140 * scale, y - 230 * scale);
  ctx.lineTo(x + 105 * scale, y - 220 * scale);
  ctx.fill();
}
const clouds = [];
for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * 3000, y: 50 + Math.random() * 80, scale: 0.8 + Math.random() * 0.6 });
const hills = [];
for (let i = 0; i < 8; i++) hills.push({ x: i * 400, h: 100 + Math.random() * 60 });
function loop() {
  t += 0.05;
  scrollX += 0.5 + (mx - 0.5) * 2;
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#5c94fc');
  sky.addColorStop(1, '#9bc4ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  // clouds
  ctx.fillStyle = '#fff';
  for (const c of clouds) {
    const cx = ((c.x - scrollX * 0.2) % (w + 200) + w + 200) % (w + 200) - 100;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(cx + i * 25 * c.scale, c.y, 18 * c.scale, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // hills
  ctx.fillStyle = '#00a800';
  for (const hill of hills) {
    const hx = ((hill.x - scrollX * 0.4) % (w + 800) + w + 800) % (w + 800) - 400;
    ctx.beginPath();
    ctx.arc(hx, h - 80, hill.h, Math.PI, 0);
    ctx.fill();
  }
  // castle
  drawCastle(w * 0.6, h - 80, 1);
  // ground
  ctx.fillStyle = '#c87020';
  ctx.fillRect(0, h - 80, w, 80);
  ctx.fillStyle = '#e8a040';
  ctx.fillRect(0, h - 80, w, 12);
  ctx.fillStyle = '#a05010';
  for (let x = -((scrollX) % 64); x < w; x += 64) {
    ctx.fillRect(x, h - 60, 32, 16);
    ctx.fillRect(x + 16, h - 44, 32, 16);
  }
  // bushes
  ctx.fillStyle = '#008800';
  for (let i = 0; i < 10; i++) {
    const bx = ((i * 300 - scrollX * 0.7) % (w + 300) + w + 300) % (w + 300) - 150;
    ctx.beginPath();
    ctx.arc(bx, h - 80, 20, Math.PI, 0);
    ctx.arc(bx + 20, h - 80, 25, Math.PI, 0);
    ctx.arc(bx + 40, h - 80, 20, Math.PI, 0);
    ctx.fill();
  }
  // coins
  for (let i = 0; i < 15; i++) {
    const cx = ((i * 250 + 100 - scrollX) % (w + 200) + w + 200) % (w + 200) - 100;
    const cy = h - 200 + Math.sin(t * 3 + i) * 10;
    if (cx > -30 && cx < w + 30) {
      const stretch = Math.abs(Math.sin(t * 4 + i));
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 10 * stretch + 1, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 5 * stretch, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // fireballs
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const f = fireballs[i];
    f.x += f.vx;
    f.y += f.vy;
    f.vy += 0.4;
    f.life -= 0.01;
    if (f.life <= 0 || f.y > h) { fireballs.splice(i, 1); continue; }
    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 15);
    grad.addColorStop(0, 'rgba(255, 255, 100, 1)');
    grad.addColorStop(0.5, 'rgba(255, 150, 0, 0.7)');
    grad.addColorStop(1, 'rgba(255, 50, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(f.x - 15, f.y - 15, 30, 30);
    // trail
    ctx.fillStyle = 'rgba(255, 100, 0, 0.5)';
    ctx.beginPath();
    ctx.arc(f.x - f.vx * 2, f.y - f.vy * 2, 6, 0, Math.PI * 2);
    ctx.fill();
  }
  // hero
  const ps = Math.floor(Math.min(w, h) / 35);
  const px = w * 0.2;
  const py = h - 80 - ps * 16 + Math.abs(Math.sin(t * 4)) * 5;
  const art = Math.floor(t * 4) % 2 === 0 ? heroArt : heroArt2;
  pixelArt(ctx, px, py, ps, art, pal);
  // HUD
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.strokeText('WORLD 1-1', 20, 20);
  ctx.fillText('WORLD 1-1', 20, 20);
  ctx.strokeText('COINS: ' + Math.floor(scrollX / 100), 20, 48);
  ctx.fillText('COINS: ' + Math.floor(scrollX / 100), 20, 48);
  ctx.strokeText('CLICK to throw fireball!', 20, 76);
  ctx.fillText('CLICK to throw fireball!', 20, 76);
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
