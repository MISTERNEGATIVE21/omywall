<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lazy Cat (pet me!)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Lazy Cat (pet me!)</div>
<script>

function pixel(ctx, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * size, y * size, size, size);
}
function pixelArt(ctx, ox, oy, size, art, palette) {
  for (let y = 0; y < art.length; y++) {
    for (let x = 0; x < art[y].length; x++) {
      const c = art[y][x];
      if (c !== ' ' && c !== '.' && palette[c]) {
        ctx.fillStyle = palette[c];
        ctx.fillRect(ox + x * size, oy + y * size, size, size);
      }
    }
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
let zzz = [], fishBones = [];
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
// cat pixel art (24x16) - sleeping curled
const catArt = [
  '..........OOOO..........',
  '.........OOOOOO.........',
  '........OOOBBBOO........',
  '........OBOOOBOO........',
  '.......OOOOOOOOOO.......',
  '......OOOOOOOOOOOO......',
  '.....OOOOOOOOOOOOOO.....',
  '....OOOOOOOYYOOOOOO.....',
  '...OOOOOOOOYYOOOOOOO....',
  '..OOOOOOOOOOYYOOOOOOO...',
  '..OOOOOOOOOOOOOOOOOOO...',
  '..OOOOOOOOOOOOOOOOOOO...',
  '...OOOOOOOOOOOOOOOOOO...',
  '....OOOOOOOOOOOOOOOO....',
  '.....OOOOOOOOOOOOOO.....',
  '......OOOOOOOOOOOO......',
];
const pal = {
  O: '#ff8c42',  // orange fur
  B: '#3a1c00',  // ears/stripes
  Y: '#ffcc99',  // belly cream
};
// alternative cat with eyes open
const catArt2 = catArt.map((row, i) => {
  if (i === 3) return '........OGGOOGGO........';
  if (i === 4) return '........OOWWOOWWO........';
  return row;
});
const pal2 = { ...pal, G: '#3a8aff', W: '#fff' };
const catSleep = catArt.map((row, i) => {
  if (i === 3) return '........O------O........';
  if (i === 4) return '........OO----OO........';
  return row;
});
const palSleep = { ...pal, '-': '#3a1c00' };
// cat tail wagging
function drawTail(x, y, ps, wag) {
  ctx.strokeStyle = '#ff8c42';
  ctx.lineWidth = ps * 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + ps * 4, y - ps * 4, x + ps * 8, y - ps * 8 + wag * ps * 3);
  ctx.stroke();
}
function loop() {
  t += 0.05;
  // cozy room bg
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#3a2a4a');
  bg.addColorStop(0.5, '#5a3a5a');
  bg.addColorStop(1, '#3a2a4a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  // window with moonlight
  const winX = w * 0.7;
  const winY = h * 0.2;
  const winW = 200;
  const winH = 250;
  ctx.fillStyle = '#1a1a3a';
  ctx.fillRect(winX, winY, winW, winH);
  // moon
  ctx.fillStyle = '#ffefb0';
  ctx.beginPath();
  ctx.arc(winX + winW * 0.7, winY + 60, 35, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a1a3a';
  ctx.beginPath();
  ctx.arc(winX + winW * 0.78, winY + 55, 30, 0, Math.PI * 2);
  ctx.fill();
  // stars in window
  for (let i = 0; i < 15; i++) {
    const sx = winX + Math.random() * winW;
    const sy = winY + Math.random() * winH;
    if (Math.sqrt((sx - (winX + winW * 0.7))**2 + (sy - (winY + 60))**2) > 35) {
      ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(t * 3 + i) * 0.3})`;
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
  }
  // window frame
  ctx.strokeStyle = '#5a3a2a';
  ctx.lineWidth = 8;
  ctx.strokeRect(winX, winY, winW, winH);
  ctx.beginPath();
  ctx.moveTo(winX + winW/2, winY);
  ctx.lineTo(winX + winW/2, winY + winH);
  ctx.moveTo(winX, winY + winH/2);
  ctx.lineTo(winX + winW, winY + winH/2);
  ctx.stroke();
  // moonlight beam
  ctx.fillStyle = 'rgba(255, 240, 180, 0.1)';
  ctx.beginPath();
  ctx.moveTo(winX, winY + winH);
  ctx.lineTo(winX + winW, winY + winH);
  ctx.lineTo(winX + winW + 100, h);
  ctx.lineTo(winX - 100, h);
  ctx.closePath();
  ctx.fill();
  // floor
  ctx.fillStyle = '#5a3a2a';
  ctx.fillRect(0, h - 80, w, 80);
  ctx.fillStyle = '#3a2a1a';
  for (let i = 0; i < 20; i++) {
    ctx.fillRect(i * (w/20), h - 80, 2, 80);
  }
  // rug
  ctx.fillStyle = '#a04060';
  ctx.beginPath();
  ctx.ellipse(w * 0.4, h - 60, 250, 30, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#802040';
  ctx.beginPath();
  ctx.ellipse(w * 0.4, h - 60, 220, 25, 0, 0, Math.PI * 2);
  ctx.fill();
  // cat
  const ps = Math.floor(Math.min(w, h) / 40);
  const cx = w * 0.4 - ps * 12;
  const cy = h - 80 - ps * 16 + 5;
  const isPet = (mx - 0.5) * w > cx - 100 && (mx - 0.5) * w < cx + 200;
  let art, palette;
  if (isPet) {
    art = catArt2;
    palette = pal2;
  } else {
    art = catSleep;
    palette = palSleep;
  }
  pixelArt(ctx, cx, cy, ps, art, palette);
  // tail wag
  const wag = Math.sin(t * (isPet ? 5 : 1)) * 0.5;
  drawTail(cx + ps * 22, cy + ps * 8, ps, wag);
  // Zzz when sleeping
  if (!isPet) {
    if (Math.random() < 0.03) {
      zzz.push({
        x: cx + ps * 8, y: cy,
        vy: -1, life: 1,
        size: 14 + Math.random() * 6
      });
    }
  }
  for (let i = zzz.length - 1; i >= 0; i--) {
    const z = zzz[i];
    z.y += z.vy;
    z.x += Math.sin(z.y * 0.05) * 0.5;
    z.life -= 0.01;
    if (z.life <= 0) { zzz.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(200, 200, 255, ${z.life})`;
    ctx.font = 'bold ' + z.size + 'px monospace';
    ctx.fillText('Z', z.x, z.y);
  }
  // food bowl
  ctx.fillStyle = '#3a8aff';
  ctx.beginPath();
  ctx.arc(w * 0.85, h - 70, 30, 0, Math.PI);
  ctx.fill();
  ctx.fillStyle = '#aa6633';
  ctx.beginPath();
  ctx.arc(w * 0.85, h - 70, 25, 0, Math.PI);
  ctx.fill();
  // fish bones
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    const fx = w * 0.85 - 15 + i * 10;
    const fy = h - 78;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + 5, fy);
    ctx.stroke();
    for (let j = 0; j < 3; j++) {
      ctx.beginPath();
      ctx.moveTo(fx + 1 + j * 2, fy - 2);
      ctx.lineTo(fx + 1 + j * 2, fy + 2);
      ctx.stroke();
    }
  }
  // pet hint
  if (isPet) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PURRRR...', cx + ps * 12, cy - 20);
    ctx.textAlign = 'left';
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
