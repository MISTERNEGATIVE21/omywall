<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saiyan Power Up</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Saiyan Power Up</div>
<script>

function pixel(ctx, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * size, y * size, size, size);
}
function pixelArt(ctx, ox, oy, size, art, palette) {
  for (let y = 0; y < art.length; y++) {
    for (let x = 0; x < art[y].length; x++) {
      const c = art[y][x];
      if (c !== ' ' && c !== '.' && palette[c]) {
        ctx.fillStyle = palette[c];
        ctx.fillRect(ox + x * size, oy + y * size, size, size);
      }
    }
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
let particles = [], bolts = [];
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
// saiyan pixel art (16x24) - spiky hair, orange gi
const saiyanArt = [
  '......KKKK......',
  '.....KKKKKK.....',
  '....KKYYYYKK....',
  '...KKYYYYYYKK...',
  '..KKYYYYYYYYKK..',
  '..KYYYYYYYYYYK..',
  '..KYYYYYYYYYYK..',
  '...KKKKKKKKKK...',
  '....YYYYYYYY....',
  '....YBYYYYBY....',
  '....YYYYYYYY....',
  '....YYYYYYYY....',
  '.....OOOOOO.....',
  '....OOOOOOOO....',
  '...OOOYYYYOOO...',
  '..OOOOYYYYOOOO..',
  '..OOOOYYYYOOOO..',
  '..OOOYYYYYYOOO..',
  '...OOOOOOOOOO...',
  '....OO....OO....',
  '....OO....OO....',
  '....BB....BB....',
  '....BB....BB....',
  '....SS....SS....',
];
const pal = {
  K: '#1a1a1a',  // black hair
  Y: '#ffcc99',  // skin
  B: '#3a1c00',  // eyes
  O: '#ff7700',  // orange gi
  S: '#5a3a1a',  // shoes
};
// power level
let powerLevel = 1;
function loop() {
  t += 0.05;
  powerLevel += 0.5;
  // bg - rocky wasteland
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#3a2030');
  sky.addColorStop(0.5, '#5a3040');
  sky.addColorStop(1, '#2a1020');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  // distant rocks/mountains
  ctx.fillStyle = '#2a1a20';
  for (let i = 0; i < 8; i++) {
    const rx = (i * 200 + Math.sin(t * 0.1 + i) * 30) % w;
    ctx.beginPath();
    ctx.moveTo(rx, h * 0.7);
    ctx.lineTo(rx + 100, h * 0.4 + Math.sin(i) * 30);
    ctx.lineTo(rx + 200, h * 0.7);
    ctx.fill();
  }
  // ground
  ctx.fillStyle = '#3a1a10';
  ctx.fillRect(0, h - 80, w, 80);
  ctx.fillStyle = '#5a2a18';
  ctx.fillRect(0, h - 80, w, 8);
  // rocks
  for (let i = 0; i < 15; i++) {
    const rx = ((i * 100 - t * 30) % w + w) % w;
    const ry = h - 60 + (i % 3) * 10;
    ctx.fillStyle = '#4a2010';
    ctx.beginPath();
    ctx.ellipse(rx, ry, 15 + (i % 3) * 5, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // aura around character
  const cx = w/2 + (mx - 0.5) * 50;
  const cy = h - 80;
  const charHeight = Math.min(w, h) / 30 * 24;
  const charWidth = Math.min(w, h) / 30 * 16;
  const charX = cx - charWidth/2;
  const charY = cy - charHeight;
  // aura - pulsing gold
  const auraSize = 1 + Math.sin(t * 5) * 0.1 + Math.min(2, powerLevel / 1000);
  const ag = ctx.createRadialGradient(cx, charY + charHeight/2, 0, cx, charY + charHeight/2, charHeight * auraSize);
  ag.addColorStop(0, 'rgba(255, 220, 100, 0.5)');
  ag.addColorStop(0.4, 'rgba(255, 180, 0, 0.3)');
  ag.addColorStop(0.8, 'rgba(255, 100, 0, 0.1)');
  ag.addColorStop(1, 'rgba(255, 100, 0, 0)');
  ctx.fillStyle = ag;
  ctx.fillRect(0, 0, w, h);
  // emit particles upward (energy)
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: cx + (Math.random() - 0.5) * charWidth * 1.5,
      y: charY + charHeight,
      vx: (Math.random() - 0.5) * 2,
      vy: -3 - Math.random() * 4,
      life: 1,
      hue: 30 + Math.random() * 30,
      r: 2 + Math.random() * 3
    });
  }
  // particles
  ctx.globalCompositeOperation = 'screen';
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx += (Math.random() - 0.5) * 0.3;
    p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
    grad.addColorStop(0, `hsla(${p.hue}, 100%, 70%, ${p.life})`);
    grad.addColorStop(1, `hsla(${p.hue}, 100%, 50%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  // lightning around character
  if (Math.random() < 0.3) {
    bolts.push({
      angle: Math.random() * Math.PI * 2,
      r: charHeight * 1.2,
      life: 1
    });
  }
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.life -= 0.1;
    if (b.life <= 0) { bolts.splice(i, 1); continue; }
    const x1 = cx + Math.cos(b.angle) * charHeight * 0.6;
    const y1 = charY + charHeight/2 + Math.sin(b.angle) * charHeight * 0.6;
    const x2 = cx + Math.cos(b.angle) * b.r;
    const y2 = charY + charHeight/2 + Math.sin(b.angle) * b.r;
    ctx.strokeStyle = `rgba(255, 255, 200, ${b.life})`;
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 15;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    const segs = 4;
    for (let s = 1; s < segs; s++) {
      const tt = s / segs;
      ctx.lineTo(x1 + (x2 - x1) * tt + (Math.random() - 0.5) * 20,
                 y1 + (y2 - y1) * tt + (Math.random() - 0.5) * 20);
    }
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  // ground crater glow
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 150);
  cg.addColorStop(0, 'rgba(255, 150, 0, 0.5)');
  cg.addColorStop(1, 'rgba(255, 100, 0, 0)');
  ctx.fillStyle = cg;
  ctx.fillRect(0, h - 200, w, 200);
  // shaking rocks
  for (let i = 0; i < 20; i++) {
    const rx = cx + (Math.random() - 0.5) * 300;
    const ry = cy - Math.random() * 100 - Math.sin(t * 3 + i) * 30;
    ctx.fillStyle = '#4a2010';
    ctx.beginPath();
    ctx.arc(rx, ry, 3 + Math.random() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  // saiyan character
  const ps = Math.floor(Math.min(w, h) / 30);
  pixelArt(ctx, charX, charY, ps, saiyanArt, pal);
  // hair flash gold when power high
  if (powerLevel > 500) {
    ctx.globalAlpha = 0.3 + Math.sin(t * 10) * 0.2;
    // overlay gold on hair area (top rows)
    const goldArt = saiyanArt.map(row => row.replace(/K/g, 'G'));
    const goldPal = { ...pal, G: '#ffd700' };
    pixelArt(ctx, charX, charY, ps, goldArt, goldPal);
    ctx.globalAlpha = 1;
  }
  // HUD
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  const powerStr = Math.floor(powerLevel).toString().padStart(8, '0');
  ctx.strokeText('POWER LEVEL: ' + powerStr, 20, 20);
  ctx.fillStyle = '#ffd700';
  ctx.fillText('POWER LEVEL: ' + powerStr, 20, 20);
  ctx.fillStyle = '#fff';
  ctx.strokeText(powerLevel > 500 ? 'SUPER SAIYAN MODE!' : 'POWERING UP...', 20, 52);
  ctx.fillText(powerLevel > 500 ? 'SUPER SAIYAN MODE!' : 'POWERING UP...', 20, 52);
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
