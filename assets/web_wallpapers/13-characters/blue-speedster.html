<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blue Speedster Run</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Blue Speedster Run</div>
<script>

function pixel(ctx, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * size, y * size, size, size);
}
function pixelArt(ctx, ox, oy, size, art, palette) {
  for (let y = 0; y < art.length; y++) {
    for (let x = 0; x < art[y].length; x++) {
      const c = art[y][x];
      if (c !== ' ' && c !== '.' && palette[c]) {
        ctx.fillStyle = palette[c];
        ctx.fillRect(ox + x * size, oy + y * size, size, size);
      }
    }
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0, scrollX = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
// speedster pixel art (16x16) - blue hedgehog-like
const run1 = [
  '.......BBBB.....',
  '......BBBBBB....',
  '......BBBWWB....',
  '......BBWWBB....',
  '......BBBBBB....',
  '......BBBBBBB...',
  '....BBBBBBBBBB..',
  '...BBBSSBBBBBB..',
  '..BBBBBBBBBBBB..',
  '..BBBBBBBBBBB...',
  '...BBBBBBBBBB...',
  '....BBB..BBB....',
  '....BB....BB....',
  '....SS....SS....',
  '....SS....SS....',
  '....SS....SS....',
];
const run2 = [
  '.......BBBB.....',
  '......BBBBBB....',
  '......BBBWWB....',
  '......BBWWBB....',
  '......BBBBBB....',
  '......BBBBBBB...',
  '....BBBBBBBBBB..',
  '...BBBSSBBBBBB..',
  '..BBBBBBBBBBBB..',
  '..BBBBBBBBBBB...',
  '...BBBBBBBBBB...',
  '....BBB..BBB....',
  '....BB....BB....',
  '.....SS..SS.....',
  '....SS....SS....',
  '...SS......SS...',
];
const ball = [
  '....BBBBBB......',
  '..BBBBBBBBBB....',
  '.BBBBWWBBBBBB...',
  '.BBBWWWWBBBBB...',
  'BBBBBBBBBBBBBB..',
  'BBBBBBBBBBBBBB..',
  'BBBBBSSBBBBBBB..',
  'BBBBSSSSBBBBBB..',
  'BBBBSSSSBBBBBB..',
  'BBBBBSSBBBBBBB..',
  'BBBBBBBBBBBBBB..',
  'BBBBBBBBBBBBBB..',
  '.BBBWWWWBBBBB...',
  '.BBBBWWBBBBBB...',
  '..BBBBBBBBBB....',
  '....BBBBBB......',
];
const pal = { B: '#3a86ff', W: '#fff', S: '#ff6b00' };
// rings
const rings = [];
for (let i = 0; i < 15; i++) rings.push({ x: 200 + i * 250, y: h * 0.5 + Math.sin(i) * 100, phase: Math.random() * Math.PI * 2 });
// background layers (parallax)
const bgClouds = [];
for (let i = 0; i < 10; i++) bgClouds.push({ x: Math.random() * 3000, y: 30 + Math.random() * 100, scale: 0.5 + Math.random() });
const bgHills = [];
for (let i = 0; i < 12; i++) bgHills.push({ x: i * 350, h: 100 + Math.random() * 80, color: `hsl(${100 + Math.random() * 40}, 60%, 50%)` });
const trees = [];
for (let i = 0; i < 20; i++) trees.push({ x: i * 200, h: 80 + Math.random() * 60 });
let isBall = false;
let ballTimer = 0;
function loop() {
  t += 0.1;
  const speed = 4 + (mx - 0.5) * 6;
  scrollX += speed;
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#4a90e2');
  sky.addColorStop(0.7, '#87ceeb');
  sky.addColorStop(1, '#b0e0e6');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  // sun
  const sunX = w * 0.8;
  const sunY = h * 0.2;
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 100);
  sunGrad.addColorStop(0, 'rgba(255, 255, 200, 0.9)');
  sunGrad.addColorStop(1, 'rgba(255, 255, 100, 0)');
  ctx.fillStyle = sunGrad;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ffff80';
  ctx.beginPath();
  ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
  ctx.fill();
  // far clouds
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  for (const c of bgClouds) {
    const cx = ((c.x - scrollX * 0.1) % (w + 300) + w + 300) % (w + 300) - 150;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(cx + i * 20 * c.scale, c.y, 15 * c.scale, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // far hills
  for (const hill of bgHills) {
    const hx = ((hill.x - scrollX * 0.3) % (w + 700) + w + 700) % (w + 700) - 350;
    ctx.fillStyle = hill.color;
    ctx.beginPath();
    ctx.arc(hx, h - 80, hill.h, Math.PI, 0);
    ctx.fill();
  }
  // trees
  for (const tr of trees) {
    const tx = ((tr.x - scrollX * 0.6) % (w + 400) + w + 400) % (w + 400) - 200;
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(tx - 6, h - 80 - tr.h, 12, tr.h);
    ctx.fillStyle = '#2a8a2a';
    ctx.beginPath();
    ctx.arc(tx, h - 80 - tr.h, tr.h * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // ground (green grass)
  ctx.fillStyle = '#3aa83a';
  ctx.fillRect(0, h - 80, w, 80);
  ctx.fillStyle = '#2a8820';
  ctx.fillRect(0, h - 80, w, 8);
  // ground texture (rushing lines)
  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
  for (let i = 0; i < 20; i++) {
    const lx = ((i * 80 - scrollX * 2) % w + w) % w;
    ctx.fillRect(lx, h - 60, 30, 2);
  }
  // motion lines
  if (speed > 5) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const ly = h - 100 - i * 20;
      const lx = ((i * 100 - scrollX * 3) % w + w) % w;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + 40, ly);
      ctx.stroke();
    }
  }
  // rings
  for (const r of rings) {
    r.phase += 0.15;
    const rx = ((r.x - scrollX) % (w * 2) + w * 2) % (w * 2) - 100;
    if (rx > -50 && rx < w + 50) {
      const stretch = Math.abs(Math.sin(r.phase));
      ctx.strokeStyle = '#ffd700';
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(rx, r.y, 15 * stretch + 2, 18, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
  // character
  ballTimer++;
  isBall = ballTimer % 120 < 30;  // ball every 2 seconds
  const ps = Math.floor(Math.min(w, h) / 30);
  const px = w * 0.3;
  const py = h - 80 - ps * 16;
  let art;
  if (isBall) {
    art = ball;
  } else {
    art = Math.floor(t * 8) % 2 === 0 ? run1 : run2;
  }
  pixelArt(ctx, px, py, ps, art, pal);
  // dust trail
  if (!isBall && speed > 4) {
    for (let i = 0; i < 5; i++) {
      const dustX = px - i * 15 - (scrollX % 15);
      const dustY = h - 90 + Math.sin(t * 4 + i) * 5;
      ctx.fillStyle = `rgba(200, 180, 140, ${0.5 - i * 0.1})`;
      ctx.beginPath();
      ctx.arc(dustX, dustY, 6 - i, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // HUD
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  const score = Math.floor(scrollX / 10);
  ctx.strokeText('SCORE: ' + score, 20, 20);
  ctx.fillText('SCORE: ' + score, 20, 20);
  ctx.strokeText('RINGS: ' + Math.floor(scrollX / 200), 20, 50);
  ctx.fillText('RINGS: ' + Math.floor(scrollX / 200), 20, 50);
  ctx.strokeText('SPEED: ' + Math.floor(speed * 50), 20, 80);
  ctx.fillText('SPEED: ' + Math.floor(speed * 50), 20, 80);
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
