<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Electric Mouse (click!)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Electric Mouse (click!)</div>
<script>

function pixel(ctx, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * size, y * size, size, size);
}
function pixelArt(ctx, ox, oy, size, art, palette) {
  for (let y = 0; y < art.length; y++) {
    for (let x = 0; x < art[y].length; x++) {
      const c = art[y][x];
      if (c !== ' ' && c !== '.' && palette[c]) {
        ctx.fillStyle = palette[c];
        ctx.fillRect(ox + x * size, oy + y * size, size, size);
      }
    }
  }
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
let bolts = [];
let particles = [];
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
window.addEventListener('click', e => {
  // thunderbolt attack
  for (let i = 0; i < 3; i++) {
    bolts.push({
      x: e.clientX + (Math.random() - 0.5) * 60,
      y: e.clientY + (Math.random() - 0.5) * 60,
      targetX: e.clientX + (Math.random() - 0.5) * 200,
      targetY: e.clientY + 200,
      life: 1
    });
  }
});
// electric mouse pixel art (16x16)
const mouseArt = [
  '......YYYY......',
  '....YYYYYYYY....',
  '...YKKYYYYKKY...',
  '..YKKKYYYYKKKY..',
  '..YKKKYYYYKKKY..',
  '...YYYYYYYYYY...',
  '..YYYYBBBBYYYY..',
  '..YYYBKKKBBYYY..',
  '..YYYBKKKBYYYY..',
  '..YYYYBBBYYYYY..',
  '...YYYYYYYYYY...',
  '....YYYYYYYY....',
  '....YY.YY.YY....',
  '....RR.RR.RR....',
  '...RRR.RR.RRR...',
  '...RRR.RR.RRR...',
];
const mousePal = {
  Y: '#ffd700',  // yellow body
  K: '#3a1c00',  // brown tips/eyes
  B: '#cc4400',  // red cheeks
  R: '#ff4400',  // feet/tail
};
const mouseArt2 = mouseArt.map((row, i) => {
  // alternate "shouting" frame with open mouth
  if (i === 9) return '..YYYYBBBYYYYY..';
  if (i === 10) return '...YYYYYYYYYY...';
  return row;
});
function drawBolt(x1, y1, x2, y2, alpha) {
  ctx.strokeStyle = `rgba(255, 255, 100, ${alpha})`;
  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 20;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  const segments = 6;
  for (let i = 1; i < segments; i++) {
    const tt = i / segments;
    const x = x1 + (x2 - x1) * tt + (Math.random() - 0.5) * 30;
    const y = y1 + (y2 - y1) * tt + (Math.random() - 0.5) * 10;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.shadowBlur = 0;
}
function loop() {
  t += 0.05;
  // bg - electric storm sky
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#1a0a2a');
  sky.addColorStop(0.5, '#3a1a4a');
  sky.addColorStop(1, '#5a2a3a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  // distant lightning flashes
  if (Math.random() < 0.02) {
    ctx.fillStyle = `rgba(200, 200, 255, ${0.2 + Math.random() * 0.3})`;
    ctx.fillRect(0, 0, w, h);
  }
  // ground - grassy field
  ctx.fillStyle = '#2a6a2a';
  ctx.fillRect(0, h - 100, w, 100);
  ctx.fillStyle = '#3a8a3a';
  ctx.fillRect(0, h - 100, w, 10);
  // grass tufts
  ctx.fillStyle = '#4aaa4a';
  for (let i = 0; i < 30; i++) {
    const gx = (i * 50 - t * 20) % w;
    ctx.fillRect(gx, h - 100, 3, 8);
    ctx.fillRect(gx + 4, h - 100, 3, 12);
  }
  // random background bolts
  if (Math.random() < 0.05) {
    bolts.push({
      x: Math.random() * w, y: 0,
      targetX: Math.random() * w, targetY: h * 0.6,
      life: 1
    });
  }
  // draw bolts
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.life -= 0.05;
    if (b.life <= 0) { bolts.splice(i, 1); continue; }
    drawBolt(b.x, b.y, b.targetX, b.targetY, b.life);
    // particles at impact
    for (let j = 0; j < 3; j++) {
      particles.push({
        x: b.targetX, y: b.targetY,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        life: 1, r: 2 + Math.random() * 2
      });
    }
  }
  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= 0.03;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(255, 255, 100, ${p.life})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  // electric mouse
  const ps = Math.floor(Math.min(w, h) / 25);
  const cx = w/2 + (mx - 0.5) * 100;
  const cy = h - 100 - ps * 16 + Math.sin(t * 4) * 8;
  // electric aura
  const ag = ctx.createRadialGradient(cx + ps * 8, cy + ps * 8, 0, cx + ps * 8, cy + ps * 8, ps * 16);
  ag.addColorStop(0, 'rgba(255, 255, 100, 0.4)');
  ag.addColorStop(0.5, 'rgba(255, 200, 0, 0.2)');
  ag.addColorStop(1, 'rgba(255, 200, 0, 0)');
  ctx.fillStyle = ag;
  ctx.fillRect(cx - ps * 8, cy - ps * 8, ps * 32, ps * 32);
  // electric sparks around
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + t * 2;
    const r = ps * 10 + Math.sin(t * 5 + i) * ps * 3;
    const sx = cx + ps * 8 + Math.cos(a) * r;
    const sy = cy + ps * 8 + Math.sin(a) * r;
    ctx.strokeStyle = 'rgba(255, 255, 100, 0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx + ps * 8, cy + ps * 8);
    const seg = 3;
    for (let s = 1; s <= seg; s++) {
      const tt = s / seg;
      ctx.lineTo(cx + ps * 8 + Math.cos(a) * r * tt + (Math.random() - 0.5) * 10,
                 cy + ps * 8 + Math.sin(a) * r * tt + (Math.random() - 0.5) * 10);
    }
    ctx.stroke();
  }
  // body - alternate frames for "thunder shout"
  const art = Math.floor(t * 4) % 4 < 2 ? mouseArt : mouseArt2;
  pixelArt(ctx, cx, cy, ps, art, mousePal);
  // tail lightning bolt
  ctx.strokeStyle = '#ffd700';
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 15;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx + 2, cy + ps * 12);
  let tailX = cx + 2;
  let tailY = cy + ps * 12;
  for (let i = 0; i < 5; i++) {
    tailX += (i % 2 ? 1 : -1) * 8 + Math.sin(t * 3 + i) * 3;
    tailY += 6;
    ctx.lineTo(tailX, tailY);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  // HUD
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.strokeText('PIKA-POWER: 100%', 20, 20);
  ctx.fillText('PIKA-POWER: 100%', 20, 20);
  ctx.strokeText('CLICK to Thunderbolt!', 20, 48);
  ctx.fillText('CLICK to Thunderbolt!', 20, 48);
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
