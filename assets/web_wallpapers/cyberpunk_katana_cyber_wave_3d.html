<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Katana Wave 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #06020c; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x06020c, 0.025);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 3D Wave Mesh Grid
        const gridX = 60;
        const gridY = 40;
        const planeGeo = new THREE.PlaneGeometry(24, 16, gridX, gridY);
        planeGeo.rotateX(-Math.PI / 2.8);

        const wireframeMat = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            wireframe: true,
            transparent: true,
            opacity: 0.7
        });

        const planeMesh = new THREE.Mesh(planeGeo, wireframeMat);
        scene.add(planeMesh);

        // Particle Sparkles
        const sparkCount = 350;
        const sparkGeo = new THREE.BufferGeometry();
        const sparkPos = new Float32Array(sparkCount * 3);

        for (let i = 0; i < sparkCount * 3; i += 3) {
            sparkPos[i] = (Math.random() - 0.5) * 20;
            sparkPos[i + 1] = Math.random() * 8;
            sparkPos[i + 2] = (Math.random() - 0.5) * 15;
        }

        sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
        const sparkMat = new THREE.PointsMaterial({
            color: 0xff0088,
            size: 0.15,
            transparent: true,
            opacity: 0.8
        });

        const sparkSystem = new THREE.Points(sparkGeo, sparkMat);
        scene.add(sparkSystem);

        const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

        function onPointerMove(e) {
            const x = (e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2);
            const y = (e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2);

            mouse.targetX = (x / window.innerWidth - 0.5) * 10;
            mouse.targetY = -(y / window.innerHeight - 0.5) * 6;
        }

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('pointermove', onPointerMove);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            mouse.x += (mouse.targetX - mouse.x) * 0.08;
            mouse.y += (mouse.targetY - mouse.y) * 0.08;

            // Deform wave plane according to mouse and sine time
            const pos = planeGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);

                const dx = vx - mouse.x;
                const dy = vy - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                const ripple = Math.sin(dist * 1.5 - time * 4.0) * Math.exp(-dist * 0.2) * 1.2;
                const waveZ = Math.sin(vx * 0.5 + time * 2.0) * Math.cos(vy * 0.5 + time * 2.0) * 0.5;

                pos.setZ(i, waveZ + ripple);
            }
            pos.needsUpdate = true;

            sparkSystem.rotation.y = time * 0.05;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
