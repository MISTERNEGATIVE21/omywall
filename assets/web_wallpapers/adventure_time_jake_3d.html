<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Stretchy Jake the Dog - Adventure Time</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #070912; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        // Setup Scene, Camera, Renderer
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x070912, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 14);

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xfff0c0, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x00f0ff, 2.5, 30);
        pointLight.position.set(-10, -5, 5);
        scene.add(pointLight);

        // 🐶 Create Jake the Dog Group
        const jakeGroup = new THREE.Group();
        scene.add(jakeGroup);

        // Jake Materials
        const yellowMat = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            roughness: 0.3,
            metalness: 0.1
        });
        const whiteMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.2
        });
        const blackMat = new THREE.MeshStandardMaterial({
            color: 0x0a0a0a,
            roughness: 0.5
        });
        const snoutMat = new THREE.MeshStandardMaterial({
            color: 0xffe640,
            roughness: 0.4
        });

        // Main Body / Head Mesh
        const headGeo = new THREE.SphereGeometry(2.8, 48, 48);
        const headMesh = new THREE.Mesh(headGeo, yellowMat);
        jakeGroup.add(headMesh);

        // Snout / Cheeks Group
        const snoutGroup = new THREE.Group();
        snoutGroup.position.set(0, -0.4, 2.0);

        const cheekGeo = new THREE.SphereGeometry(1.1, 32, 32);
        const leftCheek = new THREE.Mesh(cheekGeo, snoutMat);
        leftCheek.position.set(-0.95, 0, 0);
        leftCheek.scale.set(1.2, 0.95, 1.0);

        const rightCheek = new THREE.Mesh(cheekGeo, snoutMat);
        rightCheek.position.set(0.95, 0, 0);
        rightCheek.scale.set(1.2, 0.95, 1.0);

        snoutGroup.add(leftCheek);
        snoutGroup.add(rightCheek);

        // Black Nose
        const noseGeo = new THREE.SphereGeometry(0.55, 32, 32);
        const noseMesh = new THREE.Mesh(noseGeo, blackMat);
        noseMesh.position.set(0, 0.55, 0.6);
        noseMesh.scale.set(1.2, 0.8, 1.0);
        snoutGroup.add(noseMesh);

        jakeGroup.add(snoutGroup);

        // Eyes (Left & Right)
        const eyeGroupLeft = new THREE.Group();
        eyeGroupLeft.position.set(-1.3, 0.85, 2.1);

        const eyeGroupRight = new THREE.Group();
        eyeGroupRight.position.set(1.3, 0.85, 2.1);

        const eyeWhiteGeo = new THREE.SphereGeometry(0.95, 32, 32);
        const pupilGeo = new THREE.SphereGeometry(0.45, 32, 32);

        // Left Eye
        const leftEyeWhite = new THREE.Mesh(eyeWhiteGeo, whiteMat);
        leftEyeWhite.scale.set(1.0, 1.15, 0.5);
        const leftPupil = new THREE.Mesh(pupilGeo, blackMat);
        leftPupil.position.set(0, 0, 0.4);
        eyeGroupLeft.add(leftEyeWhite);
        eyeGroupLeft.add(leftPupil);

        // Right Eye
        const rightEyeWhite = new THREE.Mesh(eyeWhiteGeo, whiteMat);
        rightEyeWhite.scale.set(1.0, 1.15, 0.5);
        const rightPupil = new THREE.Mesh(pupilGeo, blackMat);
        rightPupil.position.set(0, 0, 0.4);
        eyeGroupRight.add(rightEyeWhite);
        eyeGroupRight.add(rightPupil);

        jakeGroup.add(eyeGroupLeft);
        jakeGroup.add(eyeGroupRight);

        // Ears (Floppy Stretchy Ears)
        const earGeo = new THREE.CylinderGeometry(0.3, 0.6, 2.2, 24);
        const leftEar = new THREE.Mesh(earGeo, yellowMat);
        leftEar.position.set(-2.6, -0.6, 0);
        leftEar.rotation.z = 0.6;

        const rightEar = new THREE.Mesh(earGeo, yellowMat);
        rightEar.position.set(2.6, -0.6, 0);
        rightEar.rotation.z = -0.6;

        jakeGroup.add(leftEar);
        jakeGroup.add(rightEar);

        // Floating Magic Particles
        const particleCount = 120;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 30;
            positions[i + 1] = (Math.random() - 0.5) * 20;
            positions[i + 2] = (Math.random() - 0.5) * 20;

            colors[i] = Math.random() > 0.5 ? 0.0 : 1.0;
            colors[i + 1] = Math.random() * 0.9 + 0.1;
            colors[i + 2] = 1.0;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMat = new THREE.PointsMaterial({
            size: 0.25,
            vertexColors: true,
            transparent: true,
            opacity: 0.85
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        // Mouse Physics Interaction & Lerp
        const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

        function onPointerMove(e) {
            const x = (e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2);
            const y = (e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2);

            mouse.targetX = (x / window.innerWidth - 0.5) * 12;
            mouse.targetY = -(y / window.innerHeight - 0.5) * 8;
        }

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('pointermove', onPointerMove);

        // Resize Listener
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop with Rubbery Elastic Lerp & Stretchy Morphing
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Smooth Spring Lerp toward Mouse
            mouse.x += (mouse.targetX - mouse.x) * 0.08;
            mouse.y += (mouse.targetY - mouse.y) * 0.08;

            // Rotate and Move Jake toward Mouse Cursor
            jakeGroup.position.x = mouse.x * 0.6;
            jakeGroup.position.y = mouse.y * 0.6;

            jakeGroup.rotation.y = mouse.x * 0.12;
            jakeGroup.rotation.x = -mouse.y * 0.12;

            // Elastic Rubbery Stretching based on distance to target
            const dx = mouse.targetX - mouse.x;
            const dy = mouse.targetY - mouse.y;
            const stretchVel = Math.sqrt(dx * dx + dy * dy);

            // Stretch head mesh along movement vector
            headMesh.scale.x = 1.0 + Math.abs(dx) * 0.15;
            headMesh.scale.y = 1.0 + Math.abs(dy) * 0.15;
            headMesh.scale.z = 1.0 + Math.sin(elapsedTime * 3) * 0.04;

            // Snout follows cursor with extra elastic delay
            snoutGroup.position.x = dx * 0.25;
            snoutGroup.position.y = -0.4 + dy * 0.25;

            // Pupils follow cursor directly
            leftPupil.position.x = Math.max(-0.25, Math.min(0.25, dx * 0.2));
            leftPupil.position.y = Math.max(-0.25, Math.min(0.25, dy * 0.2));
            rightPupil.position.x = Math.max(-0.25, Math.min(0.25, dx * 0.2));
            rightPupil.position.y = Math.max(-0.25, Math.min(0.25, dy * 0.2));

            // Floppy ears wiggle dynamically
            leftEar.rotation.z = 0.6 + Math.sin(elapsedTime * 4) * 0.25 - dx * 0.1;
            rightEar.rotation.z = -0.6 - Math.cos(elapsedTime * 4) * 0.25 - dx * 0.1;

            // Rotate Magic Particles
            particleSystem.rotation.y = elapsedTime * 0.05;
            particleSystem.rotation.x = elapsedTime * 0.03;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
