<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cursor Trail</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Cursor Trail</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h;
let mx = w/2, my = h/2;
let trail = [];
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
function loop() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
  ctx.fillRect(0, 0, w, h);
  trail.push({ x: mx, y: my, life: 1 });
  if (trail.length > 60) trail.shift();
  for (let i = 0; i < trail.length; i++) {
    const p = trail[i];
    p.life *= 0.96;
    const size = (i / trail.length) * 20 + 2;
    const hue = (i * 6 + Date.now() * 0.05) % 360;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
    grad.addColorStop(0, `hsla(${hue}, 100%, 70%, ${p.life * 0.8})`);
    grad.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  // main cursor glow
  const cg = ctx.createRadialGradient(mx, my, 0, mx, my, 60);
  cg.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
  cg.addColorStop(0.5, 'rgba(200, 220, 255, 0.3)');
  cg.addColorStop(1, 'rgba(200, 220, 255, 0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(mx, my, 60, 0, Math.PI * 2);
  ctx.fill();
  // orbiting particles around cursor
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + Date.now() * 0.003;
    const ox = mx + Math.cos(a) * 40;
    const oy = my + Math.sin(a) * 40;
    const hue = (i * 60 + Date.now() * 0.1) % 360;
    ctx.fillStyle = `hsl(${hue}, 100%, 70%)`;
    ctx.shadowColor = `hsl(${hue}, 100%, 70%)`;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(ox, oy, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
