<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magnetic Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Magnetic Field</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h;
let mx = -1000, my = -1000;
let pmx = -1000, pmy = -1000;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
window.addEventListener('mouseleave', () => { mx = -1000; my = -1000; });
const poles = [];
for (let i = 0; i < 12; i++) {
  poles.push({
    x: Math.random() * w, y: Math.random() * h,
    charge: Math.random() < 0.5 ? 1 : -1,
    phase: Math.random() * Math.PI * 2,
    driftX: (Math.random() - 0.5) * 0.3,
    driftY: (Math.random() - 0.5) * 0.3
  });
}
function loop() {
  ctx.fillStyle = 'rgba(2, 4, 12, 0.18)';
  ctx.fillRect(0, 0, w, h);
  for (const p of poles) {
    p.phase += 0.02;
    p.x += p.driftX + Math.sin(p.phase) * 0.4;
    p.y += p.driftY + Math.cos(p.phase) * 0.4;
    if (p.x < 50 || p.x > w - 50) p.driftX *= -1;
    if (p.y < 50 || p.y > h - 50) p.driftY *= -1;
  }
  // field lines from each pole
  for (const p of poles) {
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
      let x = p.x, y = p.y;
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let step = 0; step < 80; step++) {
        let fx = 0, fy = 0;
        for (const q of poles) {
          if (q === p) continue;
          const dx = x - q.x, dy = y - q.y;
          const d2 = dx*dx + dy*dy + 100;
          const f = q.charge * 50 / d2;
          fx += dx * f; fy += dy * f;
        }
        // mouse repel
        if (mx > 0) {
          const dx = x - mx, dy = y - my;
          const d2 = dx*dx + dy*dy + 100;
          const f = -200 / d2;
          fx += dx * f; fy += dy * f;
        }
        const len = Math.sqrt(fx*fx + fy*fy) + 0.001;
        x += fx / len * 3 * p.charge;
        y += fy / len * 3 * p.charge;
        if (x < 0 || x > w || y < 0 || y > h) break;
        ctx.lineTo(x, y);
      }
      const hue = p.charge > 0 ? 0 : 200;
      ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.3)`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }
  // draw poles
  for (const p of poles) {
    const r = 8 + Math.sin(p.phase * 2) * 2;
    const hue = p.charge > 0 ? 0 : 200;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
    grad.addColorStop(0, `hsla(${hue}, 100%, 70%, 0.9)`);
    grad.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `hsl(${hue}, 100%, 70%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  // cursor
  if (mx > 0) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mx, my, 20, 0, Math.PI * 2);
    ctx.stroke();
    const cg = ctx.createRadialGradient(mx, my, 0, mx, my, 100);
    cg.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
    cg.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = cg;
    ctx.fillRect(0, 0, w, h);
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
