<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ripple Effect (move & click)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Ripple Effect (move & click)</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, ripples = [];
let mx = -1000, my = -1000;
let lastSpawn = 0;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  const now = Date.now();
  if (now - lastSpawn > 80) {
    ripples.push({ x: mx, y: my, r: 0, life: 1, hue: (now * 0.1) % 360 });
    lastSpawn = now;
  }
});
window.addEventListener('click', e => {
  for (let i = 0; i < 5; i++) {
    ripples.push({ x: e.clientX, y: e.clientY, r: i * 10, life: 1, hue: Math.random() * 360 });
  }
});
function loop() {
  ctx.fillStyle = 'rgba(5, 5, 15, 0.1)';
  ctx.fillRect(0, 0, w, h);
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += 3;
    r.life -= 0.008;
    if (r.life <= 0) { ripples.splice(i, 1); continue; }
    const grad = ctx.createRadialGradient(r.x, r.y, r.r * 0.7, r.x, r.y, r.r);
    grad.addColorStop(0, `hsla(${r.hue}, 100%, 60%, 0)`);
    grad.addColorStop(0.8, `hsla(${r.hue}, 100%, 60%, ${r.life * 0.5})`);
    grad.addColorStop(1, `hsla(${r.hue}, 100%, 70%, 0)`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  // cursor trail
  if (mx > 0) {
    const cg = ctx.createRadialGradient(mx, my, 0, mx, my, 40);
    cg.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
    cg.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(mx, my, 40, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
