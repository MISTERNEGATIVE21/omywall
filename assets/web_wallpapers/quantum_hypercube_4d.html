<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Tesseract 4D Hypercube</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #03050c; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03050c, 0.02);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Outer & Inner Glass Box
        const outerGeo = new THREE.BoxGeometry(3.6, 3.6, 3.6);
        const outerMat = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            wireframe: true,
            transparent: true,
            opacity: 0.6
        });
        const outerCube = new THREE.Mesh(outerGeo, outerMat);

        const innerGeo = new THREE.BoxGeometry(1.8, 1.8, 1.8);
        const innerMat = new THREE.MeshBasicMaterial({
            color: 0xff00aa,
            wireframe: true,
            transparent: true,
            opacity: 0.8
        });
        const innerCube = new THREE.Mesh(innerGeo, innerMat);

        const hypercubeGroup = new THREE.Group();
        hypercubeGroup.add(outerCube);
        hypercubeGroup.add(innerCube);
        scene.add(hypercubeGroup);

        // Connecting Lines between outer and inner vertices
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff9d, transparent: true, opacity: 0.5 });
        const outerPos = outerGeo.attributes.position.array;
        const innerPos = innerGeo.attributes.position.array;

        const lineGeo = new THREE.BufferGeometry();
        const linePositions = new Float32Array(8 * 2 * 3);

        for (let i = 0; i < 8; i++) {
            linePositions[i * 6] = outerPos[i * 3];
            linePositions[i * 6 + 1] = outerPos[i * 3 + 1];
            linePositions[i * 6 + 2] = outerPos[i * 3 + 2];

            linePositions[i * 6 + 3] = innerPos[i * 3];
            linePositions[i * 6 + 4] = innerPos[i * 3 + 1];
            linePositions[i * 6 + 5] = innerPos[i * 3 + 2];
        }

        lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        const connectLines = new THREE.LineSegments(lineGeo, lineMat);
        hypercubeGroup.add(connectLines);

        // Background Particles
        const particleCount = 400;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            pPos[i] = (Math.random() - 0.5) * 20;
            pPos[i + 1] = (Math.random() - 0.5) * 16;
            pPos[i + 2] = (Math.random() - 0.5) * 16;
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({
            color: 0x00f0ff,
            size: 0.12,
            transparent: true,
            opacity: 0.7
        });

        const pSystem = new THREE.Points(pGeo, pMat);
        scene.add(pSystem);

        const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

        function onPointerMove(e) {
            const x = (e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2);
            const y = (e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2);

            mouse.targetX = (x / window.innerWidth - 0.5) * 2;
            mouse.targetY = -(y / window.innerHeight - 0.5) * 2;
        }

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('pointermove', onPointerMove);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            mouse.x += (mouse.targetX - mouse.x) * 0.08;
            mouse.y += (mouse.targetY - mouse.y) * 0.08;

            hypercubeGroup.rotation.y = time * 0.4 + mouse.x * 0.8;
            hypercubeGroup.rotation.x = time * 0.25 + mouse.y * 0.8;

            const scalePulse = 1.0 + Math.sin(time * 2.0) * 0.15;
            innerCube.scale.set(scalePulse, scalePulse, scalePulse);

            pSystem.rotation.y = time * 0.03;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
