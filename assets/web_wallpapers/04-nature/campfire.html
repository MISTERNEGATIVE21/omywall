<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campfire</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Campfire</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, particles = [];
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function makeParticle() {
  const baseX = w/2 + (Math.random() - 0.5) * 60;
  const baseY = h * 0.85;
  return {
    x: baseX, y: baseY,
    vx: (Math.random() - 0.5) * 0.8,
    vy: -1 - Math.random() * 2.5,
    r: 6 + Math.random() * 14,
    life: 1,
    decay: 0.008 + Math.random() * 0.012,
    hue: 10 + Math.random() * 40
  };
}
function loop() {
  // dark forest bg
  const g = ctx.createRadialGradient(w/2, h*0.85, 50, w/2, h*0.85, h);
  g.addColorStop(0, '#3a2010');
  g.addColorStop(0.5, '#1a0a05');
  g.addColorStop(1, '#050201');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  // logs
  ctx.fillStyle = '#1a0e05';
  ctx.save();
  ctx.translate(w/2, h * 0.88);
  ctx.rotate(-0.2);
  ctx.fillRect(-80, -8, 160, 16);
  ctx.restore();
  ctx.save();
  ctx.translate(w/2, h * 0.88);
  ctx.rotate(0.25);
  ctx.fillRect(-80, -8, 160, 16);
  ctx.restore();
  // emit particles
  const emit = 4 + Math.floor((my) * 6);
  for (let i = 0; i < emit; i++) particles.push(makeParticle());
  // mouse influence
  const dx = (mx - 0.5) * 2;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vx += dx * 0.02;
    p.x += p.vx;
    p.y += p.vy;
    p.r *= 0.985;
    p.life -= p.decay;
    if (p.life <= 0 || p.r < 0.5) { particles.splice(i, 1); continue; }
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    grad.addColorStop(0, `hsla(${p.hue + (1-p.life)*30}, 100%, 70%, ${p.life * 0.8})`);
    grad.addColorStop(0.5, `hsla(${p.hue}, 100%, 50%, ${p.life * 0.4})`);
    grad.addColorStop(1, `hsla(${p.hue - 10}, 100%, 30%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  // glow on ground
  const glow = ctx.createRadialGradient(w/2, h*0.88, 0, w/2, h*0.88, 250);
  glow.addColorStop(0, 'rgba(255, 150, 50, 0.3)');
  glow.addColorStop(1, 'rgba(255, 100, 30, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
