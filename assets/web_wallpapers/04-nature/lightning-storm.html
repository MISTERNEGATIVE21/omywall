<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lightning Storm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Lightning Storm</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
let flashAlpha = 0;
let nextBolt = 0;
let bolts = [];
function makeBolt() {
  const startX = Math.random() * w;
  const segments = [{ x: startX, y: 0 }];
  let x = startX, y = 0;
  while (y < h * 0.7) {
    x += (Math.random() - 0.5) * 60;
    y += 15 + Math.random() * 25;
    segments.push({ x, y });
  }
  // branches
  const branches = [];
  for (let i = 2; i < segments.length - 2; i++) {
    if (Math.random() < 0.3) {
      const start = segments[i];
      const branch = [{ x: start.x, y: start.y }];
      let bx = start.x, by = start.y;
      const dir = Math.random() < 0.5 ? -1 : 1;
      for (let j = 0; j < 4 + Math.random() * 4; j++) {
        bx += dir * (5 + Math.random() * 15);
        by += 10 + Math.random() * 15;
        branch.push({ x: bx, y: by });
      }
      branches.push(branch);
    }
  }
  return { main: segments, branches, life: 1 };
}
function loop() {
  nextBolt--;
  if (nextBolt <= 0) {
    bolts.push(makeBolt());
    flashAlpha = 0.6;
    nextBolt = 60 + Math.random() * 240;
  }
  // storm sky
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#0a0a18');
  sky.addColorStop(0.7, '#1a1a28');
  sky.addColorStop(1, '#0a0a14');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  // flash
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(180, 200, 255, ${flashAlpha})`;
    ctx.fillRect(0, 0, w, h);
    flashAlpha *= 0.85;
  }
  // bolts
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.life -= 0.05;
    if (b.life <= 0) { bolts.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(200, 220, 255, ${b.life})`;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#9eb8ff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    for (let j = 0; j < b.main.length; j++) {
      const p = b.main[j];
      if (j === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    ctx.lineWidth = 1;
    for (const br of b.branches) {
      ctx.beginPath();
      for (let j = 0; j < br.length; j++) {
        const p = br[j];
        if (j === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
  }
  ctx.shadowBlur = 0;
  // rain
  ctx.strokeStyle = 'rgba(170, 200, 230, 0.25)';
  ctx.lineWidth = 1;
  const wind = (mx - 0.5) * 4;
  for (let i = 0; i < 200; i++) {
    const x = (i * 73 + Math.sin(i) * 100 + Date.now() * 0.1 * wind) % (w + 100) - 50;
    const y = (i * 137 + Date.now() * 0.3) % h;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - wind, y + 15);
    ctx.stroke();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
