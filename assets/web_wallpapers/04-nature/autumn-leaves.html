<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Autumn Leaves</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Autumn Leaves</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, leaves = [];
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
const colors = ['#d2691e', '#ff6347', '#daa520', '#b8860b', '#cd5c5c', '#8b4513', '#ff8c00'];
function makeLeaf(initial) {
  return {
    x: Math.random() * w,
    y: initial ? Math.random() * h : -20,
    vx: (Math.random() - 0.5) * 0.8,
    vy: 0.4 + Math.random() * 1.2,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.05,
    size: 8 + Math.random() * 12,
    color: colors[Math.floor(Math.random() * colors.length)],
    sway: Math.random() * Math.PI * 2,
    swaySpeed: 0.02 + Math.random() * 0.03
  };
}
for (let i = 0; i < 60; i++) leaves.push(makeLeaf(true));
function drawLeaf(x, y, size, rot, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.bezierCurveTo(size*0.7, -size*0.5, size*0.7, size*0.5, 0, size);
  ctx.bezierCurveTo(-size*0.7, size*0.5, -size*0.7, -size*0.5, 0, -size);
  ctx.fill();
  // vein
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.lineTo(0, size);
  ctx.stroke();
  ctx.restore();
}
function loop() {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#3a2010');
  g.addColorStop(1, '#1a1008');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  const wind = (mx - 0.5) * 1.5;
  for (const l of leaves) {
    l.sway += l.swaySpeed;
    l.x += l.vx + Math.sin(l.sway) * 1.2 + wind;
    l.y += l.vy + (my - 0.5) * 0.5;
    l.rot += l.vr + wind * 0.02;
    if (l.y > h + 20) { Object.assign(l, makeLeaf(false)); }
    if (l.x < -30) l.x = w + 30;
    if (l.x > w + 30) l.x = -30;
    drawLeaf(l.x, l.y, l.size, l.rot, l.color);
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
