<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drifting Clouds</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Drifting Clouds</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
const clouds = [];
for (let i = 0; i < 15; i++) {
  clouds.push({
    x: Math.random() * w * 1.4 - w * 0.2,
    y: Math.random() * h * 0.7,
    scale: 0.4 + Math.random() * 1.2,
    speed: 0.15 + Math.random() * 0.4,
    puffs: 4 + Math.floor(Math.random() * 4)
  });
}
function loop() {
  t += 0.005;
  // sky gradient (day to dusk cycle)
  const cycle = (Math.sin(t * 0.3) + 1) / 2;
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, `hsl(${220 - cycle * 60}, 60%, ${20 + cycle * 30}%)`);
  sky.addColorStop(1, `hsl(${30 + cycle * 180}, 70%, ${40 + cycle * 20}%)`);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  // sun
  const sunX = w * (0.2 + cycle * 0.6 + (mx - 0.5) * 0.2);
  const sunY = h * (0.3 + (1 - cycle) * 0.4 + (my - 0.5) * 0.1);
  const sunR = 40 + cycle * 20;
  const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 3);
  sg.addColorStop(0, `rgba(255, 240, 200, ${0.8 + cycle * 0.2})`);
  sg.addColorStop(0.3, `rgba(255, 180, 100, 0.5)`);
  sg.addColorStop(1, `rgba(255, 100, 50, 0)`);
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, w, h);
  // clouds (sorted by scale = depth)
  clouds.sort((a, b) => a.scale - b.scale);
  for (const c of clouds) {
    c.x += c.speed + (mx - 0.5) * c.scale * 0.5;
    if (c.x > w + 200) c.x = -200;
    const cloudAlpha = 0.5 + c.scale * 0.3;
    const cloudColor = cycle > 0.5
      ? `rgba(255, 230, 200, ${cloudAlpha})`
      : `rgba(200, 200, 230, ${cloudAlpha})`;
    ctx.fillStyle = cloudColor;
    for (let p = 0; p < c.puffs; p++) {
      const px = c.x + p * 30 * c.scale - (c.puffs * 15 * c.scale);
      const py = c.y + Math.sin(p * 1.7 + t) * 5 * c.scale;
      const pr = (25 + p * 5) * c.scale;
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
