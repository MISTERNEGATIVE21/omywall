<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rainfall</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="label">Rainfall</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, drops = [], ripples = [];
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function makeDrop() {
  return {
    x: Math.random() * w * 1.2 - w * 0.1,
    y: Math.random() * -h,
    len: 10 + Math.random() * 20,
    vy: 8 + Math.random() * 8,
    a: 0.2 + Math.random() * 0.4
  };
}
for (let i = 0; i < 400; i++) drops.push(makeDrop());
function loop() {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#1a2030');
  g.addColorStop(1, '#0a1018');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  // distant glow from mouse
  const mg = ctx.createRadialGradient(mx * w, my * h, 0, mx * w, my * h, 200);
  mg.addColorStop(0, 'rgba(100, 150, 200, 0.15)');
  mg.addColorStop(1, 'rgba(100, 150, 200, 0)');
  ctx.fillStyle = mg;
  ctx.fillRect(0, 0, w, h);
  // wind from mouse
  const wind = (mx - 0.5) * 3;
  for (const d of drops) {
    d.x += wind;
    d.y += d.vy;
    if (d.y > h) {
      if (Math.random() < 0.3) ripples.push({ x: d.x, y: h - 5, r: 0, a: 0.5 });
      d.y = -20;
      d.x = Math.random() * w * 1.2 - w * 0.1;
    }
    ctx.strokeStyle = `rgba(170, 200, 230, ${d.a})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - wind * 0.5, d.y + d.len);
    ctx.stroke();
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += 1.2;
    r.a -= 0.015;
    if (r.a <= 0) { ripples.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(170, 200, 230, ${r.a})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, r.r, r.r * 0.3, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
