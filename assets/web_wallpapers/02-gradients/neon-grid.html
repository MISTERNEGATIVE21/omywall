<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Synthwave Neon Grid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function loop() {
  t += 0.01;
  // sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#0a0220');
  sky.addColorStop(0.45, '#3a0a4f');
  sky.addColorStop(0.55, '#ff006e');
  sky.addColorStop(0.6, '#1a0028');
  sky.addColorStop(1, '#02000a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  // sun
  const sunY = h * 0.42;
  const sunR = Math.min(w, h) * 0.18;
  const sunGrad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
  sunGrad.addColorStop(0, '#ffbe0b');
  sunGrad.addColorStop(0.5, '#fb5607');
  sunGrad.addColorStop(1, '#ff006e');
  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(w/2, sunY, sunR, 0, Math.PI * 2);
  ctx.fill();
  // sun stripes
  ctx.fillStyle = '#02000a';
  for (let i = 0; i < 6; i++) {
    const y = sunY + sunR * 0.3 + i * 8;
    if (y < sunY + sunR) {
      const halfW = Math.sqrt(sunR*sunR - (y - sunY)*(y - sunY));
      ctx.fillRect(w/2 - halfW, y, halfW * 2, 4 + i);
    }
  }
  // grid floor
  const horizon = h * 0.6;
  ctx.strokeStyle = '#ff00ff';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#ff00ff';
  ctx.shadowBlur = 8;
  // horizontal lines
  for (let i = 0; i < 20; i++) {
    const z = (i + (t * 0.5) % 1);
    const y = horizon + (h - horizon) * (z * z) / 400;
    if (y > horizon && y < h) {
      const alpha = Math.max(0, 1 - (y - horizon) / (h - horizon) - 0.1);
      ctx.strokeStyle = `rgba(255, 0, 255, ${alpha})`;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
  }
  // vertical lines (perspective)
  for (let i = -20; i <= 20; i++) {
    const xBottom = w/2 + i * (w / 10);
    ctx.strokeStyle = `rgba(255, 0, 255, 0.6)`;
    ctx.beginPath();
    ctx.moveTo(w/2, horizon);
    ctx.lineTo(xBottom, h);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
