<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sunset Drift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h, t = 0;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
function loop() {
  t += 0.003;
  // animated sunset gradient
  const hueShift = (mx - 0.5) * 30;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, `hsl(${260 + hueShift}, 70%, 12%)`);
  g.addColorStop(0.4, `hsl(${300 + hueShift}, 80%, 30%)`);
  g.addColorStop(0.65, `hsl(${20 + hueShift}, 90%, 55%)`);
  g.addColorStop(0.8, `hsl(${40 + hueShift}, 90%, 60%)`);
  g.addColorStop(1, `hsl(${200 + hueShift}, 60%, 18%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  // sun
  const sunY = h * (0.55 + Math.sin(t * 0.3) * 0.05 + (my - 0.5) * 0.1);
  const sunR = Math.min(w, h) * 0.12;
  const sunGrad = ctx.createRadialGradient(w/2, sunY, 0, w/2, sunY, sunR * 2);
  sunGrad.addColorStop(0, 'rgba(255, 240, 200, 1)');
  sunGrad.addColorStop(0.3, 'rgba(255, 180, 80, 0.8)');
  sunGrad.addColorStop(1, 'rgba(255, 100, 50, 0)');
  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(w/2, sunY, sunR * 2, 0, Math.PI * 2);
  ctx.fill();
  // sun reflection on water
  ctx.fillStyle = 'rgba(255, 200, 100, 0.2)';
  ctx.fillRect(w/2 - 2, sunY, 4, h - sunY);
  // clouds
  for (let i = 0; i < 5; i++) {
    const cx = ((t * 30 + i * 300) % (w + 400)) - 200;
    const cy = h * (0.15 + i * 0.05);
    ctx.fillStyle = `rgba(255, 200, 220, ${0.15 - i * 0.02})`;
    for (let j = 0; j < 6; j++) {
      ctx.beginPath();
      ctx.arc(cx + j * 30, cy + Math.sin(j) * 5, 20 + j * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
