<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Liquid Color Blobs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .label {
    position: fixed; bottom: 16px; right: 20px; color: rgba(255,255,255,0.45);
    font: 12px 'Segoe UI', system-ui, sans-serif; pointer-events: none;
    letter-spacing: 0.05em;
  }
  
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let w, h;
let mx = 0.5, my = 0.5;
function resize() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
window.addEventListener('resize', resize); resize();
window.addEventListener('mousemove', e => { mx = e.clientX / w; my = e.clientY / h; });
const blobs = [];
for (let i = 0; i < 6; i++) {
  blobs.push({
    x: Math.random(), y: Math.random(),
    vx: (Math.random() - 0.5) * 0.0008,
    vy: (Math.random() - 0.5) * 0.0008,
    r: 0.15 + Math.random() * 0.15,
    hue: i * 60
  });
}
let t = 0;
function loop() {
  t += 0.01;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'screen';
  for (const b of blobs) {
    b.x += b.vx; b.y += b.vy;
    if (b.x < 0 || b.x > 1) b.vx *= -1;
    if (b.y < 0 || b.y > 1) b.vy *= -1;
    const x = (b.x + (mx - 0.5) * 0.05) * w;
    const y = (b.y + (my - 0.5) * 0.05) * h;
    const r = (b.r + Math.sin(t + b.hue) * 0.03) * Math.min(w, h);
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `hsla(${b.hue + t * 20}, 100%, 60%, 0.95)`);
    grad.addColorStop(0.6, `hsla(${b.hue + t * 20}, 100%, 50%, 0.4)`);
    grad.addColorStop(1, `hsla(${b.hue + t * 20}, 100%, 40%, 0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
