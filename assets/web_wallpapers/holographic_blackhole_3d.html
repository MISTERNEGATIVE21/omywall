<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Holographic Black Hole</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const particleCount = 1200;
        const centerX = () => width / 2;
        const centerY = () => height / 2;

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 100 + Math.random() * (Math.max(width, height) * 0.45);
            particles.push({
                angle: angle,
                radius: radius,
                speed: (0.005 + Math.random() * 0.015) * (300 / radius),
                size: 1 + Math.random() * 2.5,
                hue: 15 + Math.random() * 45, // Gold / Fire / Orange
                alpha: 0.3 + Math.random() * 0.7
            });
        }

        let time = 0;

        function animate() {
            time += 0.02;

            // Deep spatial fade
            ctx.fillStyle = 'rgba(2, 2, 8, 0.25)';
            ctx.fillRect(0, 0, width, height);

            const cx = centerX();
            const cy = centerY();
            const horizonRadius = Math.min(width, height) * 0.12;

            // 1. Accretion Disk Back Glow
            const glow = ctx.createRadialGradient(cx, cy, horizonRadius * 0.8, cx, cy, horizonRadius * 3.5);
            glow.addColorStop(0, 'rgba(255, 120, 20, 0.8)');
            glow.addColorStop(0.3, 'rgba(255, 50, 100, 0.4)');
            glow.addColorStop(0.7, 'rgba(100, 20, 200, 0.2)');
            glow.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(cx, cy, horizonRadius * 3.5, 0, Math.PI * 2);
            ctx.fill();

            // 2. Swirling Accretion Disk Particles
            particles.forEach(p => {
                p.angle += p.speed;
                p.radius -= 0.15;
                if (p.radius < horizonRadius) {
                    p.radius = 100 + Math.random() * (Math.max(width, height) * 0.45);
                    p.angle = Math.random() * Math.PI * 2;
                }

                // Elliptical distortion for 3D tilt
                const tilt = 0.35;
                const x = cx + Math.cos(p.angle) * p.radius;
                const y = cy + Math.sin(p.angle) * (p.radius * tilt);

                const distFromCenter = p.radius;
                const brightness = Math.min(1, distFromCenter / (horizonRadius * 2));

                ctx.fillStyle = `hsla(${p.hue + (time * 10) % 40}, 100%, ${50 + brightness * 30}%, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, p.size * (1 + (1 - tilt) * Math.sin(p.angle)), 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Gravitational Lensing Light Ring (Photon Sphere)
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(1, 0.35);

            const photonRing = ctx.createRadialGradient(0, 0, horizonRadius * 0.95, 0, 0, horizonRadius * 1.3);
            photonRing.addColorStop(0, 'rgba(255, 255, 255, 1)');
            photonRing.addColorStop(0.4, 'rgba(255, 180, 50, 0.9)');
            photonRing.addColorStop(0.8, 'rgba(255, 30, 100, 0.5)');
            photonRing.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = photonRing;
            ctx.beginPath();
            ctx.arc(0, 0, horizonRadius * 1.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 4. Event Horizon (Black Void Core)
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(cx, cy, horizonRadius, 0, Math.PI * 2);
            ctx.fill();

            // Core Edge Sharp Glow
            ctx.strokeStyle = 'rgba(255, 240, 200, 0.9)';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
