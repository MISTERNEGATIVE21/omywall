<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanta 3D Waves & Topology Mesh</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060914; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const COLS = 48;
  const ROWS = 32;
  const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

  window.addEventListener('mousemove', e => {
    mouse.targetX = (e.clientX / width - 0.5) * 2;
    mouse.targetY = (e.clientY / height - 0.5) * 2;
  });

  let t = 0;
  function project(x, y, z) {
    const fov = 450;
    const distance = 600;
    const pz = z + distance;
    const scale = fov / pz;
    return {
      x: width * 0.5 + x * scale,
      y: height * 0.55 + y * scale,
      scale,
      z: pz
    };
  }

  function animate() {
    t += 0.02;
    mouse.x += (mouse.targetX - mouse.x) * 0.05;
    mouse.y += (mouse.targetY - mouse.y) * 0.05;

    ctx.fillStyle = '#060914';
    ctx.fillRect(0, 0, width, height);

    // Compute 3D mesh grid points
    const grid = [];
    const spacingX = 28;
    const spacingZ = 28;
    const startX = -(COLS * spacingX) * 0.5;
    const startZ = -(ROWS * spacingZ) * 0.5;

    for (let r = 0; r <= ROWS; r++) {
      grid[r] = [];
      for (let c = 0; c <= COLS; c++) {
        const x = startX + c * spacingX;
        const z = startZ + r * spacingZ;

        // Wave topology equations
        const distFromCenter = Math.sqrt(x * x + z * z) * 0.005;
        const wave1 = Math.sin(x * 0.008 + t + distFromCenter * 3.0) * 45;
        const wave2 = Math.cos(z * 0.009 - t * 1.2) * 35;
        const wave3 = Math.sin((x + z) * 0.005 + t * 0.8) * 25;
        const y = wave1 + wave2 + wave3 + 120;

        // Apply 3D camera rotation with mouse tilt
        const rotX = 0.65 + mouse.y * 0.25;
        const rotY = mouse.x * 0.35;

        // Y-axis rotation
        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        const rx = x * cosY - z * sinY;
        const rz1 = x * sinY + z * cosY;

        // X-axis rotation
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        const ry = y * cosX - rz1 * sinX;
        const rz = y * sinX + rz1 * cosX;

        grid[r][c] = project(rx, ry, rz);
      }
    }

    // Draw illuminated 3D topology surface polygons & wireframe lines
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p1 = grid[r][c];
        const p2 = grid[r][c + 1];
        const p3 = grid[r + 1][c + 1];
        const p4 = grid[r + 1][c];

        // Normal lighting approximation
        const depth = (p1.z + p2.z + p3.z + p4.z) * 0.25;
        const depthNorm = Math.max(0, Math.min(1, (1000 - depth) / 700));

        // Color gradient based on wave height and depth
        const hue = 180 + (r / ROWS) * 120 + Math.sin(t) * 30;
        const strokeColor = `hsla(${hue}, 95%, ${40 + depthNorm * 30}%, ${depthNorm * 0.75})`;
        const fillColor = `hsla(${hue}, 85%, 20%, ${depthNorm * 0.25})`;

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();

        ctx.fillStyle = fillColor;
        ctx.fill();

        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1.0;
        ctx.stroke();
      }
    }

    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
</body>
</html>
