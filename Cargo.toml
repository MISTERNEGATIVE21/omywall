[package]
name = "omywall"
version = "4.5.0"
edition = "2021"
authors = ["MisterNegative <misternegative21@gmail.com>"]
description = "Ultra-lightweight hardware-accelerated video, Web 3D & desktop wallpaper engine for Linux Wayland"

[dependencies]
mpv = "0.2"
ratatui = "0.29"
crossterm = "0.28"
egui = "0.29"
eframe = "0.29"
egui_extras = { version = "0.29", features = ["image", "svg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
rfd = "0.15"
directories = "5.0"
dirs = "5.0"
walkdir = "2.5"
x11-dl = "2.21"
libc = "0.2"
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }
tikv-jemallocator = { version = "0.6", optional = true }
gtk = "0.18"
glib = "0.18"
gdk = "0.18"
gio = "0.18"
cairo-rs = { version = "0.18.5", features = ["png"] }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
