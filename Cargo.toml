[package]
name = "omywall"
version = "5.0.0"
edition = "2021"
authors = ["MisterNegative <misternegative21@gmail.com>"]
description = "Ultra-lightweight hardware-accelerated video, Web 3D & desktop wallpaper engine for Linux Wayland"

[dependencies]
mpv = "0.2"
ratatui = "0.29"
crossterm = "0.28"
iced = { version = "0.14", features = ["image", "svg", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
rfd = "0.15"
directories = "5.0"
dirs = "5.0"
walkdir = "2.5"
x11-dl = "2.21"
libc = "0.2"
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }
tikv-jemallocator = { version = "0.6", optional = true }
gtk = "0.18"
glib = "0.18"
gdk = "0.18"
gio = "0.18"
cairo-rs = { version = "0.18.5", features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
