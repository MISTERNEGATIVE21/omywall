[package]
name = "omywall"
version = "0.1.0"
edition = "2021"
authors = ["MisterNegative <misternegative21@gmail.com>"]
description = "Lightweight hardware-accelerated video, web stream & GIF wallpaper manager for Linux"

[dependencies]
mpv = "0.2"
ratatui = "0.29"
crossterm = "0.28"
egui = "0.29"
eframe = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
rfd = "0.15"
directories = "5.0"
dirs = "5.0"
walkdir = "2.5"
x11-dl = "2.21"
libc = "0.2"
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
